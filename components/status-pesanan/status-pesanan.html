<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status Pesanan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="components/status-pesanan/status-pesanan.css">

</head>
  
<body>
<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>
  
<!-- HERO -->
<div class="package-hero">
  <h1>Status Pesanan</h1>
  <p>Status paket dan detail pesanan</p>
</div>

<section class="status-wrapper">

  <!-- LOADING CARD -->

  <div style="
    width: 100%;
    padding: 120px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius: 24px;
    background: rgba(18,18,28,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
    font-family:'Plus Jakarta Sans', sans-serif;
  ">

    <h2 id="loadingText" style="margin-bottom:10px;">
      Memuat Data...
    </h2>

    <div id="loadingTimer" style="
      font-size:22px;
      font-weight:700;
      margin-bottom:10px;
      color:#9f7aea;
    ">
      10:00
    </div>

    <p style="opacity:.8; margin-bottom:6px;">
      Invoice sedang dibuat, mohon tunggu
    </p>

    <p style="opacity:.6;">
      Invoice:
    </p>

    <h3
    id="loadingInvoice"
    style="margin-top:5px;color:#9f7aea;">
-
</h3>

  </div>

</section>

<div id="footer-container"></div>

<link rel="stylesheet" href="components/footer.css">
<script src="components/footer.js"></script>

<script src="components/status-pesanan/status-pesanan.js"></script>
</body>
</html>
