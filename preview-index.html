<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title>Preview</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Poppins,sans-serif;
background:
linear-gradient(
135deg,
#493d84 0%,
#8662b2 90%
);
color:#fff;
overflow-x:hidden;
min-height:100vh;
}

/* SECTION */

.hero{
width:100%;
min-height:100vh;

position:relative;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

padding:40px 24px;
}

.container{
position:relative;
width:100%;
max-width:650px;
margin:auto;
text-align:center;
}

.floating-icons{
position:absolute;
inset:0;
pointer-events:none;
}

.floating-icon{
position:absolute;

width:48px;
height:48px;

display:flex;
justify-content:center;
align-items:center;

border-radius:18px;

background:linear-gradient(
180deg,
rgba(255,255,255,.18),
rgba(255,255,255,.08)
);

border:1px solid rgba(255,255,255,.22);

box-shadow:
0 12px 28px rgba(0,0,0,.22),
inset 0 1px 0 rgba(255,255,255,.25);

backdrop-filter:blur(12px);

animation:float 4s ease-in-out infinite;
}

.floating-icon i{
font-size:22px;
color:#fff;
}

/* Posisi */

.floating-icons{
position:absolute;
inset:0;
pointer-events:none;
}

.shield{
left:clamp(-10px,-8vw,-90px);
top:50px;

animation-delay:0s;
}

.diamond{
right:clamp(-10px,-8vw,-90px);
top:-10px;

animation-delay:.8s;
}

.bolt{
right:clamp(-10px,-8vw,-90px);
bottom:70px;

animation-delay:1.6s;
}

/* Glow */

.icon-green{
box-shadow:
0 0 18px rgba(80,255,120,.35);
}

.icon-blue{
box-shadow:
0 0 18px rgba(0,210,255,.35);
}

.icon-gold{
box-shadow:
0 0 18px rgba(80,120,255,.35);
}

/* TITLE */

.hero-title{
font-size:clamp(38px,6vw,62px);
font-weight:800;
line-height:1.2;

text-shadow:
0 10px 25px rgba(0,0,0,.25);

margin-bottom:28px;
}

.hero-title span{
display:block;
}

/* TRUST */

.trust{

display:inline-flex;
align-items:center;
gap:10px;

padding:12px 22px;

border-radius:999px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(12px);
margin-bottom:28px;

font-size:22px;
font-weight:700;

box-shadow:
0 0 18px rgba(255,255,255,.10),
0 8px 25px rgba(0,0,0,.18);

animation:trustGlow 3s ease-in-out infinite;
transition:.35s;
}

.trust .dot{
width:18px;
height:18px;

background:#39d86a;
border-radius:50%;
}

/* DESC */

.desc{
font-size:18px;
line-height:1.8;

color:rgba(255,255,255,.92);
max-width:560px;
margin:auto auto 45px;
}

/* STATS */

.stats{
display:flex;
justify-content:center;

gap:40px;
flex-wrap:wrap;
}

.stat h2{
font-size:42px;
font-weight:800;
}

.stat p{
opacity:.8;
margin-top:6px;
}

@keyframes trustGlow{

0%,100%{
box-shadow:
0 0 18px rgba(255,255,255,.10),
0 8px 25px rgba(0,0,0,.18);
}

50%{
box-shadow:
0 0 30px rgba(255,255,255,.18),
0 10px 35px rgba(255,255,255,.12);
}
}

@keyframes float{

0%,100%{
transform:translateY(0) rotate(-3deg);
}

50%{
transform:translateY(-10px) rotate(3deg);
}

}
  
</style>

</head>

<body>

<section class="hero">
  
<div class="container">

<div class="floating-icons">

  <div class="floating-icon shield icon-green">
    <i class="fa-solid fa-shield-halved"></i>
  </div>

  <div class="floating-icon diamond icon-blue">
    <i class="fa-solid fa-gem"></i>
  </div>

  <div class="floating-icon bolt icon-gold">
    <i class="fa-solid fa-bolt"></i>
  </div>

</div>

<h1 class="hero-title">
<span>Aplikasi Premium</span>
<span>Kebutuhan Medsos</span>
<span>Topup Game</span>
</h1>

<div class="trust">

<div class="dot"></div>
<span>Aman & Terpercaya</span>
</div>

<p class="desc">
Dapatkan akses premium ke aplikasi favoritmu,
kebutuhan media sosial,
dan top up game dengan harga terjangkau,
layanan aman,
dan support 24/7.
</p>

<div class="stats">

<div class="stat">
<h2>1000+</h2>
<p>Pelanggan</p>
</div>

<div class="stat">
<h2>50+</h2>
<p>Kategori</p>
</div>

<div class="stat">
<h2>24/7</h2>
<p>Support</p>
</div>

</div>

</div>

</section>

<script>

</script>

</body>
</html>
