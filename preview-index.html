<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preview</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Poppins,sans-serif;
background:
linear-gradient(
135deg,
#493d84 0%,
#8662b2 90%
);
color:#fff;
overflow-x:hidden;
min-height:100vh;
}

/* SECTION */

.hero{
width:100%;
min-height:100vh;

position:relative;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

padding:40px 24px;
}

.container{
width:100%;
max-width:650px;
text-align:center;
}

.float-icon{
position:absolute;

width:54px;
height:54px;

display:flex;
align-items:center;
justify-content:center;

border-radius:18px;
background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.18);
backdrop-filter:blur(12px);

box-shadow:
0 8px 25px rgba(0,0,0,.20),
0 0 20px rgba(255,255,255,.08);

animation:float 4s ease-in-out infinite;

}

.float-icon svg{
width:26px;
height:26px;

stroke:white;
stroke-width:2;

fill:none;
}

/* posisi */

.icon-shield{
top:28%;
left:18%;

animation-delay:0s;
}

.icon-diamond{
top:22%;
right:18%;

animation-delay:.8s;
}

.icon-bolt{
bottom:28%;
right:18%;

animation-delay:1.6s;
}

/* glow warna */

.icon-shield{
box-shadow:
0 0 20px rgba(0,220,255,.35);
}

.icon-diamond{
box-shadow:
0 0 20px rgba(0,255,120,.30);
}

.icon-bolt{
box-shadow:
0 0 20px rgba(70,110,255,.35);
}

/* TITLE */

.hero-title{
font-size:clamp(38px,6vw,62px);
font-weight:800;
line-height:1.2;

text-shadow:
0 10px 25px rgba(0,0,0,.25);

margin-bottom:28px;
}

.hero-title span{
display:block;
}

/* TRUST */

.trust{

display:inline-flex;
align-items:center;
gap:10px;

padding:12px 22px;

border-radius:999px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(12px);
margin-bottom:28px;

font-size:22px;
font-weight:700;

box-shadow:
0 0 18px rgba(255,255,255,.10),
0 8px 25px rgba(0,0,0,.18);

animation:trustGlow 3s ease-in-out infinite;
transition:.35s;
}

.trust .dot{
width:18px;
height:18px;

background:#39d86a;
border-radius:50%;
}

/* DESC */

.desc{
font-size:18px;
line-height:1.8;

color:rgba(255,255,255,.92);
max-width:560px;
margin:auto auto 45px;
}

/* STATS */

.stats{
display:flex;
justify-content:center;

gap:40px;
flex-wrap:wrap;
}

.stat h2{
font-size:42px;
font-weight:800;
}

.stat p{
opacity:.8;
margin-top:6px;
}

@keyframes trustGlow{

0%,100%{
box-shadow:
0 0 18px rgba(255,255,255,.10),
0 8px 25px rgba(0,0,0,.18);
}

50%{
box-shadow:
0 0 30px rgba(255,255,255,.18),
0 10px 35px rgba(255,255,255,.12);
}
}

@keyframes float{
0%,100%{
transform:
translateY(0px);
}

50%{
transform:
translateY(-10px);
}
}
  
</style>

</head>

<body>

<section class="hero">

<div class="float-icon icon-shield">
  
<svg viewBox="0 0 24 24">
<path d="M12 3
L19 6
V11
C19 16
16 19
12 21
C8 19
5 16
5 11
V6
L12 3"/>
</svg>

</div>

<div class="float-icon icon-diamond">

<svg viewBox="0 0 24 24">
<path d="M7 3H17L22 9L12 21L2 9Z"/>
<path d="M7 3L12 9L17 3"/>
<path d="M2 9H22"/>
</svg>

</div>

<div class="float-icon icon-bolt">

<svg viewBox="0 0 24 24">
<path d="M13 2L6 13H11L10 22L18 10H13Z"/>
</svg>

</div>
  
<div class="container">

<h1 class="hero-title">
<span>Aplikasi Premium</span>
<span>Kebutuhan Medsos</span>
<span>Topup Game</span>
</h1>

<div class="trust">

<div class="dot"></div>
<span>Aman & Terpercaya</span>
</div>

<p class="desc">
Dapatkan akses premium ke aplikasi favoritmu,
kebutuhan media sosial,
dan top up game dengan harga terjangkau,
layanan aman,
dan support 24/7.
</p>

<div class="stats">

<div class="stat">
<h2>1000+</h2>
<p>Pelanggan</p>
</div>

<div class="stat">
<h2>50+</h2>
<p>Kategori</p>
</div>

<div class="stat">
<h2>24/7</h2>
<p>Support</p>
</div>

</div>

</div>

</section>

<script>

</script>

</body>
</html>
