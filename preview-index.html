<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,800;1,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="components/section-trust.css">
<link rel="stylesheet" href="components/product-card.css">
<link rel="stylesheet" href="components/preview-category/preview-category.css">
<link rel="stylesheet" href="components/preview-testimoni/preview-testimoni.css">
<link rel="stylesheet" href="components/preview-index.css">

<link rel="stylesheet" href="components/premium-cta.css">
<link rel="stylesheet" href="components/footer.css">
<title>Preview</title>

</head>
  
<body>
  
<section class="hero">
<div class="container">
<div class="floating-icons">

  <div class="floating-icon shield icon-green">
    <i class="fa-solid fa-shield-halved"></i>
  </div>

  <div class="floating-icon diamond icon-blue">
    <i class="fa-solid fa-gem"></i>
  </div>

  <div class="floating-icon bolt icon-gold">
    <i class="fa-solid fa-bolt"></i>
  </div>

</div>

<h1 class="hero-title">
<span>Aplikasi Premium</span>
<span>Kebutuhan Medsos</span>
<span>Topup Game</span>
</h1>

<div class="trust">
<i class="fa-solid fa-circle-check"></i>
<span>Aman & Terpercaya</span>
</div>

<p class="desc">
Dapatkan akses premium ke aplikasi favoritmu,
kebutuhan media sosial,
dan top up game dengan harga terjangkau,
layanan aman,
dan support 24/7.
</p>

<div class="stats">

<div class="stat">
<h2>1000+</h2>
<p>Pelanggan</p>
</div>

<div class="stat">
<h2>50+</h2>
<p>Kategori</p>
</div>

<div class="stat">
<h2>24/7</h2>
<p>Support</p>
</div>

</div>
</div>
</section>

<section class="preview-content">

    <div id="trust-section"></div>

    <div id="preview-testimoni"></div>

    <div id="preview-category"></div>

</section>
  
<div id="premium-cta"></div>
<div id="footer-container"></div>
  
<script src="components/section-trust.js"></script>

<script>
window.HOMEPAGE_LIMIT = 4;

fetch("components/preview-testimoni/preview-testimoni.html")
.then(r => r.text())
.then(html => {

    document.getElementById("preview-testimoni").innerHTML = html;

    const script = document.createElement("script");
    script.type = "module";
    script.src = "components/preview-testimoni/preview-testimoni.js";

    document.body.appendChild(script);

});
  
fetch("components/preview-category/preview-category.html")
.then(r => r.text())
.then(html => {
    document.getElementById("preview-category").innerHTML = html;

    // Muat product-card.js setelah container sudah ada
    const productScript = document.createElement("script");
    productScript.src = "components/product-card.js";

    productScript.onload = () => {
        initPreviewCategory();
    };

    document.body.appendChild(productScript);
});
</script>

<script src="components/preview-category/preview-category.js"></script>
<script type="module" src="components/preview-testimoni/preview-testimoni.js"></script>

<script src="components/premium-cta.js"></script>
<script src="components/footer.js"></script>
</body>
</html>
