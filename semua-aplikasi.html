<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semua Aplikasi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Poppins:wght@400;600;800&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="components/product-card.css">

<style>

body{
  margin:0;
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#f3f4f8;
  overflow-x:hidden;
}

:root{
  --card-min-width:320px;
  --grid-max-width:880px;
}

/* =========================
   HERO
========================= */

.package-hero{

  width:100%;
  min-height:300px;

  padding:80px 20px 70px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  background:
  radial-gradient(circle at top,#8b5cf655 0%,transparent 45%),
  linear-gradient(135deg,#493d84 0%,#6d28d9 100%);

  color:#fff;

  box-sizing:border-box;
}

.package-hero h1{

  margin:0;

  font-family:'Playfair Display',serif;
  font-size:clamp(2.3rem,7vw,3.3rem);
  font-weight:700;
  line-height:1.15;
  letter-spacing:.3px;

  text-shadow:
  0 8px 25px rgba(0,0,0,.18);

}

.package-hero p{

  margin:18px auto 0;

  max-width:640px;

  font-size:clamp(1rem,3.8vw,1.3rem);
  line-height:1.75;

  color:rgba(255,255,255,.88);

}

</style>

</head>
<body class="package-page">

<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>

<section class="invoice-wrapper">

  <!-- HERO -->
  <div class="package-hero">
    <h1>Semua Aplikasi </h1>
    <p>Temukan aplikasi premium favoritmu dengan harga terbaik.</p>
  </div>

</section>

<section class="category-content">
  <div id="apk" class="category-panel active">
    <div id="product-cards"></div>
  </div>
</section>

<script src="components/product-card.js"></script>
<div id="footer-container"></div>

<link rel="stylesheet" href="components/footer.css">
<script src="components/footer.js"></script>
</body>
</html>
