<!DOCTYPE html>
<html>
<head>
<title>Semua Aplikasi </title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Poppins:wght@400;600;800&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
  
<style>
/* BODY */
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#f3f4f8;
  margin:0;
  overflow-x: hidden;
}

:root {
  --card-min-width: 320px;
  --grid-max-width: 880px;
}

/* HERO */
.package-hero{
  background:linear-gradient(135deg,#7b2ff7,#5f0a87);
  padding:50px 20px;
  text-align:center;
}

.package-hero h1{
  font-family:'Playfair Display',serif;
  font-size:50px;
  margin-bottom:6px;
  color:white;
}

.package-hero p{
  opacity:.85;
  font-size:24px;
  color:white;
}

/* CARD UTAMA */
.glass-card {
  padding: 20px;
  border-radius: 20px;

  font-family: 'Plus Jakarta Sans', sans-serif;

  background: rgba(255,255,255,0.9);

  box-shadow: 
    0 12px 30px rgba(0,0,0,.08),
    0 4px 12px rgba(0,0,0,.05);

  opacity: 0;
  transform: translateY(24px);

  transition:
    opacity .35s ease,
    transform .35s ease;

  will-change: transform, opacity;
}

/* HOVER EFFECT */
.glass-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 24px 52px rgba(0,0,0,.25);
}

/* ANIMASI MASUK */
.glass-card.reveal {
  opacity: 1;
  transform: translateY(0);
}

.glass-card[data-delay="1"] { transition-delay: .05s; }
.glass-card[data-delay="2"] { transition-delay: .1s; }
.glass-card[data-delay="3"] { transition-delay: .15s; }
.glass-card[data-delay="4"] { transition-delay: .2s; }

.glass-card h3 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.2px;

  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    color .25s ease;
}

.glass-card:hover h3 {
  transform: translateY(-1px) scale(1.04);
}

.glass-card:active h3 {
  transform: translateY(0) scale(0.98);
}

/* efek ungu saat aktif */
.glass-card:active h3,
.glass-card:has(.package-detail.open) h3 {
  background: linear-gradient(90deg, #8b5cf6, #6d28d9);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* WRAPPER IMAGE */
.product-image {
  position: relative;
  width: 100%;
  margin-bottom: 14px;

  border-radius: 16px;
  overflow: hidden;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.35),
    rgba(255,255,255,0.12)
  );
}

/* IMAGE */
.product-image img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  display: block;

  transform: scale(0.98);
  transition: transform .45s cubic-bezier(.22,1,.36,1);
}

.product-image::after {
  content: "";
  position: absolute;
  left: 6%;
  right: 6%;
  bottom: -18px;
  height: 34px;

  border-radius: 50%;

  background: radial-gradient(
    ellipse at center bottom,
    rgba(139,92,246,0.75) 0%,
    rgba(139,92,246,0.45) 35%,
    rgba(139,92,246,0.18) 60%,
    transparent 75%
  );

  opacity: 0;
  transform: scale(0.9);
  filter: blur(1.5px);

  transition:
    opacity .35s ease,
    transform .35s ease;

  pointer-events: none;
}

/* saat klik / buka detail */
.glass-card:active .product-image::after,
.glass-card:has(.package-detail.open) .product-image::after {
  opacity: 1;
  transform: scale(1);
}

/* image ikut naik */
.glass-card:active .product-image img,
.glass-card:has(.package-detail.open) .product-image img {
  transform: translateY(-3px) scale(1.045);
}

/* ROW PAKET */
.package-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 12px 0;
  margin-bottom: 6px;

  text-decoration: none;
  color: inherit;

  border-bottom: 1px solid rgba(255,255,255,.2);

  transition: opacity .25s ease;
}

.package-row:last-child {
  border-bottom: none;
}

.package-row:hover {
  opacity: 0.85;
}

/* NAMA PAKET */
.package-row span {
  font-size: 13.5px;
  font-weight: 500;
  opacity: 0.85;
}

/* HARGA */
.package-row b {
  font-family: 'DM Sans', sans-serif;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

/* BASE FEATURED */
.package-row.featured {
  position: relative;
  padding-inline: 6px;
  overflow: hidden;
  margin: 6px 0;
}

/* ORANGE */
.package-row.featured-orange {
  background: linear-gradient(
    90deg,
    rgba(245,158,11,0.35),
    rgba(245,158,11,0.12)
  );
}

/* PURPLE (PAKET MAHAL) */
.package-row.featured-purple {
  background: linear-gradient(
    90deg,
    rgba(139,92,246,0.42),
    rgba(139,92,246,0.16)
  );
}

/* BLUE (REKOMENDASI) */
.package-row.featured-blue {
  background: linear-gradient(
    90deg,
    rgba(59,130,246,0.38),
    rgba(59,130,246,0.14)
  );
}

/* GLOW BASE */
.package-row.featured::before {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
}

/* SOFT */
.package-row.glow-soft::before {
  opacity: 0.65;
}

/* WARNA GLOW */
.package-row.featured-orange.glow-soft::before {
  box-shadow: 0 0 18px 4px rgba(245,158,11,0.45);
}

.package-row.featured-purple.glow-soft::before {
  box-shadow: 0 0 22px 6px rgba(139,92,246,0.55);
}

.package-row.featured-blue.glow-soft::before {
  box-shadow: 0 0 20px 5px rgba(59,130,246,0.5);
}

/* WRAPPER HARGA */
.price-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.1;
}

/* HARGA LAMA */
.price-old {
  font-size: 12px;
  text-decoration: line-through;
  opacity: 0.55;
}

/* HARGA BARU */
.price-new {
  font-family: 'DM Sans', sans-serif;
  font-size: 14.5px;
  font-weight: 700;
  color: #dc2626;
}

/* SATU BARIS HARGA */
.price-line {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* DEFAULT: PROMO DI KIRI */
.price-line.promo-left {
  justify-content: flex-end;
}

/* ALTERNATIF: PROMO DI KANAN */
.price-line.promo-right {
  flex-direction: row-reverse;
}

/* JIKA TANPA DISKON */
.price-line:has(.price-wrap):not(:has(.discount-badge)) {
  justify-content: flex-end;
}

/* BADGE DISKON */
.discount-badge {
  margin-left: 8px;
  padding: 1px 6px;

  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.2px;

  border-radius: 999px;

  background: #ef4444;
  color: white;
}

/* BIAR LEBIH RAPET */
.price-line .discount-badge {
  font-size: 8px;
  line-height: 1;
  padding: 1px 4px;

  display: inline-flex;
  align-items: center;
}

.toggle-detail {
  width: 100%;
  margin-top: 12px;
  padding: 10px 0;

  border: none;
  background: transparent;

  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;

  color: #2563eb;
  cursor: pointer;

  transition: opacity .25s ease, transform .25s ease;
}

.toggle-detail:hover {
  opacity: 0.85;
  transform: translateY(-1px);
}

/* CONTAINER DETAIL */
.package-detail {
  display: grid;
  grid-template-rows: 0fr;
  overflow: hidden;

  opacity: 0;

  transition:
    grid-template-rows 0.5s cubic-bezier(.22,1,.36,1),
    opacity 0.35s ease;
}

/* isi dalam */
.package-detail > * {
  overflow: hidden;
}

/* STATE OPEN */
.package-detail.open {
  grid-template-rows: 1fr;
  opacity: 1;
}

.package-detail.open .role-section {
  animation: detail-fade-slide 0.45s ease both;
}

@keyframes detail-fade-slide {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.role-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed rgba(0,0,0,0.15);
}

.role-title {
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.3px;
  opacity: 0.7;
}

/* badge role */
.role-badge {
  margin-left: 8px;
  padding: 3px 10px;
  border-radius: 999px;

  font-size: 11px;
  font-weight: 500;

  display: inline-flex;
  align-items: center;
  gap: 4px;

  background: rgba(17,24,39,0.08);
  color: #374151;
}

/* BADGE UMUM */
.badge {
  margin-left: 8px;
  padding: 3px 8px;

  font-size: 11px;
  font-weight: 700;

  border-radius: 999px;

  background: #ef4444;
  color: white;
}

.badge-hot {
  position: absolute;
  right: 10px;

  padding: 4px 10px;
  border-radius: 999px;

  font-size: 11px;
  font-weight: 700;

  background: #f59e0b;
  color: white;

  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}

/* posisi bertingkat */
.badge-line-0 { top: 10px; }
.badge-line-1 { top: 34px; }
.badge-line-2 { top: 58px; }
.badge-line-3 { top: 82px; }

/* variasi warna */
.badge-hot-red { background: #ef4444; }
.badge-hot-green { background: #22c55e; }
.badge-hot-orange { background: #f59e0b; }

/* PROMO */
.package-row.promo {
  background: linear-gradient(
    90deg,
    rgba(239,68,68,0.12),
    rgba(239,68,68,0.05)
  );
}

/* SOLD OUT */
.package-row.soldout {
  opacity: 0.45;
  pointer-events: none;
  text-decoration: line-through;
}

/* EXPIRED */
.package-row.expired {
  opacity: 0.35;
  filter: grayscale(1);
  pointer-events: none;
}

/* NOTE GARANSI */
.glass-card .note {
  display: block;
  margin-top: 16px;

  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3px;

  animation: guarantee-pulse 3.8s ease-in-out infinite;
}

.glass-card .note::before {
  content: "✔ ";
}

/* ADA GARANSI */
.note.has-guarantee {
  color: #16a34a;
}

/* TANPA GARANSI */
.note.no-guarantee {
  color: #dc2626;
  animation: none;
}

/* AUTO HIDE */
.glass-card .note:empty {
  display: none;
}

@keyframes guarantee-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.75; }
}

/* NO GARANSI */
.badge-nogar {
  margin-left: 6px;
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 700;
  border-radius: 999px;

  background: rgba(220,38,38,0.12);
  color: #dc2626;

  border: 1px solid rgba(220,38,38,0.35);
}

/* BERGARANSI */
.badge-gar {
  margin-left: 6px;
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 700;
  border-radius: 999px;

  background: rgba(22,163,74,0.12);
  color: #16a34a;

  border: 1px solid rgba(22,163,74,0.35);
}

/* NOTE PULSE HALUS */
.note {
  animation: pulse-note 3.5s ease-in-out infinite;
}

@keyframes pulse-note {
  0%,100% { opacity: .5; }
  50% { opacity: 1; }
}

/* CATEGORY WRAPPER */
.category-content {
  width: 100%;
  margin: 0 auto;
  padding-bottom: 120px;
}

/* GRID PRODUCT */
#product-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(var(--card-min-width), 1fr));
  gap: 28px 22px;

  width: 100%;
  max-width: var(--grid-max-width);
  margin: 0 auto;
}

/* RESPONSIVE */
@media (min-width: 1200px) {
  #product-cards {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 768px) {
  :root {
    --card-min-width: 100%;
  }

  #product-cards {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  #product-cards {
    gap: 26px 18px;
  }
}

/* PAUSE ANIMASI SAAT SCROLL */
body.is-scrolling * {
  animation-play-state: paused !important;
}

/* REDUCE MOTION (aksesibilitas + device lemah) */
@media (prefers-reduced-motion: reduce) {
  .package-detail {
    transition: none !important;
  }

  .glass-card {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
}

/* MATIKAN EFEK BERAT DI MOBILE */
@media (max-width:768px) {

  .glass-card {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    animation: none !important;
    transition-duration: .55s;
  }
}

/* ULTRA LOW DEVICE MODE */
@media (max-width:480px){

  .glass-card{
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    animation:none !important;
  }

  .package-row::before,
  .package-row::after{
    animation:none !important;
    filter:none !important;
  }

  .product-image::after{
    filter:none !important;
  }
}

/* FIX GRID MOBILE */
@media (max-width: 768px) {
  #product-cards {
    grid-template-columns: 1fr;
    max-width: 520px;
  }
}
  
</style>
</head>
<body class="package-page">

<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>

<section class="invoice-wrapper">

  <!-- HERO -->
  <div class="package-hero">
    <h1>Semua Aplikasi </h1>
    <p>Temukan aplikasi premium favoritmu dengan harga terbaik.</p>
  </div>

</section>

<section class="category-content">
  <div id="apk" class="category-panel active">
    <div id="product-cards"></div>
  </div>
</section>
  
<script>

/* ===== HELPER FUNCTIONS ===== */

function garBadge(i) {
  if (i.no_gar === "yes") {
    return `<em class="badge-nogar">NoGar</em>`;
  }
  if (i.no_gar === "no") {
    return `<em class="badge-gar">Bergaransi</em>`;
  }
  return "";
}

function isNoGar(i) {
  return String(i.no_gar).toLowerCase() === "yes";
}

function parseDiscount(promo) {
  if (!promo) return null;

  const normalized = promo.replace(",", ".");
  const m = normalized.match(/(\d+(?:\.\d+)?)\s*%/);

  return m ? parseFloat(m[1]) : null;
}

function formatPrice(n) {
  return "Rp" + Number(n).toLocaleString("id-ID");
}

function renderBadges(badgeText) {
  if (!badgeText) return "";

  return badgeText
    .split(":")
    .map(b => b.trim())
    .filter(Boolean)
    .map((label, i) => {
      const key = label.toLowerCase();

      let colorClass = "";
      if (key === "hot") colorClass = "badge-hot-red";
      else if (key === "new") colorClass = "badge-hot-green";
      else if (key === "promo") colorClass = "badge-hot-orange";

      return `
        <span class="badge-hot badge-line-${i} ${colorClass}">
          ${label}
        </span>
      `;
    })
    .join("");
}


/* ===== FETCH DATA ===== */
fetch("https://opensheet.elk.sh/1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08/PRODUCT_PACKAGES")
  .then(r => {
    if (!r.ok) throw new Error("Fetch gagal");
    return r.json();
  })
.then(data => {

  /* ===== GROUPING ===== */
  const grouped = {};

  data.forEach(p => {
    if (!grouped[p.product_id]) {
      grouped[p.product_id] = {
        title: p.title,
        items: []
      };
    }
    grouped[p.product_id].items.push(p);
  });

  console.log("DATA GROUPED:", grouped);

  window.PRODUCT_DATA = grouped;

  /* =========================
      (Bagian 3)
     ========================= */

  const wrap = document.getElementById("product-cards");
  if (!wrap) return;

  let html = ""; // TAMBAH INI

  Object.values(grouped).forEach(prod => {

    const items = prod.items;

    const primaryItem =
      items.find(i => i.image_url) || items[0];

    html += `
      <div class="glass-card">

        <div class="product-image">
          <img src="${primaryItem.image_url}" alt="${prod.title}">
          ${renderBadges(primaryItem.badge)}
        </div>

        <h3>${prod.title}</h3>

        ${(() => {

  const sortedItems = [...prod.items];
  const mainItems = sortedItems.filter(i => i.group === "main");
  const detailItems = sortedItems.filter(i => i.group === "detail");

  return `
  ${mainItems.map(i => {

    let cls = "package-row";

    const price = Number(
      String(i.price).replace(/[^\d]/g, "")
    ) || 0;

    const discount = parseDiscount(i.promo_text);

    let priceHTML = `<b>${formatPrice(price)}</b>`;

    if (discount !== null) {
      const finalPrice = Math.round(price - (price * discount / 100));

      priceHTML = `
        <span class="discount-badge">${discount}%</span>
        <div class="price-wrap">
          <span class="price-old">${formatPrice(price)}</span>
          <span class="price-new">${formatPrice(finalPrice)}</span>
        </div>
      `;
    }

    if (i.is_featured) {
      const [color, glow] = i.is_featured.split(":");
      cls += ` featured featured-${color}`;
      if (glow) cls += ` glow-${glow}`;
    }

    if (isNoGar(i)) {
      cls += " nogar";
    }

    return `
      <a href="package.html?package_id=${i.package_id}" class="${cls}">
        <span>
          ${i.package} ${i.duration}
          ${garBadge(i)}
        </span>

        <div class="price-line promo-left">
          ${priceHTML}
        </div>
      </a>
    `;
  }).join("")}


  ${detailItems.length
    ? `<button class="toggle-detail">Selengkapnya...</button>`
    : ``}


  <div class="package-detail">

    <div class="role-section">
      <div class="role-title">Role Access</div>

      ${detailItems.map(i => {

        let cls = "package-row role";

        if (i.is_featured && !isNoGar(i)) {
          const [color, glow] = i.is_featured.split(":");
          cls += ` featured featured-${color}`;
          if (glow) cls += ` glow-${glow}`;
        }

        if (isNoGar(i)) {
          cls += " nogar";
        }

        const price = Number(
          String(i.price).replace(/[^\d]/g, "")
        ) || 0;

        const discount = parseDiscount(i.promo_text);

        let priceHTML = `<b>${formatPrice(price)}</b>`;

        if (discount !== null) {
          const finalPrice = Math.round(price - (price * discount / 100));

          priceHTML = `
            <div class="price-line promo-left">
              <span class="discount-badge">${discount}%</span>
              <div class="price-wrap">
                <span class="price-old">${formatPrice(price)}</span>
                <span class="price-new">${formatPrice(finalPrice)}</span>
              </div>
            </div>
          `;
        }

        return `
          <a href="package.html?package_id=${i.package_id}"
             class="${cls}"
             onclick="event.stopPropagation();">

            <span>
              ${i.package} ${i.duration}
              ${
                i.badge_label
                  ? `<em class="role-badge">
                       ${i.badge_icon ?? ""} ${i.badge_label}
                       ${garBadge(i)}
                     </em>`
                  : garBadge(i)
              }
            </span>

            ${priceHTML}

          </a>
        `;
      }).join("")}

    </div>
  </div>
`;
})()}

      </div>
    `;
  });
wrap.innerHTML = html;

/* ===== REVEAL SYSTEM ===== */
const cards = document.querySelectorAll(".glass-card");

cards.forEach((card, i) => {
  card.dataset.delay = (i % 4) + 1;
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("reveal");
      observer.unobserve(entry.target);
    }
  });
}, {
  threshold: 0.12,
  rootMargin: "0px 0px -40px 0px"
});

cards.forEach(card => observer.observe(card));
})  // tutup
  .catch(err => {
    console.error("Sheet error:", err);
  });

</script>

<script>
document.addEventListener("click", function(e) {

  const btn = e.target.closest(".toggle-detail");
  if (!btn) return;

  const card = btn.closest(".glass-card");
  const detail = card.querySelector(".package-detail");

  if (!detail) return;

  const isOpen = detail.classList.contains("open");

  /* tutup semua */
  document.querySelectorAll(".package-detail.open").forEach(d => {
    d.classList.remove("open");
  });

  document.querySelectorAll(".toggle-detail").forEach(b => {
    b.textContent = "Selengkapnya...";
  });

  /* buka kalau belum */
  if (!isOpen) {
    detail.classList.add("open");

    card.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

    btn.textContent = "Tutup";
  }

});
</script>
  
<!-- scroll smooth -->
<script>
document.documentElement.style.scrollBehavior = "smooth";
</script>

<!-- performance scroll -->
<script>
let scrollTimeout;

window.addEventListener("scroll", () => {
  document.body.classList.add("is-scrolling");

  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    document.body.classList.remove("is-scrolling");
  }, 120);
});
</script>

</body>
