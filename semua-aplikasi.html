<!DOCTYPE html>
<html>
<head>
  <title>Semua Aplikasi - ADDSTOREEE</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">

<style>

body {
  overflow-x: hidden;
}

html, body {
  margin: 0;
  padding: 0;
}

:root {
  --card-min-width: 360px;
  --grid-max-width: 880px; /* lebar card */
}
  
/* SECTION PRODUCT – GLASS CARD */
.glass-card {
  padding: 20px;
  border-radius: 20px;

  font-family: 'Plus Jakarta Sans', sans-serif;

  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(18px);

  box-shadow: 
  0 12px 30px rgba(0,0,0,.08),
  0 4px 12px rgba(0,0,0,.05);

  animation: card-float 6s ease-in-out infinite;

  opacity: 0;
  transform: translateY(24px);
  transition:
    opacity .7s cubic-bezier(.22,1,.36,1),
    transform .7s cubic-bezier(.22,1,.36,1);
  will-change: transform, opacity;
}

@keyframes card-float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.glass-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 24px 52px rgba(0,0,0,.25);
}

.glass-card.reveal {
  opacity: 1;
  transform: translateY(0);
}

.glass-card[data-delay="1"] { transition-delay: .05s; }
.glass-card[data-delay="2"] { transition-delay: .1s; }
.glass-card[data-delay="3"] { transition-delay: .15s; }
.glass-card[data-delay="4"] { transition-delay: .2s; }

.toggle-detail {
  width: 100%;
  margin-top: 12px;
  padding: 10px 0;

  border: none;
  background: transparent;

  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;

  color: #2563eb;
  cursor: pointer;

  transition: opacity .25s ease, transform .25s ease;
}

.toggle-detail:hover {
  opacity: 0.85;
  transform: translateY(-1px);
}

/* COLLAPSE */
.package-detail {
  display: grid;
  grid-template-rows: 0fr;
  overflow: hidden;

  opacity: 0;
  transition:
    grid-template-rows 0.5s cubic-bezier(.22,1,.36,1),
    opacity 0.35s ease;
}

.package-detail > * {
  overflow: hidden;
}

.package-detail.open {
  grid-template-rows: 1fr;
  opacity: 1;
}

.package-detail.open .role-section {
  animation: detail-fade-slide 0.45s ease both;
}

@keyframes detail-fade-slide {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.package-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 12px 0;
  margin-bottom: 6px;

  text-decoration: none;
  color: inherit;

  border-bottom: 1px solid rgba(255,255,255,.2);

  transition: opacity .25s ease;
}

.package-row:last-child {
  border-bottom: none;
}

.package-row:hover {
  opacity: 0.85;
}

/* FEATURED / PAKET UNGGULAN (BASE) */
.package-row.featured {
  position: relative;
  padding-inline: 6px;
  overflow: hidden;
  margin: 6px 0;
}

.package-detail .package-row {
  margin-bottom: 4px;
}
    /* ORANGE */
.package-row.featured-orange {
  background: linear-gradient(
    90deg,
    rgba(245,158,11,0.35),
    rgba(245,158,11,0.12)
  );
}
   /* PURPLE PAKET MAHAL */
.package-row.featured-purple {
  background: linear-gradient(
    90deg,
    rgba(139,92,246,0.42),
    rgba(139,92,246,0.16)
  );
}
   /* BLUE REKOMENDASI */
.package-row.featured-blue {
  background: linear-gradient(
    90deg,
    rgba(59,130,246,0.38),
    rgba(59,130,246,0.14)
  );
}
    /* GLOW FEATURED */
.package-row.featured::before {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0; 
}

.package-row.glow-soft::before {
  opacity: 0.65;
}
.package-row.featured-orange.glow-soft::before {
  box-shadow: 0 0 18px 4px rgba(245,158,11,0.45);
}
.package-row.featured-purple.glow-soft::before {
  box-shadow: 0 0 22px 6px rgba(139,92,246,0.55);
}
.package-row.featured-blue.glow-soft::before {
  box-shadow: 0 0 20px 5px rgba(59,130,246,0.5);
}

.package-row.glow-glow::before {
  opacity: 0.9;
  animation: glow-breathe 3.8s ease-in-out infinite;
}
.package-row.featured-orange.glow-glow::before {
  box-shadow: 0 0 26px 8px rgba(245,158,11,0.75);
}
.package-row.featured-purple.glow-glow::before {
  box-shadow: 0 0 32px 10px rgba(139,92,246,0.85);
}
.package-row.featured-blue.glow-glow::before {
  box-shadow: 0 0 30px 9px rgba(59,130,246,0.8);
}

.package-row.glow-strong::before {
  opacity: 1;
  animation: glow-strong 2.6s ease-in-out infinite;
}
.package-row.featured-orange.glow-strong::before {
  box-shadow:
    0 0 34px 12px rgba(245,158,11,0.95),
    inset 0 0 12px rgba(245,158,11,0.35);
}
.package-row.featured-purple.glow-strong::before {
  box-shadow:
    0 0 44px 16px rgba(139,92,246,1),
    inset 0 0 16px rgba(139,92,246,0.45);
}
.package-row.featured-blue.glow-strong::before {
  box-shadow:
    0 0 38px 14px rgba(59,130,246,0.95),
    inset 0 0 14px rgba(59,130,246,0.4);
}

.package-row.featured::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-repeat: repeat;
  opacity: 0;
}

.package-row.featured-orange.glow-soft::after {
  opacity: 0.35;
  background-image:
    radial-gradient(circle at 18% 28%, rgba(245,158,11,.8) 1px, transparent 2px),
    radial-gradient(circle at 62% 22%, rgba(245,158,11,.6) 1.2px, transparent 2.4px),
    radial-gradient(circle at 44% 74%, rgba(245,158,11,.7) 0.9px, transparent 2px);
}
.package-row.featured-orange.glow-glow::after {
  opacity: 0.55;
  background-image:
    radial-gradient(circle at 14% 22%, rgba(245,158,11,1) 1.2px, transparent 2.4px),
    radial-gradient(circle at 36% 62%, rgba(245,158,11,.8) 1.6px, transparent 2.8px),
    radial-gradient(circle at 68% 18%, rgba(245,158,11,.7) 1px, transparent 2.2px),
    radial-gradient(circle at 82% 74%, rgba(245,158,11,.9) 1.4px, transparent 2.6px);
  animation: star-twinkle 4.8s ease-in-out infinite;
}
.package-row.featured-purple.glow-glow::after {
  opacity: 0.6;
  background-image:
    radial-gradient(circle at 16% 18%, rgba(139,92,246,1) 1.3px, transparent 2.6px),
    radial-gradient(circle at 42% 64%, rgba(139,92,246,.85) 1.8px, transparent 3px),
    radial-gradient(circle at 66% 24%, rgba(139,92,246,.7) 1.1px, transparent 2.4px),
    radial-gradient(circle at 84% 72%, rgba(139,92,246,.9) 1.5px, transparent 2.8px);
  animation: star-twinkle 4.2s ease-in-out infinite;
}
.package-row.featured-purple.glow-strong::after {
  opacity: 0.85;
  background-image:
    radial-gradient(circle at 10% 16%, rgba(139,92,246,1) 1.8px, transparent 3px),
    radial-gradient(circle at 26% 58%, rgba(139,92,246,.95) 1.4px, transparent 2.6px),
    radial-gradient(circle at 48% 34%, rgba(139,92,246,.85) 2px, transparent 3.4px),
    radial-gradient(circle at 66% 72%, rgba(139,92,246,.8) 1.6px, transparent 2.8px),
    radial-gradient(circle at 86% 42%, rgba(139,92,246,1) 2.2px, transparent 3.6px);
  animation: star-twinkle 3.2s ease-in-out infinite;
}

    /* STAR LAYER BASE */
.package-row.featured::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background-image: var(--star-bg);
  background-repeat: no-repeat;
  
  opacity: var(--star-opacity, 0.25);
  filter: blur(0.4px);

  animation: star-twinkle var(--twinkle-speed, 6s) ease-in-out infinite;
}

.package-row.featured::after {
  opacity: 0;
  animation-play-state: paused;
}

.package-row.featured:hover::after {
  opacity: var(--star-opacity, 0.5);
  animation-play-state: running;
}

@keyframes glow-breathe {
  0%,100% { transform: scale(1); opacity: 0.75; }
  50%     { transform: scale(1.02); opacity: 1; }
}

@keyframes glow-strong {
  0%,100% { transform: scale(1); opacity: 0.85; }
  50%     { transform: scale(1.06); opacity: 1; }
}

@keyframes star-twinkle {
  0%,100% { opacity: 0.25; }
  50%     { opacity: 0.65; }
}
    /* NO GAR */
.package-row.nogar {
  animation: none !important;
}

/* MATIKAN STAR SAJA (AFTER) */
.package-row.nogar::after {
  opacity: 0 !important;
  animation: none !important;
  display: none;
}

/* BIARKAN ::before (GLOW) TETAP HIDUP */
.package-row.nogar::before {
  display: block !important;
  opacity: 0.6;
}
    
.glass-card h3 {
  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    color .25s ease;
}

.glass-card:hover h3 {
  transform: translateY(-1px) scale(1.04);
}

.glass-card:active h3 {
  transform: translateY(0) scale(0.98);
}

.glass-card:active h3,
.glass-card:has(.package-detail.open) h3 {
  background: linear-gradient(90deg, #8b5cf6, #6d28d9);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* GARANSI */
.glass-card .note {
  display: block;
  margin-top: 16px;

  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3px;

  animation: guarantee-pulse 3.8s ease-in-out infinite;
}

.glass-card .note::before {
  content: "✔ ";
}

/* ADA GARANSI */
.note.has-guarantee {
  color: #16a34a;
}

/* TANPA GARANSI */
.note.no-guarantee {
  color: #dc2626;
  animation: none;
}

/* AUTO HIDE */
.glass-card .note:empty {
  display: none;
}

@keyframes guarantee-pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.75;
  }
}

/* ===== APPS HERO (AMBIL DARI PACKAGE HERO) ===== */
.apps-hero {
  position: relative;

  width: 100%;
  margin: 0 0 70px 0;

  background: linear-gradient(
    135deg,
    #493d84,
    #6d28d9
  );

  padding: 90px 20px 80px;
  overflow: hidden;
}

.apps-hero-inner {
  max-width: 840px;
  margin: 0 auto;
  text-align: center;
}
  
.apps-hero .section-title {
  color: #ffffff;
  margin: 0;
}

.apps-hero::after {
  content: "";
  position: absolute;
  inset: 0;

  background: radial-gradient(
    circle at 50% 30%,
    rgba(255,255,255,0.12),

  );

}
  
.section-title {
  margin: 44px 0 48px;
  text-align: center;

  font-family: 'Poppins', sans-serif;
  font-size: 52px;
  font-weight: 600;
  letter-spacing: 0.2px;

}

.section-subtitle {
  margin-top: 10px;

}

/* BADGE */
.badge {
  margin-left: 8px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  background: #ef4444;
  color: white;
}

/* STATE: PROMO */
.package-row.promo {
  background: linear-gradient(
    90deg,
    rgba(239,68,68,0.12),
    rgba(239,68,68,0.05)
  );
}

/* STATE: SOLD OUT */
.package-row.soldout {
  opacity: 0.45;
  pointer-events: none;
  text-decoration: line-through;
}

/* STATE: EXPIRED */
.package-row.expired {
  opacity: 0.35;
  filter: grayscale(1);
  pointer-events: none;
}

/* IMAGE PRODUK */
.product-image {
  position: relative;
  width: 100%;
  margin-bottom: 14px;

  border-radius: 16px;
  overflow: hidden;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.35),
    rgba(255,255,255,0.12)
  );
}

.product-image img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  display: block;

  transform: scale(0.98);
  transition: transform .45s cubic-bezier(.22,1,.36,1);
}

.product-image::after {
  content: "";
  position: absolute;
  left: 6%;
  right: 6%;
  bottom: -18px;
  height: 34px;

  border-radius: 50%;

  background: radial-gradient(
    ellipse at center bottom,
    rgba(139,92,246,0.75) 0%,
    rgba(139,92,246,0.45) 35%,
    rgba(139,92,246,0.18) 60%,
    transparent 75%
  );

  opacity: 0;
  transform: scale(0.9);
  filter: blur(1.5px);
  transition:
    opacity .35s ease,
    transform .35s ease;
  pointer-events: none;
}

.glass-card:active .product-image::after {
  opacity: 1;
  transform: scale(1);
}

.glass-card:has(.package-detail.open) .product-image::after {
  opacity: 1;
  transform: scale(1);
}

.glass-card:active .product-image img,
.glass-card:has(.package-detail.open) .product-image img {
  transform: translateY(-3px) scale(1.045);
}

.badge-hot {
  position: absolute;
  right: 10px;

  padding: 4px 10px;
  border-radius: 999px;

  font-size: 11px;
  font-weight: 700;

  background: #f59e0b;
  color: white;

  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
}

/* OFFSET KE BAWAH OTOMATIS */
.badge-line-0 { top: 10px; }
.badge-line-1 { top: 34px; }
.badge-line-2 { top: 58px; }
.badge-line-3 { top: 82px; }

.badge-hot-red {
  background: #ef4444;
}

.badge-hot-green {
  background: #22c55e;
}

.badge-hot-orange {
  background: #f59e0b;
}

    .note {
  animation: pulse-note 3.5s ease-in-out infinite;
}

@keyframes pulse-note {
  0%,100% { opacity: .5; }
  50% { opacity: 1; }
}
    /* BADGE NO GARANSI */
.badge-nogar {
  margin-left: 6px;
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 700;

    /* BADGE BERGARANSI */
.badge-gar {

  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 700;
  border-radius: 999px;

  background: rgba(22,163,74,0.12);

}

    /* ROLE SECTION */
.role-section {

.role-title {

.lihat-semua-btn {

/* JUDUL */

 }

  }

    /* ===== PERFORMANCE MODE SAAT SCROLL ===== */
body.is-scrolling * {
  animation-play-state: paused !important;
}

@media (max-width: 768px) {
  #product-cards {

</head>
<div id="navbar-placeholder"></div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar-placeholder").innerHTML = data;

    const navbar = document.querySelector(".main-navbar");
    const toggle = document.getElementById("navToggle");
    const dropdown = document.getElementById("navDropdown");

    // TOGGLE
    toggle.addEventListener("click", function (e) {
  e.stopPropagation();
  dropdown.classList.toggle("open");
  toggle.classList.toggle("active"); // ← TAMBAHAN INI
});

    document.addEventListener("click", function (e) {
  if (!dropdown.contains(e.target) && !toggle.contains(e.target)) {
    dropdown.classList.remove("open");
    toggle.classList.remove("active"); // ← TAMBAHAN INI
  }
});

   // ===== ACTIVE LINK AUTO DETECT =====
const currentPage = window.location.pathname.split("/").pop() || "index.html";

document.querySelectorAll(".nav-dropdown a").forEach(link => {
  const linkPage = link.getAttribute("href");

  if (linkPage === currentPage) {
    link.classList.add("active");
  }
});

    // SCROLL EFFECT
    window.addEventListener("scroll", function () {
      navbar.classList.toggle("scrolled", window.scrollY > 30);
    });
  });
</script>

  
<body style="background:#f9fafb; font-family:'Plus Jakarta Sans',sans-serif;">

<!-- HERO PINDAH KE ATAS -->
<section class="apps-hero">
  <div class="apps-hero-inner">
    <h2 class="section-title">Semua Aplikasi</h2>
<p class="section-subtitle">
  Temukan aplikasi premium favoritmu dengan harga terbaik.
</p>
  </div>
</section>

<section class="category-content">
  <div id="apk" class="category-panel active">
    <div id="product-cards"></div>
  </div>
</section>

  
<!-- PRODUCT CARD – FETCH GOOGLE SHEET -->
<script>
const FEATURED_STAR_CONFIG = {
  "orange:soft":   { amount: 24, minSize: 0.18, maxSize: 0.35, opacity: 0.18, twinkle: 10 },
  "orange:glow":   { amount: 32, minSize: 0.2,  maxSize: 0.45, opacity: 0.25, twinkle: 8 },
  "orange:strong": { amount: 44, minSize: 0.25, maxSize: 0.6,  opacity: 0.35, twinkle: 6 },

  "purple:soft":   { amount: 24, minSize: 0.18, maxSize: 0.35, opacity: 0.18, twinkle: 10 },
  "purple:glow":   { amount: 32, minSize: 0.2,  maxSize: 0.45, opacity: 0.25, twinkle: 8 },
  "purple:strong": { amount: 44, minSize: 0.25, maxSize: 0.6,  opacity: 0.35, twinkle: 6 }
};

  function generateStars(color, cfg) {
  const layers = [];

  for (let i = 0; i < cfg.amount; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 100;

    const baseSize =
      Math.random() * (cfg.maxSize - cfg.minSize) + cfg.minSize;

    const jitter = () => (Math.random() - 0.5) * 1.8;

    // core glow (sangat kecil)
    layers.push(
      `radial-gradient(circle at ${x}% ${y}%, rgba(${color},0.9) ${baseSize}px, transparent ${baseSize * 2}px)`
    );

    // soft halo
    layers.push(
      `radial-gradient(circle at ${x + jitter()}% ${y + jitter()}%, rgba(${color},0.25) ${baseSize * 1.6}px, transparent ${baseSize * 4}px)`
    );

    // white dust sparkle
    if (Math.random() < 0.55) {
      layers.push(
        `radial-gradient(circle at ${x + jitter()}% ${y + jitter()}%, rgba(255,255,255,0.35) ${baseSize * 0.8}px, transparent ${baseSize * 2.8}px)`
      );
    }
  }

  return layers.join(",");
}

  function garBadge(i) {
  if (i.no_gar === "yes") {
    return `<em class="badge-nogar">NoGar</em>`;
  }
  if (i.no_gar === "no") {
    return `<em class="badge-gar">Bergaransi</em>`;
  }
  return "";
}
  function isNoGar(i) {
  return String(i.no_gar).toLowerCase() === "yes";
}
  
  function parseDiscount(promo) {
  if (!promo) return null;

  const normalized = promo.replace(",", ".");

  const m = normalized.match(/(\d+(?:\.\d+)?)\s*%/);
  return m ? parseFloat(m[1]) : null;
}

function formatPrice(n) {
  return "Rp" + Number(n).toLocaleString("id-ID");
}
  
function renderBadges(badgeText) {
  if (!badgeText) return "";

  return badgeText
    .split(":")
    .map(b => b.trim())
    .filter(Boolean)
    .map((label, i) => {
      const key = label.toLowerCase();

      let colorClass = "";
      if (key === "hot") colorClass = "badge-hot-red";
      else if (key === "new") colorClass = "badge-hot-green";
      else if (key === "promo") colorClass = "badge-hot-orange";

      return `
        <span class="badge-hot badge-line-${i} ${colorClass}">
          ${label}
        </span>
      `;
    })
    .join("");
}
  fetch("https://opensheet.elk.sh/1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08/PRODUCT_PACKAGES")
  .then(r => {
    if (!r.ok) throw new Error("Fetch gagal");
    return r.json();
  })
  .then(data => {

    const grouped = {};

data.forEach(p => {
  if (!grouped[p.product_id]) {
    grouped[p.product_id] = { title: p.title, items: [] };
  }
  grouped[p.product_id].items.push(p);
});

const wrap = document.getElementById("product-cards");
if (!wrap) return;

Object.values(grouped)
  .forEach(prod => {

    const sortedItems = [...prod.items];
    const mainItems   = sortedItems.filter(i => i.group === "main");
    const detailItems = sortedItems.filter(i => i.group === "detail");
    const primaryItem =
      sortedItems.find(i => i.group === "main" && i.image_url)
      || sortedItems.find(i => i.image_url)
      || sortedItems[0];
      
      wrap.innerHTML += `
<div class="glass-card">

  <!-- IMAGE + BADGE -->
  <div class="product-image">
    <img src="${primaryItem.image_url}" alt="${prod.title}">
${renderBadges(primaryItem.badge)}
  </div>

  <!-- JUDUL -->
  <h3>${prod.title}</h3>

  <!-- PACKAGE UTAMA (yang langsung terlihat) -->
  ${mainItems.map(i => {
  let cls = "package-row";
  let starStyle = "";

const price = Number(
  String(i.price).replace(/[^\d]/g, "")
) || 0;
const discount = parseDiscount(i.promo_text);

let priceHTML = `<b>${formatPrice(price)}</b>`;

if (discount !== null) {
  const finalPrice = Math.round(price - (price * discount / 100));

  priceHTML = `
    <span class="discount-badge">${discount}%</span>
    <div class="price-wrap">
      <span class="price-old">${formatPrice(price)}</span>
      <span class="price-new">${formatPrice(finalPrice)}</span>
    </div>
  `;
      }

  if (i.is_featured) {
    const [color, glow] = i.is_featured.split(":");
    cls += ` featured featured-${color}`;
    if (glow) cls += ` glow-${glow}`;

    // downgrade main strong → glow
    if (i.group === "main" && glow === "strong") {
      cls = cls.replace("glow-strong", "glow-glow");
    }

    const key = i.is_featured;
    const cfg = FEATURED_STAR_CONFIG[key];

    const price = Number(i.price) || 0;

// multiplier halus (aman)
    let densityBoost = 1;
    if (price >= 50000) densityBoost = 1.6;
    else if (price >= 20000) densityBoost = 1.3;
    else if (price >= 10000) densityBoost = 1.15;

// clone config supaya tidak rusak global
    const adaptiveCfg = cfg
     ? { ...cfg, amount: Math.round(cfg.amount * densityBoost) }: null;
    
    if (adaptiveCfg) {
  const rgb =
    key.startsWith("orange") ? "245,158,11" : "139,92,246";

  starStyle = `
    --star-bg: ${generateStars(rgb, adaptiveCfg)};
    --star-opacity: ${adaptiveCfg.opacity};
    --twinkle-speed: ${adaptiveCfg.twinkle}s;
  `;

  const phase = -(Math.random() * 6).toFixed(2);
  starStyle += `animation-delay:${phase}s;`;
}
  }

  // NoGar → MATIKAN STAR & GLOW
if (isNoGar(i)) {
  cls += " nogar";
}

return `
  <a href="package.html?package_id=${i.package_id}"
     class="${cls}"
     style="${starStyle}">

    <span>
      ${i.package} ${i.duration}
      ${
        i.badge_label
          ? `<em class="role-badge">
               ${i.badge_icon ?? ""} ${i.badge_label}
               ${garBadge(i)}
             </em>`
          : garBadge(i)
      }
    </span>

    <div class="price-line promo-left">
      ${priceHTML}
    </div>

  </a>
`;
}).join("")}

<!-- TOMBOL -->
  ${detailItems.length
  ? `<button class="toggle-detail">Selengkapnya…</button>`
  : ``}
  
  <!-- DETAIL TERSEMBUNYI -->
  <div class="package-detail">

  <div class="role-section">
    <div class="role-title">Role Access</div>

    ${detailItems.map(i => `
  <a
    href="package.html?package_id=${i.package_id}"
    class="package-row role
    ${i.is_featured && !isNoGar(i)
      ? (() => {
          const [color, glow] = i.is_featured.split(":");
          return `featured featured-${color} ${glow ? `glow-${glow}` : ""}`;
        })()
      : ""
    }
    ${isNoGar(i) ? "nogar" : ""}
    "
    target="_self"
    onclick="event.stopPropagation();"
  >
    <span>
  ${i.package} ${i.duration}

  ${i.badge_label
  ? `<em class="role-badge">
       ${i.badge_icon} ${i.badge_label}
       ${garBadge(i)}</em>` : garBadge(i) }</span>
    ${(() => {
  const price = Number(
  String(i.price).replace(/[^\d]/g, "")
) || 0;
  const discount = parseDiscount(i.promo_text);

  if (discount !== null) {
    const finalPrice = Math.round(price - (price * discount / 100));
    return `
      <div class="price-line promo-left">
        <span class="discount-badge">${discount}%</span>
        <div class="price-wrap">
          <span class="price-old">${formatPrice(price)}</span>
          <span class="price-new">${formatPrice(finalPrice)}</span>
        </div>
      </div>
    `;
  }

  return `<b>${formatPrice(price)}</b>`;
})()}
  </a>
`).join("")}

  </div>
</div>

  <small class="note ${prod.items[0]?.guarantee ? 'has-guarantee' : 'no-guarantee'}">
  ${prod.items[0]?.guarantee
  ? prod.items[0].guarantee
  : ''}
</small>
</div>
      `;
    });

   // ==== REVEAL SYSTEM ====
const cards = document.querySelectorAll(".glass-card");

cards.forEach((card, i) => {
  card.dataset.delay = (i % 4) + 1;
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("reveal");
      observer.unobserve(entry.target);
    }
  });
}, {
  threshold: 0.12,
  rootMargin: "0px 0px -40px 0px"
});

cards.forEach(card => observer.observe(card));
  
    })
  .catch(err => {
    console.error("Sheet error:", err);

    const wrap = document.getElementById("product-cards");
    if (wrap) {
      wrap.innerHTML = `
        <div style="text-align:center; padding:40px; opacity:.7">
          Produk sedang tidak tersedia
        </div>
      `;
    }
  });
</script>

  
<script>
document.addEventListener("click", function(e) {
  const btn = e.target.closest(".toggle-detail");
  if (!btn) return;

  const card = btn.closest(".glass-card");
  const detail = card.querySelector(".package-detail");

  if (!detail) return;

  detail.classList.toggle("open");

  btn.textContent = detail.classList.contains("open")
    ? "Tutup"
    : "Selengkapnya...";
});
</script>
