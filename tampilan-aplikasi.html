<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>

<style>
/* BODY */
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#f3f4f8;
  margin:0;
  overflow-x: hidden;
}

/* HERO */
.package-hero{
  background:linear-gradient(135deg,#7b2ff7,#5f0a87);
  padding:50px 20px;
  text-align:center;
}

.package-hero h1{
  font-family:'Playfair Display',serif;
  font-size:50px;
  margin-bottom:6px;
  color:white;
}

.package-hero p{
  opacity:.85;
  font-size:24px;
  color:white;
}

/* CATEGORY WRAPPER */
.category-content {
  width: 100%;
  margin: 0 auto;
  padding-bottom: 120px;
}

/* GRID PRODUCT */
#product-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(var(--card-min-width), 1fr));
  gap: 28px 22px;

  width: 100%;
  max-width: var(--grid-max-width);
  margin: 0 auto;
}

/* RESPONSIVE */
@media (min-width: 1200px) {
  #product-cards {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 768px) {
  :root {
    --card-min-width: 100%;
  }

  #product-cards {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  #product-cards {
    gap: 26px 18px;
  }
}
  
</style>
</head>
<body class="package-page">

<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>

<section class="invoice-wrapper">

  <!-- HERO -->
  <div class="package-hero">
    <h1>Semua Aplikasi</h1>
    <p>Temukan aplikasi premium favoritmu dengan harga terbaik.</p>
  </div>

</section>

<section class="category-content">
  <div id="apk" class="category-panel active">
    <div id="product-cards"></div>
  </div>
</section>


<script>
  
</script>
</body>
</html>
