<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preview Page</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* Android Tap Highlight */

*{
-webkit-tap-highlight-color:transparent;
}

a,
button{
-webkit-tap-highlight-color:transparent;
-webkit-touch-callout:none;
  
outline:none;
user-select:none;

}

a:focus,
a:active{
outline:none;
}


body{
background:#f3f4f8;
min-height:100vh;

display:flex;
justify-content:center;

padding:35px 18px;

}

.container{
width:100%;
max-width:460px;

}

/* Logo */

.logo{
width:130px;
height:130px;
margin:0 auto 45px;

border-radius:50%;
background:rgba(255,255,255,.45);

box-shadow:
0 10px 25px rgba(0,0,0,.05),
inset 0 1px 0 rgba(255,255,255,.9);
}

.logo img{
width:100%;
height:100%;

object-fit:contain;
padding:8px; /* Bisa diubah 8px–18px sesuai ukuran logo */

display:block;
user-select:none;
pointer-events:none;
}

.store-name{
margin-top:16px;

text-align:center;

font-size:28px;
font-weight:700;

letter-spacing:1px;

color:#5c2db8;
}

.store-subtitle{
margin-top:6px;
margin-bottom:38px;

text-align:center;

font-size:14px;
font-weight:500;

color:#8b8b99;
}
  
/* Menu */

.menu{

display:flex;
flex-direction:column;
gap:18px;

}

.card{

display:flex;
justify-content:space-between;
align-items:center;

height:84px;
padding:0 22px;
border-radius:22px;
background:rgba(255,255,255,.52);

box-shadow:

0 6px 20px rgba(32,38,58,.06),

inset 0 1px 0 rgba(255,255,255,.9);

transition:
transform .25s ease,
box-shadow .25s ease,
background .25s ease;

text-decoration:none;

overflow:hidden;
position:relative;
will-change:transform;

}

.card:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.65);
}

.card:active{
transform:scale(.98);
  
box-shadow:
0 4px 10px rgba(0,0,0,.04),
inset 0 1px 0 rgba(255,255,255,.85);
}

.left{
display:flex;
align-items:center;
gap:16px;

}

.icon{
width:48px;
height:48px;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
145deg,
rgba(255,255,255,.92),
rgba(255,255,255,.45)
);

box-shadow:

inset 0 1px 0 rgba(255,255,255,.95),
0 5px 12px rgba(0,0,0,.05);
transition:.28s;

}

.card:hover .icon{
transform:scale(1.08);

}

.icon svg{
width:24px;
height:24px;
fill:none;

stroke:currentColor;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;

}

.title{
font-size:17px;
font-weight:600;

}

.arrow{
width:22px;
height:22px;

fill:none;
stroke:currentColor;
stroke-width:2.4;
stroke-linecap:round;
stroke-linejoin:round;

opacity:.55;
transition:.3s;

}

.card:hover .arrow{
transform:translateX(6px);
opacity:1;
filter:drop-shadow(0 0 6px currentColor);
}

/* Warna */

.blue{
border:2px solid #2D7DFF;
color:#2D7DFF;

}
.blue .title{
color:#222;
}

.blue:hover{
box-shadow:
0 0 18px rgba(45,125,255,.18),
0 10px 25px rgba(32,38,58,.08);

}

.yellow{
border:2px solid #FFC300;
color:#FFC300;
}

.yellow .title{
color:#222;
}

.yellow:hover{
box-shadow:0 0 18px rgba(255,195,0,.18);
}

.green{
border:2px solid #49C41C;
color:#49C41C;
}

.green .title{
color:#222;
}

.green:hover{
box-shadow:0 0 18px rgba(73,196,28,.18);
}

.cyan{
border:2px solid #7ED8D2;
color:#34bfb6;
}

.cyan .title{
color:#222;
}

.cyan:hover{
box-shadow:0 0 18px rgba(126,216,210,.22);
}
  
.red{
border:2px solid #F04C4C;
color:#F04C4C;
}

.red .title{
color:#222;
}

.red:hover{
box-shadow:0 0 18px rgba(240,76,76,.18);
}

.blue .icon{
background:
linear-gradient(
135deg,
rgba(45,125,255,.16),
rgba(45,125,255,.05)
);

}

.yellow .icon{
background:
linear-gradient(
135deg,
rgba(255,195,0,.18),
rgba(255,195,0,.05)
);

}

.green .icon{
background:
linear-gradient(
135deg,
rgba(73,196,28,.16),
rgba(73,196,28,.05)
);

}

.cyan .icon{
background:
linear-gradient(
135deg,
rgba(126,216,210,.18),
rgba(126,216,210,.05)
);

}

.red .icon{
background:
linear-gradient(
135deg,
rgba(240,76,76,.16),
rgba(240,76,76,.05)
);

}

/* ========================= */
/* Stagger Animation */
/* ========================= */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(18px);
}

to{
opacity:1;
transform:translateY(0);
}
}
  
.logo{
animation:fadeUp .45s ease forwards;
}

.card{
opacity:0;
animation:fadeUp .45s ease forwards;
}

/* Delay setiap card */

.menu .card:nth-child(1){
animation-delay:.15s;
}

.menu .card:nth-child(2){
animation-delay:.23s;
}

.menu .card:nth-child(3){
animation-delay:.31s;
}

.menu .card:nth-child(4){
animation-delay:.39s;
}

.menu .card:nth-child(5){
animation-delay:.47s;
}
  
</style>
</head>
<body>

<div class="container">
<div class="logo">
<img src="https://raw.githubusercontent.com/dexxiittt/Image/main/Addstoreapp_Logo.png" alt="Logo">
</div>

<h1 class="store-name">ADDSTOREAPP</h1>

<p class="store-subtitle">
Apk Premium Store
</p>
<div class="menu">



<!-- TESTIMONI -->

<svg viewBox="0 0 24 24">
    <path d="M5 19L4 15V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H9z"/>
    <path d="M12 8.2l.8 1.6 1.8.3-1.3 1.3.3 1.8-1.6-.9-1.6.9.3-1.8-1.3-1.3 1.8-.3z"/>
</svg>

</div>

<span class="title">Testimoni</span>

</div>
<svg class="arrow" viewBox="0 0 24 24">
<path d="M9 6L15 12L9 18"/>
</svg>
</a>

<!-- INVOICE -->

<a href="invoice.html" class="card green">
<div class="left">
<div class="icon">

<svg viewBox="0 0 24 24">
    <path d="M7 3h10v18l-2-1-2 1-2-1-2 1-2-1V3z"/>
    <path d="M9 8h6"/>
    <path d="M9 12h6"/>
    <path d="M9 16h4"/>
</svg>

</div>

<span class="title">Invoice</span>

</div>
  
<svg class="arrow" viewBox="0 0 24 24">
<path d="M9 6L15 12L9 18"/>
</svg>
</a>

<!-- TRANSAKSI -->

<a href="cek-transaksi.html" class="card cyan">
<div class="left">
<div class="icon">

<svg viewBox="0 0 24 24">
    <path d="M6 6h8"/>
    <path d="M10 2l4 4-4 4"/>
    <path d="M18 18H10"/>
    <path d="M14 22l-4-4 4-4"/>
</svg>

</div>

<span class="title">Semua Transaksi</span>

</div>

<svg class="arrow" viewBox="0 0 24 24">
<path d="M9 6L15 12L9 18"/>
</svg>
</a>

<!-- STATUS PEMBAYARAN -->

<a href="cek-status.html" class="card red">
<div class="left">
<div class="icon">

<svg viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="13" rx="2"/>
    <path d="M3 9h18"/>
    <path d="M14 15l2 2 4-4"/>
</svg>

</div>

<span class="title">Cek Status Pembayaran</span>

</div>

<svg class="arrow" viewBox="0 0 24 24">
<path d="M10 6l6 6-6 6"/>
</svg>
</a>

</div>

</div>

</body>
</html>
