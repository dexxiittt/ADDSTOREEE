<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preview Page</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f3f4f8;
min-height:100vh;

display:flex;
justify-content:center;

padding:35px 18px;

}

.container{
width:100%;
max-width:460px;

}

/* Logo */

.logo{
width:130px;
height:130px;
margin:0 auto 45px;

border-radius:50%;
border:5px solid #25c2ff;

background:rgba(255,255,255,.45);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

box-shadow:
0 10px 25px rgba(0,0,0,.05),
inset 0 1px 0 rgba(255,255,255,.9);

}

/* Menu */

.menu{

display:flex;
flex-direction:column;
gap:18px;

}

.card{

display:flex;
align-items:center;
justify-content:space-between;

height:82px;

padding:0 22px;

border-radius:20px;

background:rgba(255,255,255,.45);

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

box-shadow:

0 8px 20px rgba(0,0,0,.05),

inset 0 1px 0 rgba(255,255,255,.9);

transition:.28s;

text-decoration:none;

color:#222;

}

.card:hover{

transform:translateY(-3px);

background:rgba(255,255,255,.65);

}

.left{

display:flex;
align-items:center;
gap:16px;

}

.icon{
width:46px;
height:46px;

border-radius:15px;

display:flex;
justify-content:center;
align-items:center;

background:rgba(255,255,255,.55);
box-shadow:
0 5px 12px rgba(0,0,0,.05);

}

.icon svg{
width:22px;
height:22px;
fill:none;

stroke:currentColor;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;

}

.title{
font-size:17px;
font-weight:600;

}

.arrow{
width:22px;
height:22px;

fill:none;
stroke-width:2.4;
stroke-linecap:round;
stroke-linejoin:round;

opacity:.55;
transition:.3s;

}

.card:hover .arrow{
transform:translateX(6px);
opacity:1;

}

/* Warna */

.blue{
border:2px solid #2D7DFF;
color:#2D7DFF;

}

.blue .title{
color:#222;

}

.yellow{
border:2px solid #FFC300;
color:#FFC300;

}

.yellow .title{
color:#222;

}

.green{
border:2px solid #49C41C;
color:#49C41C;

}

.green .title{
color:#222;

}

.cyan{
border:2px solid #7ED8D2;
color:#34bfb6;

}

.cyan .title{
color:#222;

}

.red{
border:2px solid #F04C4C;
color:#F04C4C;

}

.red .title{
color:#222;

}

</style>

</head>

<body>

<div class="container">

<div class="logo"></div>

<div class="menu">

<!-- HOME -->

<a href="index.html" class="card blue">

<div class="left">

<div class="icon">

<svg viewBox="0 0 24 24">

<path d="M3 11L12 4L21 11"/>

<path d="M5 10V20H10V15H14V20H19V10"/>

</svg>

</div>

<span class="title">Home</span>

</div>

<svg class="arrow" viewBox="0 0 24 24">

<path d="M9 6L15 12L9 18"/>

</svg>

</a>

<!-- TESTIMONI -->

<a href="#" class="card yellow">

<div class="left">

<div class="icon">

<svg viewBox="0 0 24 24">

<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>

<path d="M12 8l1 2h2l-1.5 1.3.6 2-1.6-1-1.6 1 .6-2L9 10h2z"/>

</svg>

</div>

<span class="title">Testimoni</span>

</div>

<svg class="arrow" viewBox="0 0 24 24">

<path d="M9 6L15 12L9 18"/>

</svg>

</a>

<!-- INVOICE -->

<a href="#" class="card green">

<div class="left">

<div class="icon">

<svg viewBox="0 0 24 24">

<path d="M7 3H17V21L14 19L12 21L10 19L7 21Z"/>

<path d="M10 8H15"/>

<path d="M10 12H15"/>

<path d="M10 16H13"/>

</svg>

</div>

<span class="title">Invoice</span>

</div>

<svg class="arrow" viewBox="0 0 24 24">

<path d="M9 6L15 12L9 18"/>

</svg>

</a>

<!-- TRANSAKSI -->

<a href="#" class="card cyan">

<div class="left">

<div class="icon">

<svg viewBox="0 0 24 24">

<path d="M20 7V3L16 7"/>

<path d="M4 17V21L8 17"/>

<path d="M20 7A8 8 0 0 0 6 5"/>

<path d="M4 17A8 8 0 0 0 18 19"/>

</svg>

</div>

<span class="title">Semua Transaksi</span>

</div>

<svg class="arrow" viewBox="0 0 24 24">

<path d="M9 6L15 12L9 18"/>

</svg>

</a>

<!-- STATUS PEMBAYARAN -->

<a href="#" class="card red">

<div class="left">

<div class="icon">

<svg viewBox="0 0 24 24">

<rect x="3" y="5" width="18" height="14" rx="2"/>

<path d="M3 10H21"/>

<path d="M15 15l2 2 4-4"/>

</svg>

</div>

<span class="title">Cek Status Pembayaran</span>

</div>

<svg class="arrow" viewBox="0 0 24 24">

<path d="M9 6L15 12L9 18"/>

</svg>

</a>

</div>

</div>

</body>
</html>
