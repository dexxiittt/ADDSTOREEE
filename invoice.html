<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INVOICE</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="components/invoice/invoice.css">

</head>
  
<body>

<body class="package-page">

<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>

<section class="invoice-wrapper">

  <!-- HERO -->
  <div class="package-hero">
    <h1>Cek Invoice</h1>
    <p>Lacak status pembayaran dan detail pesanan</p>
  </div>

  <!-- CARD -->
  <div class="invoice-box">

    <div class="invoice-icon">
  <i class="fa-solid fa-magnifying-glass"></i>
</div>

    <h2>Masukan Invoice Anda</h2>
    <p>Lacak status pembayaran dan detail pesanan</p>

    <div class="invoice-input-wrap">
      <input 
        type="text" 
        placeholder="Masukkan nomor INV (contoh: 20241100001)"
      >
      <button>🔍 Cek</button>
    </div>

  </div>

</section>

<!-- ALERT -->
<div id="customAlert" class="alert-overlay">
  <div class="alert-box">
    <div class="alert-title" id="alertTitle">Judul</div>
    <div class="alert-message" id="alertMessage">Pesan</div>
    <button onclick="closeAlert()">OK</button>
  </div>
</div>

<script src="components/invoice/invoice.js?v=1"></script>
</body>
</html>
