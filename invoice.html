<!DOCTYPE html>
<html>
<head>
<title>Cek Invoice</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  overflow-x: hidden;
}
   
html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
/* ====== IMPORT STYLE DARI PACKAGE ====== */
/* Kamu bisa copy semua :root, body.package-page, 
   .package-hero, .glass dari package.html */

/* HERO tetap ungu */
.package-hero {
  width: 100%;
  min-height: 260px;
   
  background: linear-gradient(
    135deg,
    #493d84,
    #6d28d9
  );
  padding: 72px 20px 44px;
  text-align: center;
}

.package-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.package-hero p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.85);
}

/* ===== PREMIUM GLASS INVOICE ===== */

.invoice-box {
  width: 80%;              /* INI YANG BIKIN LEBAR */
  max-width: 900px;

  margin: 40px auto 100px;
  padding: 48px 56px;

  border-radius: 22px;

  background: rgba(15,15,20,0.55);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.06);

  border: 1px solid rgba(255,255,255,0.06);

  text-align: center;
}

.invoice-box:hover {
  transform: translateY(-4px);
  box-shadow:
    0 30px 80px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.08);
}

.invoice-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.4px;
  margin-bottom: 10px;
  color: #ffffff;
}

.invoice-box p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.65);
  margin-bottom: 30px;
}

/* ===== INPUT GROUP ===== */

.invoice-input-wrap {
  display: flex;
  align-items: center;

  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 6px;

  border: 1px solid rgba(255,255,255,0.08);
}
  
.invoice-input-wrap input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 14px 16px;
  color: white;
  font-size: 15px;
}

.invoice-input-wrap input::placeholder {
  color: rgba(255,255,255,0.4);
}

.invoice-input-wrap button {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  border: none;
  cursor: pointer;

  padding: 12px 18px;
  border-radius: 14px;

  font-weight: 600;
  color: white;

  background: linear-gradient(
    135deg,
    #8b5cf6,
    #6d28d9
  );

  box-shadow: 0 10px 24px rgba(139,92,246,.45);

  transition: .25s;
}

.invoice-input-wrap button:hover {
  transform: translateY(-2px);
}

.invoice-wrapper {
  min-height: 60vh; /* atur tinggi area */
  display: flex;
  flex-direction: column;
  align-items: center;
}

.package-hero {
  width: 100%;
  padding: 72px 20px 60px;
}
  
</style>
</head>

<body class="package-page">

<section class="invoice-wrapper">
<!-- HERO -->
<div class="package-hero">
  <h1>Cek Invoice</h1>
  <p>Lacak status pembayaran dan detail pesanan</p>
</div>

<!-- GLASS CONTAINER -->
<div class="invoice-box">

  <h2>Masukan Invoice Anda</h2>
  <p>Lacak status pembayaran dan detail pesanan</p>

  <div class="invoice-input-wrap">
    <input 
      type="text" 
      placeholder="Masukkan nomor invoice (contoh: INV20241201001)"
    >
    <button>
      🔍 Cek
    </button>
  </div>
  </div>

</section>

</body>
</html>
