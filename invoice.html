<!DOCTYPE html>
<html>
<head>
<title>Cek Invoice</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  overflow-x: hidden;
  background: #0b0b0f;
}
   
html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* HERO tetap ungu */
.package-hero{
  width:100%;
  min-height:260px;
  background:linear-gradient(135deg,#493d84,#6d28d9);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
  padding:20px;
}

.package-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.package-hero p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.85);
}

.invoice-box p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.65);
  margin-bottom: 30px;
}

/* ===== LIGHTWEIGHT INVOICE CARD ===== */

.invoice-box {
  width: 100%;
  max-width: 900px;

  margin: 50px auto 120px;
  padding: 40px 24px;

  border-radius: 20px;

  background: #16161f;
  border: 1px solid rgba(255,255,255,0.06);

  text-align: center;
}

/* TITLE */

.invoice-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #ffffff;
}

.invoice-box p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  color: rgba(255,255,255,0.65);
  margin-bottom: 30px;
}

/* ===== INPUT GROUP (LIGHTWEIGHT) ===== */

.invoice-wrapper{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.invoice-input-wrap {
  display:flex;
  align-items:center;
  padding:8px;
  border-radius:16px;
  background:#0f0f15;
  border:1px solid rgba(255,255,255,0.06);
}

.invoice-input-wrap input {
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  padding:14px 16px;
  font-size:15px;
  color:white;
  font-family:'Plus Jakarta Sans',sans-serif;
}

.invoice-input-wrap input::placeholder {
  color: rgba(255,255,255,0.4);
}

/* BUTTON */

.invoice-input-wrap button {
  padding:12px 20px;
  border-radius:14px;
  border:none;
  font-weight:600;
  background:#7c3aed;
  color:white;
  cursor:pointer;
}

.invoice-input-wrap button:hover {
  background:#6d28d9;
}

/* ============================= */
/* MOBILE OPTIMIZATION */
/* ============================= */

@media (max-width: 768px){

.invoice-box{
  width:92%;
  padding:36px 22px;
  margin:40px auto 100px;
}

.package-hero{
  padding:60px 20px 50px;
}

.package-hero h1{
  font-size:34px;
}

.package-hero p{
  font-size:14px;
}

.invoice-input-wrap{
  flex-direction:column;
  gap:10px;
  padding:12px;
}

.invoice-input-wrap button{
  width:100%;
}

}

/* ============================= */
/* LARGE SCREEN OPTIMIZATION */
/* ============================= */

@media (min-width:1200px){

.invoice-box{
  max-width:950px;
}
}

*{
  backface-visibility: hidden;
  transform: translateZ(0);
}
  
</style>
</head>

<body class="package-page">
<div id="navbar-placeholder"></div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar-placeholder").innerHTML = data;

    const navbar = document.querySelector(".main-navbar");
    const toggle = document.getElementById("navToggle");
    const dropdown = document.getElementById("navDropdown");

    // TOGGLE
    toggle.addEventListener("click", function (e) {
  e.stopPropagation();
  dropdown.classList.toggle("open");
  toggle.classList.toggle("active"); // ← TAMBAHAN INI
});

    document.addEventListener("click", function (e) {
  if (!dropdown.contains(e.target) && !toggle.contains(e.target)) {
    dropdown.classList.remove("open");
    toggle.classList.remove("active"); // ← TAMBAHAN INI
  }
});

   // ===== ACTIVE LINK AUTO DETECT =====
const currentPage = window.location.pathname.split("/").pop() || "index.html";

document.querySelectorAll(".nav-dropdown a").forEach(link => {
  const linkPage = link.getAttribute("href");

  if (linkPage === currentPage) {
    link.classList.add("active");
  }
});

    // SCROLL EFFECT
    window.addEventListener("scroll", function () {
      navbar.classList.toggle("scrolled", window.scrollY > 30);
    });
  });
</script>

<section class="invoice-wrapper">
<!-- HERO -->
<div class="package-hero">
  <h1>Cek Invoice</h1>
  <p>Lacak status pembayaran dan detail pesanan</p>
</div>

<!-- GLASS CONTAINER -->
<div class="invoice-box">

  <h2>Masukan Invoice Anda</h2>
  <p>Lacak status pembayaran dan detail pesanan</p>

  <div class="invoice-input-wrap">
    <input 
      type="text" 
      placeholder="Masukkan nomor invoice (contoh: INV20241201001)"
    >
    <button>
      🔍 Cek
    </button>
  </div>
  </div>

</section>

<script>
const sheetID = "1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08";
const sheetName = "invoice_id";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

const input = document.querySelector(".invoice-input-wrap input");
const button = document.querySelector(".invoice-input-wrap button");

button.addEventListener("click", checkInvoice);

async function checkInvoice() {
  const invoiceValue = input.value.trim();

  if (!invoiceValue) {
    alert("Masukkan nomor invoice dulu.");
    return;
  }

  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows;

    const invoiceList = rows.map(row => String(row.c[0]?.v));

if (invoiceList.includes(String(invoiceValue))) {
      window.location.href = `status-pesanan.html?inv=${invoiceValue}`;
    } else {
      alert("Invoice tidak ditemukan ❌");
    }

  } catch (err) {
    console.error(err);
    alert("Terjadi kesalahan mengambil data.");
  }
}
  
</script>

</body>
</html>
