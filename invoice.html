<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INVOICE</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="components/invoice/invoice.css">

</head>
  
<body>

<body class="package-page">

<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>

<section class="invoice-wrapper">

  <!-- HERO -->
  <div class="package-hero">
    <h1>Cek Invoice</h1>
    <p>Lacak status pembayaran dan detail pesanan</p>
  </div>

  <!-- CARD -->
  <div class="invoice-box">

    <div class="invoice-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <h2>Masukan Invoice Anda</h2>
    <p>Lacak status pembayaran dan detail pesanan</p>

    <div class="invoice-input-wrap">
      <input 
        type="text" 
        placeholder="Masukkan nomor INV (contoh: 20241100001)"
      >
      <button>🔍 Cek</button>
    </div>

  </div>

</section>

<script>

// tampilkan alert
function showAlert(title, message){
  document.getElementById("alertTitle").innerText = title;
  document.getElementById("alertMessage").innerText = message;
  document.getElementById("customAlert").classList.add("active");
}

// tutup alert
function closeAlert(){
  document.getElementById("customAlert").classList.remove("active");
}
  
document.addEventListener("DOMContentLoaded", function(){

  const sheetID = "1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08";
  const sheetName = "invoice_id";
  const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

  const input = document.querySelector(".invoice-input-wrap input");
  const button = document.querySelector(".invoice-input-wrap button");

  button.addEventListener("click", checkInvoice);

  // ENTER langsung cek
  input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
      checkInvoice();
    }
  });

  async function checkInvoice() {
    const invoiceValue = input.value.trim();

    if (!invoiceValue) {
      showAlert("Oops", "Masukkan nomor invoice dulu.");
      return;
    }

    // disable tombol biar gak double klik
    button.disabled = true;
    const originalText = button.innerHTML;
    button.innerHTML = "Loading...";

    try {
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substr(47).slice(0, -2));
      const rows = json.table.rows;

      const invoiceList = rows.map(row => String(row.c[0]?.v));

      if (invoiceList.includes(String(invoiceValue))) {
        window.location.href = `status-pesanan.html?inv=${invoiceValue}`;
      } else {
        showAlert("Tidak ditemukan", "Invoice tidak ditemukan");
      }

    } catch (err) {
      console.error(err);
      showAlert("Error", "Terjadi kesalahan mengambil data.");
    }

    // balikin tombol
    button.disabled = false;
    button.innerHTML = originalText;
  }

});
</script>

<!-- ALERT -->
<div id="customAlert" class="alert-overlay">
  <div class="alert-box">
    <div class="alert-title" id="alertTitle">Judul</div>
    <div class="alert-message" id="alertMessage">Pesan</div>
    <button onclick="closeAlert()">OK</button>
  </div>
</div>

</body>
</html>
