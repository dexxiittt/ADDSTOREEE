<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&display=swap" rel="stylesheet">

<style>
.footer-premium{
  margin-top: -10px;
  padding:60px 20px 25px;

  width:100%;

  background:linear-gradient(
    145deg,
    #1a0f2e,
    #2b1446,
    #140a24
  );
  
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  font-family:'Inter',sans-serif;

  color:#cbd5f1;

  position:relative;
  overflow:hidden;
}

.footer-premium::before{
  content:"";
  position:absolute;
  top:0;
  left:0;

  width:100%;
  height:3px;

  box-shadow:
  0 0 8px rgba(168,85,247,0.6),
  0 0 20px rgba(168,85,247,0.4);

  background:linear-gradient(
    90deg,
    #7c3aed,
    #a855f7,
    #22d3ee,
    #7c3aed
  );

  background-size:300% 300%;

  animation:footerGradient 6s linear infinite;
}

.footer-premium::after{
display:none;
}

.footer-premium .glow-right{
display:none;
}

.footer-particles{

position:absolute;
inset:0;

/* particle halus tapi masih terlihat */

background-image:

radial-gradient(circle, rgba(168,85,247,0.12) 1.6px, transparent 1.6px),
radial-gradient(circle, rgba(124,58,237,0.10) 1.6px, transparent 1.6px);

background-size:340px 340px, 460px 460px;
background-position:0 0, 180px 200px;

/* animasi tetap ringan */

animation:footerParticles 70s linear infinite;

pointer-events:none;
opacity:.9;

}
  
.footer-container{
  width:100%;
  max-width:1200px;
  
  margin:0 auto;
  padding:0 20px;

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:40px;

  align-items:flex-start;

  position:relative;
  z-index:2;
}

.footer-brand h3{

font-family:'Sora',sans-serif;
font-weight:600;

margin-bottom:10px;

background:linear-gradient(
90deg,
#e9d5ff 0%,
#c084fc 35%,
#a855f7 65%,
#7c3aed 100%
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.footer-brand p{
  font-size:14px;
  line-height:1.6;
  opacity:.8;
}

.brand-logo{
  font-size:22px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  margin-bottom:10px;
}

.footer-menu h4,
.footer-service h4{
  color:#fff;
  margin-bottom:10px;
  font-family:'Sora',sans-serif;
  font-weight:600;
  letter-spacing:.4px;
}

.footer-menu a,
.footer-service a{

display:inline-block;
position:relative;

text-decoration:none;
color:#94a3b8;

margin:6px 0;
font-size:14px;

transition:color .25s ease;

font-weight:500;
letter-spacing:.2px;

}

.footer-menu a::before{
content:"✦";
margin-right:8px;
font-size:12px;
color:#a855f7;
opacity:.9;
}

.footer-service a::before{
content:"➜";
margin-right:8px;
font-size:12px;
color:#c084fc;
opacity:.85;
}

.footer-menu a,
.footer-service a{
display:flex;
align-items:center;
gap:6px;

width:fit-content;
}

.footer-menu a::after,
.footer-service a::after{

content:"";
position:absolute;

left:0;
bottom:-3px;

width:0%;
height:2px;

background:linear-gradient(
90deg,
#7c3aed,
#a855f7
);

transition:width .35s ease;

}

.footer-menu a:hover,
.footer-service a:hover{
  color:#fff;
  transform:translateX(4px);
}

.footer-menu a:hover::after,
.footer-service a:hover::after{

width:100%;
color:#d8b4fe;

}

.footer-social{
  margin-top:18px;
  display:flex;
  gap:12px;
}

.footer-social a{

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:rgba(255,255,255,0.05);

  border:1px solid rgba(255,255,255,0.08);

  color:#cbd5f1;
  font-size:16px;

  transition:all .35s ease;

  backdrop-filter:blur(6px);
}

.footer-social a:hover{

  transform:translateY(-3px) scale(1.05);

  background:linear-gradient(
    135deg,
    #7c3aed,
    #a855f7
  );

  color:white;

  box-shadow:
  0 6px 18px rgba(168,85,247,0.45);

}

.footer-social i{
  transition:transform .3s ease;
}

.footer-social a:hover i{
  transform:scale(1.15);
}

.footer-bottom{

border-top:1px solid rgba(255,255,255,.08);

margin-top:40px;
padding-top:15px;

text-align:center;
font-size:13px;

letter-spacing:.5px;
font-weight:500;

color:#94a3b8;

opacity:.85;

transition:all .35s ease;

animation:copyrightGlow 6s ease-in-out infinite;

}

.footer-bottom:hover{

opacity:1;
color:#d8b4fe;

}

@keyframes footerGradient{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

@keyframes footerParticles{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-40px);
}

100%{
transform:translateY(0);
}

}

@keyframes copyrightGlow{

0%{
opacity:.85;
}

50%{
opacity:1;
}

100%{
opacity:.85;
}

}

@media (max-width:768px){

.footer-container{
  grid-template-columns:1fr;
  gap:30px;
  text-align:center;
 }
  
.footer-brand{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.footer-menu,
.footer-service{
  display:flex;
  flex-direction:column;
  align-items:center;
}
  
.footer-social{
  display:flex;
  justify-content:center;
}

.footer-bottom{
  text-align:center;
}
}

@media (max-width:1024px){

.footer-container{
  grid-template-columns:repeat(2,1fr);
}

}
  
</style>
  

<footer class="footer-premium">
  <div class="footer-particles"></div>
  <div class="glow-right"></div>
  <div class="footer-container">

    <div class="footer-brand">
      <div class="brand-logo">✦</div>
      <h3>AddstoreApps</h3>
      <p>
        Platform penyedia layanan aplikasi premium dengan harga terjangkau,
        proses cepat, dan garansi penuh untuk setiap transaksi.
      </p>

      <div class="footer-social">
        <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="#"><i class="fa-brands fa-telegram"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
      </div>
    </div>

    <div class="footer-menu">
      <h4>Menu</h4>
      <a href="index.html">Home</a>
      <a href="semua-aplikasi.html">Semua Aplikasi</a>
      <a href="cek-transaksi.html">Cek Transaksi</a>
      <a href="testimoni.html">Testimoni</a>
    </div>

    <div class="footer-service">
      <h4>Layanan</h4>
      <a href="invoice.html">Cek Invoice</a>
      <a href="invoice.html">Cek Garansi</a>
      <a href="bantuan.html">Bantuan</a>
    </div>

  </div>

  <div class="footer-bottom">
    © 2026 Addstoreee — All Rights Reserved
  </div>
</footer>
