<style>

/* ===== NAVBAR ===== */

.main-navbar {
  position: fixed;
  overflow: visible;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 9999;

  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.08);

  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}
  
/* FULL WIDTH INNER */
.nav-inner {
  width: 100%;
  padding: 14px 20px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: white;
  font-weight: 700;
  font-family: 'Poppins', sans-serif;
}

.nav-brand img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
}

.nav-toggle {
  position: relative;
  z-index: 10000;
  background: none;
  border: none;
  color: white;
  font-size: 22px;
  min-width: 24px;
  cursor: pointer;
}

/* DROPDOWN */

.nav-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;

  background: rgba(73,61,132,0.95);
  backdrop-filter: blur(20px);

  display: flex;
  flex-direction: column;

  max-height: 0;
  overflow-y: auto;

  pointer-events: none;   /* PENTING */
  z-index: 9998;

  transition: max-height .45s cubic-bezier(.22,1,.36,1);
}

.nav-dropdown a {
  padding: 14px 20px;
  text-decoration: none;
  color: white;
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 500;
  transition: background .3s;
}

.nav-dropdown a:hover {
  background: rgba(255,255,255,0.08);
}

/* OPEN STATE */
.nav-dropdown.open {
  max-height: 70vh;
  pointer-events: auto;   /* aktif saat buka */
}
  
</style>



<nav class="main-navbar">
  <div class="nav-inner">

    <!-- LEFT: LOGO -->
    <a href="index.html" class="nav-brand">
      <img src="https://raw.githubusercontent.com/dexxiittt/Image/main/logo.png" alt="Logo">
      <span>Addstoreee</span>
    </a>

    <!-- RIGHT: MENU BUTTON -->
    <button class="nav-toggle" id="navToggle">
  <i class="fas fa-ellipsis-v"></i>
    </button>

  </div>

  <!-- DROPDOWN -->
  <div class="nav-dropdown" id="navDropdown">
    <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="semua-aplikasi.html"><i class="fa-solid fa-box"></i> Semua Produk</a>
    <a href="#testimoni"><i class="fa-solid fa-star"></i> Testimoni</a>
    <a href="invoice.html"><i class="fa-solid fa-receipt"></i> Invoice</a>
  </div>
</nav>



<script>
const toggle = document.getElementById("navToggle");
const dropdown = document.getElementById("navDropdown");

if (toggle && dropdown) {
  toggle.addEventListener("click", function (e) {
    e.stopPropagation();
    dropdown.classList.toggle("open");
  });

  document.addEventListener("click", function (e) {
    if (!dropdown.contains(e.target) && !toggle.contains(e.target)) {
      dropdown.classList.remove("open");
    }
  });
}
</script>
