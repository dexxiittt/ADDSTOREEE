<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cek Transaksi</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&display=swap"
rel="stylesheet">

  <!-- CSS Cek transaksi -->
<link
rel="stylesheet"
href="components/cek-transaksi/cek-transaksi.css">

  <!-- CSS Footer -->
<link rel="stylesheet" href="components/footer.css">
  
</head>

<body class="package-page">
<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>

<section class="invoice-wrapper">
<!-- HERO -->
<div class="package-hero">
  <h1>Cek Transaksi</h1>
<p>Lihat semua riwayat pembelian Anda</p>
</div>

<!-- GLASS CONTAINER -->
<div class="invoice-box">

<div class="invoice-icon">
<i class="fa-solid fa-magnifying-glass"></i>
</div>
  
  <h2>Masukan Nomor Anda</h2>
<p>Lihat semua transaksi berdasarkan nomor pembelian</p>

  <div class="invoice-input-wrap">
    <input 
      type="text" 
      placeholder="Masukkan nomor HP (contoh: 08588xxxxxxx)"
    >
    <button>
      🔍 Cek
    </button>
  </section>
  </div>
</div>

<!-- ALERT -->
<div id="customAlert" class="alert-overlay">
  <div class="alert-box">
    <div class="alert-title" id="alertTitle">Judul</div>
    <div class="alert-message" id="alertMessage">Pesan</div>
    <button onclick="closeAlert()">OK</button>
  </div>
</div>

<script src="components/cek-transaksi/cek-transaksi.js?v=2"></script>

<!-- FOOTER -->
  <div id="footer-container"></div>
  <script src="components/footer.js"></script>
</body>
</html>
