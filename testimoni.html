<!DOCTYPE html>
<html>
<head>
<title>Testimoni</title>

<style>

/* HERO tetap ungu */
.package-hero{
  width:100%;
  min-height:260px;
  background:linear-gradient(135deg,#493d84,#6d28d9);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
  padding:20px;
}

.package-hero h1{
font-size:34px;
font-weight:700;
margin-bottom:10px;
}

.package-hero p{
opacity:0.9;
}

.testimoni-input{
padding:60px 20px;
display:flex;
justify-content:center;
}

.glass-card{

width:100%;
max-width:500px;

padding:40px;

border-radius:20px;

background:rgba(20,20,25,0.7);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,0.08);

box-shadow:
0 10px 40px rgba(0,0,0,0.5),
inset 0 1px 0 rgba(255,255,255,0.05);

text-align:center;

color:white;

}

.glass-card input,
.glass-card textarea,
.glass-card select{

width:100%;
padding:14px;
margin-top:12px;

border-radius:10px;
border:none;

background:rgba(255,255,255,0.05);

color:white;

}

.glass-card textarea{
min-height:120px;
resize:none;
}

.glass-card button{

margin-top:18px;
width:100%;

padding:14px;

border:none;

border-radius:10px;

background:linear-gradient(135deg,#3b82f6,#6366f1);

color:white;

font-weight:600;

cursor:pointer;

transition:0.3s;

}

.glass-card button:hover{

transform:translateY(-2px);
box-shadow:0 10px 25px rgba(59,130,246,0.4);

}
  
</style>
  
</head>
<body>
<section class="package-hero">

<h1 style="color:white;font-size:32px;margin-bottom:10px;">
Testimoni Pelanggan
</h1>

<p style="color:#e0e7ff;max-width:500px;">
Dengar langsung dari pelanggan yang telah merasakan layanan premium kami
</p>

</section>

<section class="testimoni-input">

<div class="glass-card">

<div class="icon">
<i class="fa-solid fa-star"></i>
</div>

<h2>Bagikan Pengalaman Anda</h2>
<p>Berikan testimoni untuk pesanan yang sudah dibayar</p>

<input type="text" id="invoice" placeholder="Nomor Invoice (contoh: INV20261001001)">
<input type="text" id="nama" placeholder="Nama Anda">

<select id="rating">
<option value="">Rating layanan</option>
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<textarea id="pesan" placeholder="Ceritakan pengalaman Anda..."></textarea>

<button onclick="kirimTestimoni()">
<i class="fa-solid fa-paper-plane"></i>
Kirim Testimoni
</button>

</div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzuIo_i_TAAJevZMNqYtWuZoFB8wfj_RE",
  authDomain: "addstoreapps.firebaseapp.com",
  projectId: "addstoreapps",
  storageBucket: "addstoreapps.firebasestorage.app",
  messagingSenderId: "712672256555",
  appId: "1:712672256555:web:9069f8ea4d7776d1f3806e",
  measurementId: "G-92MPF6V96X"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


async function kirimTestimoni(){

let invoice = document.getElementById("invoice").value
let nama = document.getElementById("nama").value
let rating = document.getElementById("rating").value
let pesan = document.getElementById("pesan").value

if(!invoice || !nama || !rating || !pesan){
alert("Lengkapi dulu ya")
return
}

// cek invoice di database
const invoiceRef = doc(db,"invoice",invoice)
const invoiceSnap = await getDoc(invoiceRef)

if(!invoiceSnap.exists()){
alert("Nomor invoice tidak valid")
return
}

// kirim testimoni
await addDoc(collection(db,"testimoni"),{
invoice:invoice,
nama:nama,
rating:rating,
pesan:pesan,
tanggal:new Date().toLocaleDateString()
})

alert("Testimoni berhasil dikirim!")

}

window.kirimTestimoni = kirimTestimoni

</script>
  
</body>
</html>
