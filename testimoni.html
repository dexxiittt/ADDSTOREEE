<!DOCTYPE html>
<html>
<head>
<title>Testimoni</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f3f4f8;
font-family:Inter,system-ui,-apple-system,sans-serif;
}

/* HERO UNGU SAMA PERSIS */
.package-hero{
width:100%;
min-height:280px;

background:linear-gradient(135deg,#493d84,#6d28d9);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;

padding:70px 20px;
color:white;
}

.package-hero h1{
font-size:34px;
font-weight:700;
margin-bottom:10px;
}

.package-hero p{
opacity:0.9;
}

.testimoni-input{
padding:60px 20px;
display:flex;
justify-content:center;
}

.glass-card{

width:100%;
max-width:620px;
padding:45px;

border-radius:24px;
background:rgba(255,255,255,0.65);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,0.6);

box-shadow:
0 40px 80px rgba(0,0,0,0.15),
0 10px 30px rgba(0,0,0,0.1);

text-align:center;
color:#1f2937;
transition:all .25s ease;

}

.glass-card:hover{
transform:translateY(-4px);
box-shadow:
0 50px 100px rgba(0,0,0,0.18),
0 15px 40px rgba(0,0,0,0.15);
}

.glass-card input,
.glass-card textarea,
.glass-card select{

width:100%;
padding:16px;
margin-top:14px;

border-radius:12px;
border:1px solid rgba(0,0,0,0.06);
background:rgba(255,255,255,0.8);

color:#111827;
font-size:14px;
transition:all .2s ease;

}

.glass-card input:focus,
.glass-card textarea:focus,
.glass-card select:focus{

outline:none;
border-color:#6366f1;
box-shadow:0 0 0 3px rgba(99,102,241,0.15);

}

.glass-card textarea{
min-height:120px;
resize:none;
}

.glass-card button{

margin-top:18px;
width:100%;

padding:14px;

border:none;

border-radius:10px;

background:linear-gradient(135deg,#3b82f6,#6366f1);

color:white;

font-weight:600;

cursor:pointer;

transition:0.3s;

}

.glass-card button:hover{

transform:translateY(-2px);
box-shadow:0 10px 25px rgba(59,130,246,0.4);

}
  
</style>
  
</head>
<div id="navbar-placeholder"></div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar-placeholder").innerHTML = data;

    const navbar = document.querySelector(".main-navbar");
    const toggle = document.getElementById("navToggle");
    const dropdown = document.getElementById("navDropdown");

    // TOGGLE
    toggle.addEventListener("click", function (e) {
  e.stopPropagation();
  dropdown.classList.toggle("open");
  toggle.classList.toggle("active"); // ← TAMBAHAN INI
});

    document.addEventListener("click", function (e) {
  if (!dropdown.contains(e.target) && !toggle.contains(e.target)) {
    dropdown.classList.remove("open");
    toggle.classList.remove("active"); // ← TAMBAHAN INI
  }
});

   // ===== ACTIVE LINK AUTO DETECT =====
const currentPage = window.location.pathname.split("/").pop() || "index.html";

document.querySelectorAll(".nav-dropdown a").forEach(link => {
  const linkPage = link.getAttribute("href");

  if (linkPage === currentPage) {
    link.classList.add("active");
  }
});

    // SCROLL EFFECT
    window.addEventListener("scroll", function () {
      navbar.classList.toggle("scrolled", window.scrollY > 30);
    });
  });
</script>

<body>
<section class="package-hero">

<h1 style="color:white;font-size:32px;margin-bottom:10px;">
Testimoni Pelanggan
</h1>

<p style="color:#e0e7ff;max-width:620px;">
Dengar langsung dari pelanggan yang telah merasakan layanan premium kami
</p>

</section>

<section class="testimoni-input">

<div class="glass-card">

<div class="icon">
<i class="fa-solid fa-star"></i>
</div>

<h2>Bagikan Pengalaman Anda</h2>
<p>Berikan testimoni untuk pesanan yang sudah dibayar</p>

<input type="text" id="invoice" placeholder="Nomor Invoice (contoh: INV20261001001)">
<input type="text" id="nama" placeholder="Nama Anda">

<select id="rating">
<option value="">Rating layanan</option>
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<textarea id="pesan" placeholder="Ceritakan pengalaman Anda..."></textarea>

<button onclick="kirimTestimoni()">
<i class="fa-solid fa-paper-plane"></i>
Kirim Testimoni
</button>

</div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzuIo_i_TAAJevZMNqYtWuZoFB8wfj_RE",
  authDomain: "addstoreapps.firebaseapp.com",
  projectId: "addstoreapps",
  storageBucket: "addstoreapps.firebasestorage.app",
  messagingSenderId: "712672256555",
  appId: "1:712672256555:web:9069f8ea4d7776d1f3806e",
  measurementId: "G-92MPF6V96X"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


async function kirimTestimoni(){

let invoice = document.getElementById("invoice").value
let nama = document.getElementById("nama").value
let rating = document.getElementById("rating").value
let pesan = document.getElementById("pesan").value

if(!invoice || !nama || !rating || !pesan){
alert("Lengkapi dulu ya")
return
}

// cek invoice di database
const invoiceRef = doc(db,"invoice",invoice)
const invoiceSnap = await getDoc(invoiceRef)

if(!invoiceSnap.exists()){
alert("Nomor invoice tidak valid")
return
}

// kirim testimoni
await addDoc(collection(db,"testimoni"),{
invoice:invoice,
nama:nama,
rating:rating,
pesan:pesan,
tanggal:new Date().toLocaleDateString()
})

alert("Testimoni berhasil dikirim!")

}

window.kirimTestimoni = kirimTestimoni

</script>
  
</body>
</html>
