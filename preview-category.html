<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preview Category</title>

<style>

/* CSS */

</style>

</head>

<body>

<section class="preview-category">

    <div class="preview-tabs">

        <button class="active"
            data-category="premium">
            APK Premium
        </button>

        <button
            data-category="medsos">
            Kebutuhan Medsos
        </button>

        <button
            data-category="game">
            Topup Game
        </button>

    </div>

    <h2 class="preview-title">
        Aplikasi Premium Populer
    </h2>

    <div id="preview-card-grid">

    </div>

    <a href="produk.html"
       class="preview-button">

        Lihat Semua Aplikasi →

    </a>

</section>

<script>

const tabs=document.querySelectorAll(".preview-tabs button");

tabs.forEach(tab=>{

tab.onclick=()=>{

tabs.forEach(t=>t.classList.remove("active"));

tab.classList.add("active");

loadPreview(tab.dataset.category);

};

});

</script>

</body>
</html>
