<!DOCTYPE html>
<html>
<head>
<title>Pembayaran QRIS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f3f4f8;
margin:0;
}

/* HERO */

.package-hero{
background:linear-gradient(135deg,#7b2ff7,#5f0a87);
padding:50px 20px;
text-align:center;
}

.package-hero h1{
font-size:38px;
margin-bottom:6px;
color: white;
}

.package-hero p{
opacity:.8;
font-size:20px;
color: white;
}

/* CONTAINER */

.container{
width: 100%;
max-width:800px;
margin:30px auto;
background:#fff;
border-radius:14px;
padding:24px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

/* DETAIL */

.container h3{
color:#111827;
margin-bottom:15px;
text-align:center;
}

.detail-box{
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
padding:14px;
margin-bottom:20px;
}

.detail-grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
margin-bottom:20px;
}

.detail-card{
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:12px;
padding:14px 16px;

/* subtle shadow */
box-shadow:0 2px 6px rgba(0,0,0,0.05);

/* animasi ringan */
transition:all .2s ease;
}

/* hover halus */
.detail-card:hover{
transform:translateY(-2px);
box-shadow:0 6px 14px rgba(0,0,0,0.08);
}

.detail-label{
font-size:11px;
color:#9ca3af;
margin-bottom:4px;
letter-spacing:.3px;
}

.detail-value{
font-size:15px;
font-weight:600;
color:#111827;
}

.detail-item{
margin-bottom:14px;
}

.detail-label{
font-size:12px;
color:#9ca3af;
margin-bottom:3px;
}

.detail-value{
font-size:15px;
font-weight:600;
color:#111827;
}

/* SUMMARY */

.summary-box{
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
padding:14px;
animation:fadeUp .4s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(6px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.summary-row{
display:flex;
justify-content:space-between;
padding:10px 0;
font-size:14px;
color:#374151;
position:relative;
}

/* divider halus */
.summary-row::after{
content:"";
position:absolute;
left:0;
bottom:0;
width:100%;
height:1px;
background:linear-gradient(
  to right,
  transparent,
  #e5e7eb,
  transparent
);
}

.summary-total{
display:flex;
justify-content:space-between;
margin-top:10px;
padding-top:10px;
border-top:2px solid #e5e7eb;
font-weight:700;
font-size:16px;
color:#111827;
}

.summary-title{
font-size:14px;
font-weight:600;
color:#374151;
margin-bottom:10px;
}

.summary-item{
display:flex;
justify-content:space-between;
margin-bottom:12px;
}

.paket-title{
font-size:15px;
font-weight:600;
color:#111827;
margin-bottom:3px;
}

.paket-sub{
font-size:13px;
color:#6b7280;
}

.paket-banner{
width:100%;
margin-bottom:18px;
border-radius:10px;
overflow:hidden;
position:relative;
}

.paket-banner::after{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:100%;

/* gradient overlay halus */
background:linear-gradient(
  to top,
  rgba(0,0,0,0.35),
  rgba(0,0,0,0.1),
  transparent
);

/* biar gak ganggu klik */
pointer-events:none;
}

.paket-banner img{
width:100%;
height:210px;
object-fit:cover;
display:block;
transition:transform .4s ease;
}

.paket-banner:hover img{
transform:scale(1.03);
}

.price-box{
text-align:right;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:2px;
}

.price-old{
font-size:12px;
color:#9ca3af;
text-decoration:line-through;
}

.price-final{
font-size:18px;
font-weight:700;
color:#111827;
}

#paket-diskon{
color:#ef4444;
font-weight:600;
}

#paket-hemat{
color:#16a34a;
font-weight:600;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="package-hero">
<h1>Pembayaran QRIS</h1>
<p>Periksa detail pesanan kamu</p>
</div>

<!-- CONTAINER -->
<div class="container">

<h3>Detail Pesanan</h3>
<div class="paket-banner">
  <img id="paket-img" src="" alt="paket">
</div>

<div class="detail-grid">

  <div class="detail-card">
    <div class="detail-label">Nama</div>
    <div class="detail-value" id="nama"></div>
  </div>

  <div class="detail-card">
    <div class="detail-label">Nomor WhatsApp</div>
    <div class="detail-value" id="telepon"></div>
  </div>

  <div class="detail-card">
    <div class="detail-label">Email</div>
    <div class="detail-value" id="email"></div>
  </div>

</div>

<h3>Order Summary</h3>

<div class="summary-box">

<div class="summary-title">Order Summary</div>

<div class="summary-item">
<div>
<div class="paket-title" id="paket"></div>
<div class="paket-sub" id="paketDetail"></div>
</div>
</div>

<div class="summary-row">
<span>Subtotal</span>
<div id="paket-harga" class="price-box"></div>
</div>

<div class="summary-row">
<span>Diskon</span>
<span id="paket-diskon"></span>
</div>

<div class="summary-row">
<span>Hemat</span>
<span id="paket-hemat"></span>
</div>

<div class="summary-total">
<span>Total</span>
<span id="total"></span>
</div>

</div>

</div>

<script>

/* ==============================
AMBIL DATA DARI HALAMAN SEBELUMNYA
============================== */

const data = JSON.parse(localStorage.getItem("paymentData"))

if(!data){
alert("Data tidak ditemukan, kembali ke halaman sebelumnya")
window.location.href = "opsi-pembayaran.html"
}

// SET DATA
document.getElementById("nama").innerText = data.nama
document.getElementById("telepon").innerText = data.telepon
document.getElementById("email").innerText = data.email

document.getElementById("paket").innerText = data.paket
document.getElementById("paketDetail").innerText = data.paketDetail
document.getElementById("total").innerText = data.total

document.getElementById("paket-harga").innerHTML = data.paketHarga
document.getElementById("paket-diskon").innerText = data.diskon
document.getElementById("paket-hemat").innerText = data.hemat

document.getElementById("paket-img").src = data.image
</script>

</body>
</html>
