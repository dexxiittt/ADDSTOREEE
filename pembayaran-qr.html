<!DOCTYPE html>
<html>
<head>
<title>Pembayaran QRIS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f3f4f8;
margin:0;
}
  
/* HERO */

.package-hero{
background:linear-gradient(135deg,#7b2ff7,#5f0a87);
padding:50px 30px;
text-align:center;
}

.package-hero h1{
font-size:56px;
margin-bottom:6px;
color: fff;
}

.package-hero p{
opacity:.8;
font-size:28px;
color: fff;
}
/* CONTAINER */

.container{
width:100%;
max-width:700px;
margin: 48px auto;
background:#fff;
border-radius:14px;
padding:24px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

/* DETAIL */

.container h3{
color:#111827;
margin-bottom:15px;
}

.detail-box{
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
padding:14px;
margin-bottom:20px;
}

.detail-item{
margin-bottom:12px;
}

.detail-label{
font-size:13px;
color:#6b7280;
margin-bottom:3px;
}

.detail-value{
font-size:14px;
font-weight:600;
color:#111827;
}

/* SUMMARY */

.summary-box{
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
padding:14px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:14px;
color:#374151;
}

.summary-total{
display:flex;
justify-content:space-between;
margin-top:10px;
padding-top:10px;
border-top:2px solid #e5e7eb;
font-weight:700;
font-size:16px;
color:#111827;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="package-hero">
<h1>Pembayaran QRIS</h1>
<p>Periksa detail pesanan kamu</p>
</div>

<!-- CONTAINER -->
<div class="container">

<h3>Detail Pesanan</h3>

<div class="detail-box">

<div class="detail-item">
<div class="detail-label">Nama</div>
<div class="detail-value" id="nama"></div>
</div>

<div class="detail-item">
<div class="detail-label">Nomor WhatsApp</div>
<div class="detail-value" id="telepon"></div>
</div>

<div class="detail-item">
<div class="detail-label">Email</div>
<div class="detail-value" id="email"></div>
</div>

</div>

<h3>Order Summary</h3>

<div class="summary-box">

<div class="summary-row">
<span>Paket</span>
<span id="paket"></span>
</div>

<div class="summary-row">
<span>Detail</span>
<span id="paketDetail"></span>
</div>

<div class="summary-total">
<span>Total</span>
<span id="total"></span>
</div>

</div>

</div>

<script>

/* ==============================
AMBIL DATA DARI HALAMAN SEBELUMNYA
============================== */

const data = JSON.parse(localStorage.getItem("paymentData"))

if(!data){
alert("Data tidak ditemukan, kembali ke halaman sebelumnya")
window.location.href = "opsi-pembayaran.html"
}

// SET DATA
document.getElementById("nama").innerText = data.nama
document.getElementById("telepon").innerText = data.telepon
document.getElementById("email").innerText = data.email

document.getElementById("paket").innerText = data.paket
document.getElementById("paketDetail").innerText = data.paketDetail
document.getElementById("total").innerText = data.total

</script>

</body>
</html>
