<!DOCTYPE html>
<html>
<head>
<title>Opsi Pembayaran</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#ffffff;
margin:0;
color:white;
}

/* HERO */

.package-hero{
background:linear-gradient(135deg,#7b2ff7,#5f0a87);
padding:50px 20px;
text-align:center;
}

.package-hero h1{
font-size:26px;
margin-bottom:6px;
}

.package-hero p{
opacity:.8;
font-size:14px;
}

/* CONTAINER */

.payment-container{
max-width:420px;
margin:35px auto;
background:#0f172a;
border-radius:14px;
padding:22px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* INPUT */

.payment-container input{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:none;
background:#020617;
color:white;
font-size:14px;
}

.payment-container input::placeholder{
color:#94a3b8;
}

/* BUTTON */

.cta-btn{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#8b5cf6,#6366f1);
color:white;
font-weight:600;
cursor:pointer;
}

.cta-btn:hover{
opacity:.9;
}

/* LYNK BUTTON */

.lynk-btn{
text-align:center;
margin-top:25px;
}

.lynk-btn button{
padding:14px 30px;
border:none;
border-radius:30px;
background:#10b981;
color:white;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>


<!-- HERO -->

<div class="package-hero">
<h1>Opsi Pembayaran</h1>
<p>Pilih pembayaran yang ingin dilakukan</p>
</div>


<!-- FORM -->

<div class="payment-container">

<h3>Format Aplikasi Premium</h3>

<input type="text" placeholder="Nama" id="nama">
<input type="text" placeholder="Nomor Telepon" id="telepon">
<input type="email" placeholder="Gmail" id="gmail">

<input type="text" id="paket" placeholder="Paket" readonly>
<input type="text" id="durasi" placeholder="Durasi" readonly>

<input type="text" value="QRIS Payment" readonly>

<button class="cta-btn" onclick="bayarQris()">
Lanjut ke Pembayaran
</button>

</div>


<div class="lynk-btn">
<button onclick="bayarLynk()">
Lanjut Pembayaran Lynk ID
</button>
</div>


<script>

/* ==============================
AMBIL DATA PACKAGE DARI URL
============================== */

const params = new URLSearchParams(window.location.search)

const paket = params.get("paket")
const durasi = params.get("durasi")

document.getElementById("paket").value = paket || "Paket tidak ditemukan"
document.getElementById("durasi").value = durasi || "Durasi tidak ditemukan"



/* ==============================
FETCH SPREADSHEET
============================== */

const sheetURL =
"https://opensheet.elk.sh/1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08/PACKAGE_DETAIL"

let paymentData = []

fetch(sheetURL)
.then(res => res.json())
.then(data => {
paymentData = data
})


/* ==============================
QRIS
============================== */

function bayarQris(){

const row = paymentData.find(p => p.paket == paket)

if(!row){
alert("Data paket tidak ditemukan")
return
}

window.location.href = row.qris_url

}



/* ==============================
LYNK ID
============================== */

function bayarLynk(){

const row = paymentData.find(p => p.paket == paket)

if(!row){
alert("Data paket tidak ditemukan")
return
}

window.location.href = row.lynk_id

}

</script>

</body>
</html>
