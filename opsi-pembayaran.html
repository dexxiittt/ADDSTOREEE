<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengisian format</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="components/opsi-pembayaran/opsi-pembayaran.css">

<link rel="stylesheet" href="components/footer.css">

</head>

<body>
<!-- NAVBAR -->
<div id="navbar-placeholder"></div>
  <script src="components/navbar.js"></script>

<!-- HERO -->

<div class="package-hero">
<h1>Format Aplikasi Premium</h1>
<p>Pengisian format aplikasi Premium</p>
</div>

<!-- FORM -->

<div class="payment-container">

<div class="paket-banner">
<img id="paket-img" src="" alt="paket">
</div>

<div id="form-input">
<h3>Format Aplikasi Premium</h3>

<label class="icon-label">Nama Lengkap</label>
<div class="input-icon">
  <span><i class="fa-solid fa-user"></i></span>
  <input type="text" placeholder="Masukan Nama Lengkap Kamu" id="nama">
</div>

<label class="icon-label">Nomor WhatsApp</label>
<div class="input-icon">
  <span><i class="fa-solid fa-mobile-screen-button"></i></span>
  <input type="text" placeholder="Contoh: 0858*******8" id="telepon">
</div>

<label class="icon-label">Email</label>
<div class="input-icon">
  <span><i class="fa-solid fa-envelope"></i></span>
  <input type="email" placeholder="Contoh: arifabcdefg@gmail.com" id="gmail">
</div>

</div>

<label>Order Summary</label>

<div class="paket-info">
<div class="summary-title">Order Summary</div>
<div class="summary-item">
<div>
<div class="paket-title" id="paket"></div>
<div class="paket-sub" id="paket-detail"></div>
</div>
</div>

<div class="summary-row">
<span>Subtotal</span>
<div id="paket-harga" class="price-box"></div>
</div>

<div class="summary-row">
<span>Diskon</span>
<span id="paket-diskon"></span>
</div>

<div class="summary-row">
<span>Hemat</span>
<span id="paket-hemat"></span>
</div>

<div class="summary-row">
  <span>Payment</span>

  <div class="payment-support">
    <img src="components/assets/payment/qris.svg" alt="QRIS">
    <img src="components/assets/payment/gopay.svg" alt="GoPay">
    <img src="components/assets/payment/dana.svg" alt="DANA">
    <img src="components/assets/payment/shopeepay.svg" alt="ShopeePay">
    <img src="components/assets/payment/multicard.svg" alt="Multi Card">
  </div>
</div>

<div class="summary-total">
<span>Total</span>
<span id="paket-total"></span>
</div>
</div>

<button class="cta-btn" id="payBtn" onclick="handlePayment()" disabled>
Lanjut Pembayaran
</button>

<div class="secure-info">
<i class="fa-solid fa-shield-halved"></i>
<span>Transaksi Aman &amp; Terenkripsi</span>
</div>

</div>

<script src="components/opsi-pembayaran/opsi-pembayaran.js?v=2"></script>

<!-- FOOTER -->
  <div id="footer-container"></div>
  <script src="components/footer.js"></script>
</body>
</html>
