<!DOCTYPE html>
<html>
<head>
<title>Opsi Pembayaran</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f3f4f8;
margin:0;
color:white;
}

/* HERO */

.package-hero{
background:linear-gradient(135deg,#7b2ff7,#5f0a87);
padding:50px 20px;
text-align:center;
}

.package-hero h1{
font-size:38px;
margin-bottom:6px;
}

.package-hero p{
opacity:.8;
font-size:20px;
}

/* CONTAINER */

.payment-container{
max-width:800px;
width:100%;
margin:35px auto;
background:#ffffff;
border-radius:14px;
padding:26px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
transition:box-shadow .2s ease;
}

.payment-container:hover{
box-shadow:0 8px 22px rgba(0,0,0,0.2);
}

/* INPUT */

.payment-container input{
width:100%;
padding:6px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #e5e7eb;
background:#f9fafb;
color:#111827;
font-size:14px;
transition:border .2s ease;
}

.paket-info{
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
padding:12px 14px;
margin-bottom:14px;
}

.paket-title{
font-size:15px;
font-weight:600;
color:#111827;
margin-bottom:3px;
}

.paket-sub{
font-size:13px;
color:#6b7280;
}

.paket-price-wrap{
margin-top:10px;
padding-top:10px;
border-top:1px dashed #e5e7eb;
display:flex;
justify-content:space-between;
align-items:center;
}

.paket-price-label{
font-size:13px;
color:#6b7280;
}

.paket-price{
font-size:16px;
font-weight:700;
color:#111827;
}

.summary-title{
font-size:14px;
font-weight:600;
color:#374151;
margin-bottom:10px;
}

.summary-item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.summary-row{
display:flex;
justify-content:space-between;
padding:6px 0;
font-size:14px;
color:#374151;
border-top:1px dashed #e5e7eb;
}

.summary-row span:last-child{
font-weight:600;
color:#111827;
}

.payment-container label{
display:block;
font-size:13px;
font-weight:600;
margin-top:8px;
margin-bottom:4px;
color:#374151;
}
  
.payment-container input:focus{
outline:none;
border:1px solid #8b5cf6;
background:#ffffff;
}

.payment-container h3{
color:#111827;
margin-bottom:15px;
}

.payment-container input::placeholder{
color:#94a3b8;
}

/* BUTTON */

.cta-btn{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#8b5cf6,#6366f1);
color:white;
font-weight:600;
cursor:pointer;
}

.cta-btn:hover{
opacity:.9;
}

/* LYNK BUTTON */

.lynk-btn{
text-align:center;
margin-top:25px;
}

.lynk-btn button{
padding:14px 30px;
border:none;
border-radius:30px;
background:#10b981;
color:white;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>


<!-- HERO -->

<div class="package-hero">
<h1>Opsi Pembayaran</h1>
<p>Pilih pembayaran yang ingin dilakukan</p>
</div>


<!-- FORM -->

<div class="payment-container">

<h3>Format Aplikasi Premium</h3>

<label>*Nama</label>
<input type="text" placeholder="Contoh: Arif" id="nama">

<label>#Nomor Telepon</label>
<input type="text" placeholder="Contoh: 0858*******8" id="telepon">

<label>@Gmail</label>
<input type="email" placeholder="Contoh: arifabcdefg@gmail.com" id="gmail">

<label>Order Summary</label>

<div class="paket-info">
<div class="summary-title">Order Summary</div>
<div class="summary-item">
<div>
<div class="paket-title" id="paket"></div>
<div class="paket-sub" id="paket-detail"></div>
</div>
</div>
  
<div class="summary-row">
<span>Harga</span>
<span id="paket-harga"></span>
</div>

<div class="summary-row">
<span>Metode</span>
<span>QRIS</span>
</div>
</div>

<button class="cta-btn" onclick="bayarQris()">
Lanjut ke Pembayaran
</button>

</div>


<div class="lynk-btn">
<button onclick="bayarLynk()">
Lanjut Pembayaran Lynk ID
</button>
</div>


<script>

/* ==============================
AMBIL DATA PACKAGE DARI URL
============================== */

const params = new URLSearchParams(window.location.search)

const paket = params.get("paket")
const durasi = params.get("durasi")
const harga = params.get("harga")

document.getElementById("paket").innerText = paket || "Paket tidak ditemukan"
document.getElementById("paket-detail").innerText =
"Invite Member • " + (durasi || "Durasi tidak ditemukan")
document.getElementById("paket-harga").innerText =
harga ? "Rp " + Number(harga).toLocaleString("id-ID") : "-"


/* ==============================
FETCH SPREADSHEET
============================== */

const sheetURL =
"https://opensheet.elk.sh/1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08/PACKAGE_DETAIL"

let paymentData = []

fetch(sheetURL)
.then(res => res.json())
.then(data => {
paymentData = data
})


/* ==============================
QRIS
============================== */

function bayarQris(){

const row = paymentData.find(p => p.paket == paket)

if(!row){
alert("Data paket tidak ditemukan")
return
}

window.location.href = row.qris_url

}



/* ==============================
LYNK ID
============================== */

function bayarLynk(){

const row = paymentData.find(p => p.paket == paket)

if(!row){
alert("Data paket tidak ditemukan")
return
}

window.location.href = row.lynk_id

}

</script>

</body>
</html>
