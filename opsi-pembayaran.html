<!DOCTYPE html>
<html>
<head>
<title>Opsi Pembayaran</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f3f4f8;
margin:0;
color:white;
}

/* HERO */

.package-hero{
background:linear-gradient(135deg,#7b2ff7,#5f0a87);
padding:50px 20px;
text-align:center;
}

.package-hero h1{
font-size:38px;
margin-bottom:6px;
}

.package-hero p{
opacity:.8;
font-size:20px;
}

/* CONTAINER */

.payment-container{
max-width:800px;
width:100%;
margin:35px auto;
background:#ffffff;
border-radius:14px;
padding:26px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
transition:box-shadow .2s ease;
}

.paket-banner{
width:100%;
margin-bottom:18px;
border-radius:10px;
overflow:hidden;
}

.paket-banner img{
width:100%;
height:210px;
object-fit:cover;
display:block;
}

.payment-container:hover{
box-shadow:0 8px 22px rgba(0,0,0,0.2);
}

/* INPUT */

.payment-container input{
width:95%;
padding:6px;
border-radius:8px;
border:1px solid #e5e7eb;
background:#f9fafb;
color:#111827;
font-size:14px;
transition:border .2s ease;
}

.paket-info{
background:#f9fafb;
border:1px solid #e5e7eb;
border-radius:10px;
padding:12px 14px;
margin-bottom:14px;
}

.paket-title{
font-size:15px;
font-weight:600;
color:#111827;
margin-bottom:3px;
}

.paket-sub{
font-size:13px;
color:#6b7280;
}

.paket-price-wrap{
margin-top:10px;
padding-top:10px;
border-top:1px dashed #e5e7eb;
display:flex;
justify-content:space-between;
align-items:center;
}

.paket-price-label{
font-size:13px;
color:#6b7280;
}

.paket-price{
font-size:16px;
font-weight:700;
color:#111827;
}

.price-box{
text-align:right;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:2px;
}

/* ===== PRICE STYLE PREMIUM ===== */

.price-old{
font-size:12px;
color:#9ca3af;
text-decoration:line-through;
display:block;
}

.price-final{
font-size:18px;
font-weight:700;
color:#111827;
letter-spacing:-0.3px;
}

.discount-info{
font-size:12px;
color:#16a34a;
font-weight:600;
margin-top:-6px;
margin-bottom:8px;

display:flex;
justify-content:flex-end;
gap:6px;
align-items:center;
}

.discount-info span{
background:rgba(34,197,94,.1);
padding:3px 8px;
border-radius:999px;
}

#paket-diskon{
color:#ef4444;
font-weight:600;
}

#paket-hemat{
color:#16a34a;
font-weight:600;
}

@keyframes badgePulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.05)}
}

.summary-title{
font-size:14px;
font-weight:600;
color:#374151;
margin-bottom:10px;
}

.summary-item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.summary-row{
display:flex;
justify-content:space-between;
padding:6px 0;
font-size:14px;
color:#374151;
border-top:1px dashed #e5e7eb;
}

.summary-row span:last-child{
font-weight:600;
color:#111827;
}

.summary-total{
display:flex;
justify-content:space-between;
padding-top:10px;
margin-top:8px;
border-top:2px solid #e5e7eb;
font-size:16px;
font-weight:700;
color:#111827;
}

.secure-info{
text-align:center;
margin-top:12px;
font-size:13px;
color:#6b7280;
background:#f9fafb;
border:1px solid #e5e7eb;
padding:6px 12px;
border-radius:8px;
display:inline-flex;
gap:6px;
}

.icon-label{
display:flex;
align-items:center;
gap:6px;
font-size:13px;
font-weight:600;
color:#374151;
}

.input-icon{
position:relative;
margin-bottom:12px;
}

.input-icon span{
position:absolute;
left:10px;
top:50%;
transform:translateY(-50%);
font-size:15px;
opacity:.6;
}

.input-icon input{
padding-left:34px;
}
  
.icon-label::first-letter{
font-size:15px;
}
  
.payment-container label{
display:block;
font-size:13px;
font-weight:600;
margin-top:8px;
margin-bottom:4px;
color:#374151;
}
  
.payment-container input:focus{
outline:none;
border:1px solid #8b5cf6;
background:#ffffff;
}

.payment-container h3{
color:#111827;
margin-bottom:15px;
}

.payment-container input::placeholder{
color:#94a3b8;
}

/* BUTTON */

.cta-btn{
width:100%;
padding:14px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#8b5cf6,#6366f1);
color:white;
font-weight:600;
cursor:pointer;
}

.cta-btn.lynk{
background:linear-gradient(135deg,#10b981,#059669);
}
  
.cta-btn:hover{
opacity:.9;
}

/* LYNK BUTTON */

.cta-btn:disabled{
opacity:.5;
cursor:not-allowed;
}

.loading-dots::after{
content:'...';
animation:dots 1s infinite steps(3);
}

@keyframes dots{
0%{content:'';}
33%{content:'.';}
66%{content:'..';}
100%{content:'...';}
}

/* SWITCH PAYMENT */

.payment-switch{
display:flex;
justify-content:center;
gap:10px;
margin-top:30px;
margin-bottom:20px;
}

.switch-btn{
padding:10px 20px;
border:none;
border-radius:30px;
background:#e5e7eb;
color:#374151;
font-weight:600;
cursor:pointer;
transition:all .2s ease;
transform:scale(1);
}

.switch-btn:active{
transform:scale(0.96);
}

#form-input{
transition:opacity .25s ease, transform .25s ease;
transform:translateY(0);
opacity:1;
will-change:opacity, transform;
}

#form-input.hide{
opacity:0;
transform:translateY(-10px);
pointer-events:none;
}

.payment-container{
transition:transform .2s ease;
}

.payment-container:active{
transform:scale(0.995);
}

</style>
</head>

<body>


<!-- HERO -->

<div class="package-hero">
<h1>Opsi Pembayaran</h1>
<p>Pilih pembayaran yang ingin dilakukan</p>
</div>

<div class="payment-switch">
  <button class="switch-btn active" id="btnQris" onclick="setPayment('qris')">
    QRIS
  </button>
  <button class="switch-btn" id="btnLynk" onclick="setPayment('lynk')">
    Lynk ID
  </button>
</div>
<!-- FORM -->

<div class="payment-container">

<div class="paket-banner">
<img id="paket-img" src="" alt="paket">
</div>
  
<div id="form-input">
<h3>Format Aplikasi Premium</h3>

<label class="icon-label">Nama Lengkap</label>
<div class="input-icon">
<span>👤</span>
<input type="text" placeholder="Masukan Nama Lengkap Kamu" id="nama">
</div>

<label class="icon-label">Nomor WhatsApp</label>
<div class="input-icon">
<span>📱</span>
<input type="text" placeholder="Contoh: 0858*******8" id="telepon">
</div>

<label class="icon-label">Email</label>
<div class="input-icon">
<span>✉️</span>
<input type="email" placeholder="Contoh: arifabcdefg@gmail.com" id="gmail">
</div>

</div>

<label>Order Summary</label>

<div class="paket-info">
<div class="summary-title">Order Summary</div>
<div class="summary-item">
<div>
<div class="paket-title" id="paket"></div>
<div class="paket-sub" id="paket-detail"></div>
</div>
</div>
  
<div class="summary-row">
<span>Subtotal</span>
<div id="paket-harga" class="price-box"></div>
</div>

<div class="summary-row">
<span>Diskon</span>
<span id="paket-diskon"></span>
</div>

<div class="summary-row">
<span>Hemat</span>
<span id="paket-hemat"></span>
</div>

<div class="summary-row">
<span>Payment</span>
<span id="payment-method">QRIS</span>
</div>

<div class="summary-total">
<span>Total</span>
<span id="paket-total"></span>
</div>
</div>

<button class="cta-btn" id="payBtn" onclick="handlePayment()" disabled>
Lanjut Pembayaran QRIS
</button>

<div class="secure-info">
Transaksi aman & terenkripsi
</div>

</div>


<script>

/* ==============================
AMBIL DATA PACKAGE DARI URL
============================== */

const params = new URLSearchParams(window.location.search)

const packageId = params.get("package_id")


function parseDiscount(val){
  if(!val) return 0

  return Number(
    String(val)
      .replace('%','')
      .replace(',', '.')
      .trim()
  ) || 0
}
  
/* ==============================
FETCH SPREADSHEET
============================== */

const sheetURL =
"https://opensheet.elk.sh/1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08/PACKAGE_DETAIL"

let paymentData = []

fetch(sheetURL)
.then(res => res.json())
.then(data => {

paymentData = data

const row = data.find(p => p.package_id == packageId)

if(!row){
alert("Paket tidak ditemukan")
return
}

// ✅ SET TEXT
document.getElementById("paket").innerText = row.title
document.getElementById("paket-detail").innerText =
"Invite Member • " + row.duration

const price = Number(row.price) || 0
const discount = parseDiscount(row.discount)

const final = discount > 0
  ? Math.round(price - (price * discount / 100))
  : price

const diskonEl = document.getElementById("paket-diskon")
const hematEl = document.getElementById("paket-hemat")

if(discount > 0){

const hemat = price - final

// SUBTOTAL (KANAN FULL)
document.getElementById("paket-harga").innerHTML = `
<span class="price-old">
Rp ${price.toLocaleString("id-ID")}
</span>

<span class="price-final">
Rp ${final.toLocaleString("id-ID")}
</span>`

// DISKON ROW
diskonEl.innerText = `-${discount}%`

// HEMAT ROW
hematEl.innerText = `Rp ${hemat.toLocaleString("id-ID")}`

}else{

document.getElementById("paket-harga").innerHTML = `
<span class="price-final">
Rp ${final.toLocaleString("id-ID")}
</span>
`

diskonEl.innerText = "-"
hematEl.innerText = "-"
}
  
document.getElementById("paket-total").innerText =
"Rp " + final.toLocaleString("id-ID")
  
// ✅ SET IMAGE
const paketImg = document.getElementById("paket-img")

if(row.image_url){
paketImg.src = row.image_url
}else{
paketImg.src = "https://via.placeholder.com/800x200"
}

})

/* ==============================
QRIS
============================== */

function bayarQris(){
const row = paymentData.find(p => p.package_id == packageId)
if(!row){
alert("Data paket tidak ditemukan")
return
}

const btn = document.getElementById("payBtn")
btn.innerText = "Memproses"
btn.classList.add("loading-dots")
btn.disabled = true

setTimeout(()=>{
window.location.href = row.qris_url
},700)
}



/* ==============================
LYNK ID
============================== */

function bayarLynk(){
const row = paymentData.find(p => p.package_id == packageId)
if(!row){
alert("Data paket tidak ditemukan")
return
}
window.location.href = row.lynk_id
}



/* ==============================
VALIDASI FORM
============================== */

const namaInput = document.getElementById("nama")

// ==============================
// AUTO CAPITALIZE NAMA
// ==============================

if(namaInput){
  namaInput.addEventListener("input", () => {
    let val = namaInput.value

    val = val
      .toLowerCase()
      .replace(/[^a-zA-Z\s]/g, "")
      .replace(/\b\w/g, c => c.toUpperCase())

    namaInput.value = val
  })
}

  
const telInput = document.getElementById("telepon")
const gmailInput = document.getElementById("gmail")
const payBtn = document.getElementById("payBtn")

function cekForm(){
const email = gmailInput.value.trim()
if(
namaInput.value.trim() !== "" &&
telInput.value.trim() !== "" &&
email !== "" &&
email.endsWith("@gmail.com")
){
payBtn.disabled = false
}else{
payBtn.disabled = true
}
}

namaInput.addEventListener("input",cekForm)
telInput.addEventListener("input",cekForm)
gmailInput.addEventListener("input",cekForm)



/* ==============================
AUTO FORMAT NOMOR HP
08 → +628
============================== */

telInput.addEventListener("blur",()=>{
let val = telInput.value.trim()
if(val.startsWith("08")){
telInput.value = "+628" + val.substring(2)
}
})



/* ==============================
VALIDASI EMAIL GMAIL
============================== */

function validEmail(){
const email = gmailInput.value.trim()
if(email !== "" && !email.endsWith("@gmail.com")){
gmailInput.style.border = "1px solid #ef4444"
payBtn.disabled = true
}else{
gmailInput.style.border = ""
cekForm()
}
}
gmailInput.addEventListener("input",validEmail)


/* ==============================
SWITCH BUTTON
============================== */

let selectedPayment = "qris"

function setPayment(method){
selectedPayment = method

const btnQris = document.getElementById("btnQris")
const btnLynk = document.getElementById("btnLynk")
const label = document.getElementById("payment-method")
const payBtn = document.getElementById("payBtn")
const form = document.getElementById("form-input")

btnQris.classList.remove("active")
btnLynk.classList.remove("active")

if(method === "qris"){
btnQris.classList.add("active")
label.innerText = "QRIS"
payBtn.innerText = "Lanjut Pembayaran QRIS"

// warna default
payBtn.classList.remove("lynk")

form.classList.remove("hide")
form.style.display = "block"

cekForm()

}else{
btnLynk.classList.add("active")
label.innerText = "Lynk ID"
payBtn.innerText = "Lanjut Pembayaran Lynk ID"

// 🔥 WARNA HIJAU
payBtn.classList.add("lynk")

form.classList.add("hide")

setTimeout(()=>{
form.style.display = "none"
},200)

payBtn.disabled = false
}
}
   
</script>

</body>
</html>
