<!DOCTYPE html>
<html>
<head>
<title>Status Pesanan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&
  family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  
<style>
body {
  overflow-x: hidden;
  background: #0b0b0f;
}

html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* HERO UNGU SAMA PERSIS */
.package-hero {
  width: 100%;
  min-height: 260px;
  background: linear-gradient(
    135deg,
    #493d84,
    #6d28d9
  );
  padding: 72px 20px 60px;
  text-align: center;

  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.package-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.package-hero p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.85);
}

/* Wrapper nanti untuk card */
.status-wrapper {
  width: 100%;
  padding: 0 0 80px;
}

/* ===== PACKAGE PREVIEW CARD ===== */
.package-preview {
  width: 100%;
  margin: 13px 0 0;   /* turun 10px + ada jarak kiri kanan */
  padding: 28px 20px 32px;

  position: relative;
  z-index: 2;

  border-radius: 22px;    /* aktifkan radius */

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(18px);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.55);

  color: white;
}

.package-preview img {
  width: 100%;
  height: clamp(180px, 42vw, 300px);
  object-fit: cover;
  border-radius: 16px;
  margin-bottom: 16px;
}

.package-preview h3 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 600;
}

.package-preview p {
  margin: 0;
  opacity: 0.75;
  font-size: 14px;
}

.package-preview {
  font-family: 'Manrope', sans-serif;
}

.package-preview h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  letter-spacing: 0.6px;
}

.detail-card {
  font-family: 'Manrope', sans-serif;
}

.detail-card h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  letter-spacing: 0.8px;
}

.package-preview h3,
.detail-card h2 {
  text-shadow: 0 4px 12px rgba(0,0,0,0.35);
}

  /* GLASS META CARD */

.status-meta-card {
  width: 100%;
  margin: 18px 0 0;
  padding: 22px;

  border-radius: 22px;

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(18px);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.45);

  color: white;
  font-family: 'Manrope', sans-serif;
}

.status-meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  text-align: center;
}

.status-meta-grid span {
  display: block;
  font-size: 11px;
  opacity: .5;
  letter-spacing: 1px;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.status-meta-grid b {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* ============================= */
/* PREMIUM META STYLE CLEAN */
/* ============================= */

/* Label */
.status-meta-grid span {
  font-size: 10px;
  letter-spacing: 2px;
  opacity: 0.45;
  font-weight: 500;
  text-transform: uppercase;
}

/* Base value style */
.status-meta-grid b {
  display: block;
  margin-top: 4px;
}

/* Invoice */
.status-meta-grid div:nth-child(1) b {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 2px;
  font-family: 'Manrope', sans-serif;
  text-shadow: 0 4px 20px rgba(255,255,255,0.15);
}

/* Durasi */
.status-meta-grid div:nth-child(2) b {
  font-size: 24px;
  font-weight: 700;
  font-family: 'Cormorant Garamond', serif;
  letter-spacing: 1px;
  text-shadow: 0 4px 20px rgba(255,255,255,0.12);
}

/* Spacing */
.status-meta-grid div {
  padding: 8px 0;
}

/* ============================= */
/* FADE UP SYSTEM (Lightweight) */
/* ============================= */

.fade-up {
  opacity: 0;
  transform: translate3d(0, 24px, 0);
  transition: opacity 0.6s ease, transform 0.6s ease;
  will-change: opacity, transform;
}

/* delay akan diisi otomatis via JS */
.fade-up.show {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}

/* ============================= */
/* PREMIUM STATUS BADGE */
/* ============================= */

.status-badge-expired {
  display: inline-block;
  margin-top: 12px;
  padding: 9px 34px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  border-radius: 999px;

  background: linear-gradient(
    135deg,
    rgba(255, 60, 60, 0.18),
    rgba(255, 0, 0, 0.10)
  );

  backdrop-filter: blur(12px);

  color: #ff4d4f;

  border: 1px solid rgba(255, 80, 80, 0.5);

  box-shadow:
    0 8px 25px rgba(255, 0, 0, 0.15);

  text-transform: uppercase;
}

/* ============================= */
/* MICRO PULSE SYSTEM */
/* ============================= */

@keyframes microPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.015); }
  100% { transform: scale(1); }
}

@keyframes microPulseStrong {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.pulse-soft {
  animation: microPulse 0.4s ease;
}

.pulse-strong {
  animation: microPulseStrong 0.5s ease;
}

/* Lebih halus di device cepat */
@media (prefers-reduced-motion: reduce) {
  .fade-up {
    transition: none;
    transform: none;
    opacity: 1;
  }
}


@media (min-width: 1200px) {
  .package-preview {
    padding-left: 10%;
    padding-right: 10%;
  }
}
  
</style>
</head>

<body>

<!-- HERO -->
<div class="package-hero">
  <h1>Status Pesanan</h1>
  <p>Status paket dan detail pesanan</p>
</div>

<section class="status-wrapper">
  <!-- Nanti di sini kita bikin card warranty_data -->
</section>

<script>
// =============================
// AMBIL PARAMETER INVOICE
// =============================
const params = new URLSearchParams(window.location.search);
const invoice = params.get("inv");

if (!invoice) {
  window.location.href = "invoice.html";
}

// =============================
// TAMPILKAN LOADING CARD
// =============================
const wrapper = document.querySelector(".status-wrapper");

wrapper.innerHTML = `
  <div style="
    width: 100%;
    padding: 120px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius: 24px;
    background: rgba(18,18,28,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
    font-family: 'Plus Jakarta Sans', sans-serif;
  ">
    <h2 style="margin-bottom:15px;">Memuat Data...</h2>
    <p style="opacity:0.7;">Invoice:</p>
    <h3 style="margin-top:5px; color:#9f7aea;">${invoice}</h3>
  </div>
`;

// =============================
// SERVER TIME API
// =============================
const timeAPI = "https://script.google.com/macros/s/AKfycbx7vo05kZaGjn1VuI9J7XZjwenytoySEF4AjbhtRvEXrFYzkE9AkFQpuISMco3pAyo2/exec";

async function getServerTime() {
  const res = await fetch(timeAPI);
  const data = await res.json();
  return new Date(data.serverTime);
}
  
// =============================
// KONFIGURASI SHEET WARRANTY_DATA
// =============================
const sheetID = "1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08";
const sheetName = "WARRANTY_DATA";
const sheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;


// =============================
// FETCH PACKAGE_DETAIL DARI SHEET
// =============================
async function fetchPackageDetail(productId, durationText) {
  const url = `https://docs.google.com/spreadsheets/d/1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08/gviz/tq?tqx=out:json&sheet=PACKAGE_DETAIL`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substr(47).slice(0, -2));

  const headers = json.table.cols.map(col => col.label.trim());
  const rows = json.table.rows;

  let found = null;
  rows.forEach(row => {
    if (!row.c) return;
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = row.c[i]?.v ?? "";
    });

    if (
      String(obj.product_id) === String(productId) &&
      String(obj.duration).toLowerCase() === String(durationText).toLowerCase()
    ) {
      found = obj;
    }
  });

  return found;
}
  
// =============================
// FETCH WARRANTY_DATA
// =============================
async function fetchWarrantyData() {
  try {
    const res = await fetch(sheetURL);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows;

    let matchedData = null;

    rows.forEach(row => {
      if (!row.c) return;

      const invoiceCell = row.c[0]?.v;
      if (String(invoiceCell) === String(invoice)) {
        matchedData = row;
      }
    });

    // =============================
    // KALAU DATA DITEMUKAN
    // =============================
    if (matchedData) {

      wrapper.style.display = "block";

    const headers = json.table.cols.map(col => col.label.trim());

const rowData = {};
headers.forEach((header, index) => {
  rowData[header.trim()] = matchedData.c[index]?.v ?? "";
});

const product_id  = rowData.product_id || "-";
const title       = rowData.title || "-";
const packageName = rowData.package || "-";


      
const durationDays = parseInt(rowData.duration_days) || 0;
let durationDisplay = "-";
const status = rowData.status || "-";
const image_url = rowData.image_url || "";

const activated_at = rowData[headers.find(h =>
  h.toLowerCase().includes("activated")
)] || "";

      

  // Hitung harga setelah diskon
  const finalPrice = Math.round(
    priceNum - (priceNum * discountPercent / 100)
  );

  // Harga coret (asli)
  hargaCoret = `
    <span style="
      text-decoration:line-through;
      opacity:.5;
      font-size:14px;
    ">
      Rp${priceNum.toLocaleString("id-ID")}
    </span>
  `;

  // Harga final
  hargaFinal = `
    <span style="
      font-size:22px;
      font-weight:800;
    ">
      Rp${finalPrice.toLocaleString("id-ID")}
    </span>
  `;

  // Badge diskon
  if (discountPercent > 0) {
    discountBadge = `
      <span style="
        font-size:11px;
        padding:4px 10px;
        border-radius:999px;
        background:linear-gradient(135deg,#ff6b6b,#ef4444);
        font-weight:700;
      ">
        ${pkg.discount}
      </span>
    `;
  }

}


      
const metodePembayaran = `
  Lynk ID Verified
  <div style="opacity:.6; font-size:12px; margin-top:4px;">
    Checkout diproses oleh Lynk ID
  </div>
`;


      
let berlakuSampai = "-";

if (durationDays > 0 && activated_at) {
  const tempDate = new Date(activated_at);
  if (!isNaN(tempDate.getTime())) {
    const exp = new Date(tempDate);
    exp.setDate(exp.getDate() + durationDays);

    berlakuSampai = exp.toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  }
}

if (durationDays >= 30) {

  const months = Math.floor(durationDays / 30);
  const remainingDays = durationDays % 30;

  if (remainingDays === 0) {
    durationDisplay = `${months} Bulan`;
  } else {
    durationDisplay = `${months} Bulan (${remainingDays} Hari)`;
  }

} else if (durationDays > 0) {

  durationDisplay = `${durationDays} Hari`;
}

const pkg = await fetchPackageDetail(product_id, durationDisplay);

let hargaFinal = "-";
let hargaCoret = "";
let discountBadge = "";

if (pkg) {

  const priceNum = parseInt(String(pkg.price).replace(/\D/g,"")) || 0;

  let discountPercent = 0;
  if (pkg.discount) {
    discountPercent = parseFloat(
      String(pkg.discount).replace(",", ".").replace("%","")
    ) || 0;
  }
}

console.log("activated_at:", activated_at);
console.log("durationDays:", durationDays);

      wrapper.innerHTML = `
  <!-- CARD 1 -->
  <div class="package-preview fade-up">

    <img 
      src="${image_url || 'https://dummyimage.com/800x400/111827/ffffff&text=Package'}" 
      alt="${title}"
      onerror="this.src='https://dummyimage.com/800x400/111827/ffffff&text=Package';">

    <h2 style="
      font-family:'Cormorant Garamond', serif;
      font-size:30px;
      margin:20px 0 10px;
      text-align:center;
    ">
      Detail Pesanan
    </h2>

    <h3>${title}</h3>
    <p style="margin-bottom:20px;">${packageName}</p>

  </div>

  <!-- CARD 2 (GLASS META) -->
<div class="status-meta-card fade-up">
  <div class="status-meta-grid">

    <div>
      <span>Invoice</span>
      <b>${invoice}</b>
    </div>

    <div>
      <span>Durasi</span>
      <b>${durationDisplay}</b>
    </div>

    <div>
      <span>Status</span>
      <b id="statusText">
        ${status}
      </b>
      <div id="countdownBox" style="margin-top:6px; font-size:13px; opacity:.8;">
        Garansi Tersisa
        <div id="countdownTimer" style="font-weight:600; margin-top:3px;"></div>
      </div>
    </div>

  </div>
</div>

<!-- CARD 3 (GLASS DETAIL TAMBAHAN) -->
<div class="status-meta-card fade-up">
  <div class="status-meta-grid">

    <div>
      <span>Berlaku Sampai</span>
      <b>${berlakuSampai}</b>
    </div>

    <div>
      <span>Harga</span>
      <b style="display:flex; gap:8px; align-items:center; justify-content:center;">
  ${hargaCoret}
  ${hargaFinal}
  ${discountBadge}
</b>
    </div>

    <div>
      <span>Pembayaran</span>
      <b style="font-size:16px; line-height:1.4;">
        ${metodePembayaran}
      </b>
    </div>

  </div>
</div>
`;


      
initFadeUp();
      
console.log("activated_at raw:", activated_at);
console.log("durationDays raw:", durationDays);
 
if (durationDays > 0) {

  const countdownTimer = document.getElementById("countdownTimer");
  const statusText = document.getElementById("statusText");

  // ==========================
  // JIKA BELUM ACTIVE
  // ==========================
if (status.toLowerCase() !== "active") {
  statusText.style.color = "#9ca3af";
    countdownTimer.innerHTML =
      `${durationDays} Hari 00:00:00`;
    return;
}

  // ==========================
  // JIKA SUDAH ACTIVE
  // ==========================

  let activatedDate;

  // HANDLE FORMAT Date(2026,1,26,21,0,0)
  if (typeof activated_at === "string" && activated_at.startsWith("Date(")) {
    const parts = activated_at
      .replace("Date(", "")
      .replace(")", "")
      .split(",")
      .map(Number);

    activatedDate = new Date(
      parts[0],
      parts[1],
      parts[2],
      parts[3] || 0,
      parts[4] || 0,
      parts[5] || 0
    );
  }

  // HANDLE OBJECT DATE (gviz)
  else if (typeof activated_at === "object") {
    activatedDate = new Date(activated_at);
  }

  // HANDLE STRING BIASA
  else {
    activatedDate = new Date(activated_at);

    if (isNaN(activatedDate.getTime())) {
      const [datePart, timePart] = activated_at.split(" ");
      const [day, month, year] = datePart.split("/");

      activatedDate = new Date(
        Number(year),
        Number(month) - 1,
        Number(day),
        ...timePart.split(":").map(Number)
      );
    }
  }

  if (!activatedDate || isNaN(activatedDate.getTime())) {
    console.log("Gagal parse tanggal:", activated_at);
    return;
  }

// Total detik = durationDays * 24 jam
const expiryDate = new Date(activatedDate);
expiryDate.setDate(expiryDate.getDate() + durationDays);

  

async function startCountdown() {

  const serverNow = await getServerTime();
  const clientStartTime = Date.now();

  function updateCountdown() {

    const now = new Date(
      serverNow.getTime() + (Date.now() - clientStartTime)
    );

    const fullDurationMs = durationDays * 24 * 60 * 60 * 1000;
const elapsed = now - activatedDate;
const diff = fullDurationMs - elapsed;

    if (diff <= 0) {

  countdownTimer.innerHTML = "";
  statusText.innerHTML = "Expired";
  statusText.style.color = "#ef4444";

  if (!document.querySelector(".status-badge-expired")) {
    const badge = document.createElement("div");
    badge.className = "status-badge-expired";
    badge.innerText = "EXPIRED";
    statusText.parentNode.appendChild(badge);
  }

  return;
}

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    
    countdownTimer.innerHTML =
      `${days} Hari ${hours.toString().padStart(2,"0")}:${minutes.toString().padStart(2,"0")}:${seconds.toString().padStart(2,"0")}`;

    // PREMIUM BEHAVIOUR COLOR SYSTEM
if (days > 7) {
  statusText.style.color = "#22c55e"; // Hijau
} 
else if (days >= 3) {
  statusText.style.color = "#f97316"; // Orange
} 
else {
  statusText.style.color = "#ef4444"; // Merah (0–2 hari)
}

// ==========================
// MICRO PULSE
// ==========================

countdownTimer.classList.remove("pulse-soft", "pulse-strong");

if (seconds !== 0) {
  countdownTimer.classList.add("pulse-soft");
}

if (seconds === 0) {
  countdownTimer.classList.add("pulse-strong");
}

if (minutes === 0 && seconds === 0) {
  countdownTimer.classList.add("pulse-strong");
}
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
}

startCountdown();

}
      
    } else {

  wrapper.innerHTML = `
    <div style="
      width: 85%;
      max-width: 750px;
      padding: 60px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(18,18,28,0.9), rgba(10,10,18,0.85));
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 120px rgba(0,0,0,0.7);
      text-align:center;
      color:white;
      font-family: 'Plus Jakarta Sans', sans-serif;
    ">

      <h2 style="
        font-family:'Playfair Display', serif;
        font-size:30px;
        margin-bottom:20px;
      ">
        Data Tidak Ditemukan
      </h2>

      <p style="opacity:0.75; margin-bottom:30px;">
        Invoice <strong>${invoice}</strong> tidak ditemukan di sistem kami.
      </p>

      <button onclick="window.location.href='invoice.html'" style="
        padding:12px 26px;
        border-radius:20px;
        border:none;
        cursor:pointer;
        font-weight:600;
        background:linear-gradient(135deg,#9f7aea,#6d28d9);
        box-shadow:0 12px 30px rgba(139,92,246,.5);
        color:white;
      ">
        Kembali ke Cek Invoice
      </button>

    </div>
  `;
}

  } catch (err) {
    console.error("Error ambil warranty_data:", err);
  }
}

fetchWarrantyData();


// =============================
// GLOBAL FADE-UP OBSERVER
// =============================

const fadeObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
      fadeObserver.unobserve(entry.target);
    }
  });
}, {
  threshold: 0.15
});

function initFadeUp() {
  const elements = document.querySelectorAll(".fade-up");

  elements.forEach((el, index) => {
    el.style.transitionDelay = `${index * 100}ms`; // stagger ringan
    fadeObserver.observe(el);
  });
}
</script>
</body>
</html>
