<!DOCTYPE html>
<html>
<head>
<title>Status Pesanan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&
  family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  
<style>
body {
  overflow-x: hidden;
  background: #0b0b0f;
}

html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* HERO UNGU SAMA PERSIS */
.package-hero {
  width: 100%;
  min-height: 260px;
  background: linear-gradient(
    135deg,
    #493d84,
    #6d28d9
  );
  padding: 72px 20px 60px;
  text-align: center;
}

.package-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.package-hero p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.85);
}

/* Wrapper nanti untuk card */
.status-wrapper {
  min-height: 60vh;
  padding: 40px 16px 80px;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== PACKAGE PREVIEW CARD ===== */
.package-preview {
  max-width: 720px;
  margin: 60px auto 24px;
  padding: 18px;

  border-radius: 22px;

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(18px);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.45);

  color: white;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

.package-preview img {
  width: 100%;
  height: clamp(160px, 38vw, 240px);
  max-height: 240px;
  object-fit: cover;
  border-radius: 18px;
  margin-bottom: 12px;
}

.package-preview h3 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 600;
}

.package-preview p {
  margin: 0;
  opacity: 0.75;
  font-size: 14px;
}

.detail-card {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px;
  border-radius: 22px;

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(18px);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.45);

  color: white;
}

.package-preview {
  font-family: 'Manrope', sans-serif;
}

.package-preview h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  letter-spacing: 0.6px;
}

.detail-card {
  font-family: 'Manrope', sans-serif;
}

.detail-card h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  letter-spacing: 0.8px;
}

.package-preview h3,
.detail-card h2 {
  text-shadow: 0 4px 12px rgba(0,0,0,0.35);
}
  
</style>
</head>

<body>

<!-- HERO -->
<div class="package-hero">
  <h1>Status Pesanan</h1>
  <p>Status paket dan detail pesanan</p>
</div>

<section class="status-wrapper">
  <!-- Nanti di sini kita bikin card warranty_data -->
</section>

<script>
// =============================
// AMBIL PARAMETER INVOICE
// =============================
const params = new URLSearchParams(window.location.search);
const invoice = params.get("inv");

if (!invoice) {
  window.location.href = "invoice.html";
}

// =============================
// TAMPILKAN LOADING CARD
// =============================
const wrapper = document.querySelector(".status-wrapper");

wrapper.innerHTML = `
  <div style="
    width: 80%;
    max-width: 800px;
    padding: 50px;
    border-radius: 24px;
    background: rgba(18,18,28,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
    font-family: 'Plus Jakarta Sans', sans-serif;
  ">
    <h2 style="margin-bottom:15px;">Memuat Data...</h2>
    <p style="opacity:0.7;">Invoice:</p>
    <h3 style="margin-top:5px; color:#9f7aea;">${invoice}</h3>
  </div>
`;

// =============================
// KONFIGURASI SHEET WARRANTY_DATA
// =============================
const sheetID = "1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08";
const sheetName = "WARRANTY_DATA";
const sheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

// =============================
// FETCH WARRANTY_DATA
// =============================
async function fetchWarrantyData() {
  try {
    const res = await fetch(sheetURL);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows;

    let matchedData = null;

    rows.forEach(row => {
      if (!row.c) return;

      const invoiceCell = row.c[0]?.v;
      if (String(invoiceCell) === String(invoice)) {
        matchedData = row;
      }
    });

    // =============================
    // KALAU DATA DITEMUKAN
    // =============================
    if (matchedData) {

      wrapper.style.display = "block";

    const headers = json.table.cols.map(col => col.label);

const rowData = {};
headers.forEach((header, index) => {
  rowData[header] = matchedData.c[index]?.v || "";
});

const product_id  = rowData.product_id || "-";
const title       = rowData.title || "-";
const packageName = rowData.package || "-";
const duration    = rowData.duration_days || "-";
const status      = rowData.status || "-";
const image_url   = rowData.image_url || "";

      wrapper.innerHTML = `
  <!-- PACKAGE PREVIEW -->
  <div class="package-preview">
    <img 
  src="${image_url || 'https://dummyimage.com/800x400/111827/ffffff&text=Package'}" 
  alt="${title}"
  onerror="this.src='https://dummyimage.com/800x400/111827/ffffff&text=Package';">
    <h3>${title}</h3>
    <p>${packageName}</p>
  </div>

   <!-- DETAIL CARD -->
  <div class="detail-card">

    <h2 style="
      font-size:32px;
      margin-bottom:30px;
      text-align:center;
    ">
      Detail Pesanan
    </h2>

    <div style="display:grid; gap:18px; font-size:15px;">

      <div><strong>Invoice:</strong> ${invoice}</div>
      <div><strong>Product ID:</strong> ${product_id}</div>
      <div><strong>Title:</strong> ${title}</div>
      <div><strong>Package:</strong> ${packageName}</div>
      <div><strong>Durasi:</strong> ${duration} Hari</div>
      <div>
        <strong>Status:</strong> 
        <span style="
          padding:6px 14px;
          border-radius:20px;
          background:${String(status).toLowerCase() === "active" ? "#16a34a" : "#dc2626"};
          font-size:13px;
        ">
          ${status}
        </span>
      </div>

    </div>
  </div>
`;

    } else {

  wrapper.innerHTML = `
    <div style="
      width: 85%;
      max-width: 750px;
      padding: 60px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(18,18,28,0.9), rgba(10,10,18,0.85));
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 120px rgba(0,0,0,0.7);
      text-align:center;
      color:white;
      font-family: 'Plus Jakarta Sans', sans-serif;
    ">

      <h2 style="
        font-family:'Playfair Display', serif;
        font-size:30px;
        margin-bottom:20px;
      ">
        Data Tidak Ditemukan
      </h2>

      <p style="opacity:0.75; margin-bottom:30px;">
        Invoice <strong>${invoice}</strong> tidak ditemukan di sistem kami.
      </p>

      <button onclick="window.location.href='invoice.html'" style="
        padding:12px 26px;
        border-radius:20px;
        border:none;
        cursor:pointer;
        font-weight:600;
        background:linear-gradient(135deg,#9f7aea,#6d28d9);
        box-shadow:0 12px 30px rgba(139,92,246,.5);
        color:white;
      ">
        Kembali ke Cek Invoice
      </button>

    </div>
  `;
}

  } catch (err) {
    console.error("Error ambil warranty_data:", err);
  }
}

fetchWarrantyData();
</script>
</body>
</html>
