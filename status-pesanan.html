<!DOCTYPE html>
<html>
<head>
<title>Status Pesanan</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  overflow-x: hidden;
  background: #0b0b0f;
}

html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* HERO UNGU SAMA PERSIS */
.package-hero {
  width: 100%;
  min-height: 260px;
  background: linear-gradient(
    135deg,
    #493d84,
    #6d28d9
  );
  padding: 72px 20px 60px;
  text-align: center;
}

.package-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.package-hero p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.85);
}

/* Wrapper nanti untuk card */
.status-wrapper {
  min-height: 60vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="package-hero">
  <h1>Status Pesanan</h1>
  <p>Status paket dan detail pesanan</p>
</div>

<section class="status-wrapper">
  <!-- Nanti di sini kita bikin card warranty_data -->
</section>

<script>
// =============================
// AMBIL PARAMETER INVOICE DARI URL
// =============================
const params = new URLSearchParams(window.location.search);
const invoice = params.get("inv");

// Kalau tidak ada invoice di URL → balik ke invoice page
if (!invoice) {
  window.location.href = "invoice.html";
}

// =============================
// TAMPILKAN INVOICE SEMENTARA
// =============================
const wrapper = document.querySelector(".status-wrapper");

wrapper.innerHTML = `
  <div style="
    width: 80%;
    max-width: 800px;
    padding: 50px;
    border-radius: 24px;
    background: rgba(18,18,28,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
    font-family: 'Plus Jakarta Sans', sans-serif;
  ">
    <h2 style="margin-bottom:15px;">Invoice Ditemukan</h2>
    <p style="opacity:0.7;">Nomor Invoice:</p>
    <h3 style="margin-top:5px; color:#9f7aea;">${invoice}</h3>
    <p style="margin-top:25px; opacity:0.6;">
      Mengambil data status pesanan...
    </p>
  </div>
`;
</script>
</body>
</html>
