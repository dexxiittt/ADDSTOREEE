<!DOCTYPE html>
<html>
<head>
<title>Status Pesanan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&
  family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  
<style>
body {
  overflow-x: hidden;
  background: #0b0b0f;
}

html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* HERO UNGU SAMA PERSIS */
.package-hero {
  width: 100%;
  min-height: 260px;
  background: linear-gradient(
    135deg,
    #493d84,
    #6d28d9
  );
  padding: 72px 20px 60px;
  text-align: center;

  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.package-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.package-hero p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.85);
}

/* Wrapper nanti untuk card */
.status-wrapper {
  width: 100%;
  padding: 0 0 80px;
}

/* ===== PACKAGE PREVIEW CARD ===== */
.package-preview {
  width: 100%;
  margin: 13px 0 0;   /* turun 10px + ada jarak kiri kanan */
  padding: 28px 20px 32px;

  position: relative;
  z-index: 2;

  border-radius: 22px;    /* aktifkan radius */

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(18px);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.55);

  color: white;
}

.package-preview img {
  width: 100%;
  height: clamp(180px, 42vw, 300px);
  object-fit: cover;
  border-radius: 16px;
  margin-bottom: 16px;
}

.package-preview h3 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 600;
}

.package-preview p {
  margin: 0;
  opacity: 0.75;
  font-size: 14px;
}

.package-preview {
  font-family: 'Manrope', sans-serif;
}

.package-preview h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  letter-spacing: 0.6px;
}

.detail-card {
  font-family: 'Manrope', sans-serif;
}

.detail-card h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  letter-spacing: 0.8px;
}

.package-preview h3,
.detail-card h2 {
  text-shadow: 0 4px 12px rgba(0,0,0,0.35);
}

  /* GLASS META CARD */

.status-meta-card {
  width: 100%;
  margin: 18px 0 0;
  padding: 22px;

  border-radius: 22px;

  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(18px);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.45);

  color: white;
  font-family: 'Manrope', sans-serif;
}

.status-meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  text-align: center;
}

.status-meta-grid span {
  display: block;
  font-size: 12px;
  opacity: .6;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.status-meta-grid b {
  font-size: 16px;
  font-weight: 700;
}


@media (min-width: 1200px) {
  .package-preview {
    padding-left: 10%;
    padding-right: 10%;
  }
}
  
</style>
</head>

<body>

<!-- HERO -->
<div class="package-hero">
  <h1>Status Pesanan</h1>
  <p>Status paket dan detail pesanan</p>
</div>

<section class="status-wrapper">
  <!-- Nanti di sini kita bikin card warranty_data -->
</section>

<script>
// =============================
// AMBIL PARAMETER INVOICE
// =============================
const params = new URLSearchParams(window.location.search);
const invoice = params.get("inv");

if (!invoice) {
  window.location.href = "invoice.html";
}

// =============================
// TAMPILKAN LOADING CARD
// =============================
const wrapper = document.querySelector(".status-wrapper");

wrapper.innerHTML = `
  <div style="
    width: 100%;
    padding: 120px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius: 24px;
    background: rgba(18,18,28,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
    font-family: 'Plus Jakarta Sans', sans-serif;
  ">
    <h2 style="margin-bottom:15px;">Memuat Data...</h2>
    <p style="opacity:0.7;">Invoice:</p>
    <h3 style="margin-top:5px; color:#9f7aea;">${invoice}</h3>
  </div>
`;

  // =============================
// SERVER API
// =============================
const API_URL = "https://script.google.com/macros/s/AKfycbw7QYEmqPhFBH3OComEm1HtGnNui-JepaoTRKtNWOpAWSgFq1ZekzMfuAuJBCpJ_W7s/exec";

async function loadData() {

  const res = await fetch(`${API_URL}?invoice=${invoice}`);
  const data = await res.json();

  if (!data || data.error) {
    wrapper.innerHTML = "Data tidak ditemukan";
    return;
  }

  const durationDays = data.duration_days;
  const status = data.status;

  wrapper.innerHTML = `
    <div class="status-meta-card">
      <div class="status-meta-grid">
        <div>
          <span>Durasi</span>
          <b>${durationDays}</b>
        </div>
        <div>
          <span>Status</span>
          <b id="statusText">${status}</b>
          <div id="countdownTimer"></div>
        </div>
      </div>
    </div>
  `;

  const countdownTimer = document.getElementById("countdownTimer");
  const statusText = document.getElementById("statusText");

  let remaining = data.remaining_ms;

  // BELUM ACTIVE
  if (status.toLowerCase() !== "active") {
    countdownTimer.innerHTML =
      `${durationDays} Hari 00:00:00`;
    statusText.style.color = "#9ca3af";
    return;
  }

  function update() {

    if (remaining <= 0) {
      countdownTimer.innerHTML = "Expired";
      statusText.innerHTML = "expired";
      statusText.style.color = "#ef4444";
      return;
    }

    const days = Math.floor(remaining / 86400000);
    const hours = Math.floor((remaining % 86400000) / 3600000);
    const minutes = Math.floor((remaining % 3600000) / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);

    countdownTimer.innerHTML =
      `${days} Hari ${hours.toString().padStart(2,"0")}:${minutes.toString().padStart(2,"0")}:${seconds.toString().padStart(2,"0")}`;

    remaining -= 1000;
  }

  update();
  setInterval(update, 1000);
}

loadData();

  } catch (err) {
    console.error("Error ambil warranty_data:", err);
  }
}

</script>
</body>
</html>
