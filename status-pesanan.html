<!DOCTYPE html>
<html>
<head>
<title>Status Pesanan</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&
  family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  
<style>
body {
  overflow-x: hidden;
  background: #0b0b0f;
}

html, body {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* HERO UNGU SAMA PERSIS */
.package-hero{
  width:100%;
  min-height:260px;
  background:linear-gradient(135deg,#493d84,#6d28d9);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
  padding:20px;
}

.package-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 96px);
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 14px;
  color: #ffffff;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.package-hero p {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.85);
}

/* Wrapper nanti untuk card */
.status-wrapper {
  width: 100%;
  padding: 0 0 80px;
}

/* ============================= */
/* LIGHTWEIGHT CARD SYSTEM */
/* ============================= */

.package-preview,
.status-meta-card{

  width:100%;
  margin:13px 0 0;
  padding:26px 20px 28px;

  border-radius:18px;

  background:#16161f;

  border:1px solid rgba(255,255,255,0.05);

  color:white;

  font-family:'Manrope',sans-serif;

}

/* IMAGE */

.package-preview img{
  width:100%;
  height:clamp(180px,42vw,300px);
  object-fit:cover;
  border-radius:14px;
  margin-bottom:16px;
}

/* TITLE */

.package-preview h3{
  margin:0 0 6px;
  font-size:22px;
  font-weight:600;
}

.package-preview p{
  margin:0;
  opacity:.75;
  font-size:14px;
}

/* ============================= */
/* META GRID */
/* ============================= */

.status-meta-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  text-align:center;
}

.status-meta-grid span{
  display:block;
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:4px;
  text-transform:uppercase;
  color:#ffffff;
}

.status-meta-grid b{
  font-size:20px;
  font-weight:700;
}

/* Invoice */

.status-meta-grid div:nth-child(1) b{
  font-size:24px;
  letter-spacing:1px;
}

/* Durasi */

.status-meta-grid div:nth-child(2) b{
  font-size:22px;
}

/* ============================= */
/* STATUS BADGE */
/* ============================= */

.status-badge-expired{

  display:inline-block;
  margin-top:12px;
  padding:8px 26px;

  font-size:12px;
  font-weight:600;

  border-radius:999px;

  background:#2b0d0d;

  color:#ff4d4f;

  border:1px solid rgba(255,80,80,0.35);

  text-transform:uppercase;

}

/* ============================= */
/* FADE UP SYSTEM */
/* ============================= */

.fade-up{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .5s ease, transform .5s ease;
}

.fade-up.show{
  opacity:1;
  transform:translateY(0);
}

/* ============================= */
/* COLLAPSIBLE INFO */
/* ============================= */

.info-toggle{
  cursor:pointer;
  user-select:none;
  display:flex;
  flex-direction:column;
  gap:6px;
  font-weight:600;
  font-size:15px;
}

.info-header{
  display:flex;
  align-items:center;
  gap:8px;
}

.info-icon{
  color:#ffffff;
  font-size:16px;
  font-weight:700;
}

.info-icon.active{
  color:#9f7aea;
}

.info-more,
.info-close{
  color:#9f7aea;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}

.info-content{
  overflow:hidden;
  max-height:0;
  transition:max-height .3s ease;
}

.info-content.open{
  max-height:600px;
}

/* NOTE LIST */

.info-content ul{
  margin:12px 0 14px;
  padding:0;
  list-style:none;
  font-size:14px;
  line-height:1.55;
}

.info-content ul li{
  position:relative;
  padding-left:18px;
  margin-bottom:4px;
}

.info-content ul li::before{
  content:"•";
  position:absolute;
  left:0;
  top:2px;
  font-size:12px;
  color:#9f7aea;
}


/* ============================= */
/* MOBILE */
/* ============================= */

@media (max-width:768px){

.status-meta-grid{
  grid-template-columns:1fr;
  gap:14px;
}
}
  
/* Lebih halus di device cepat */
@media (prefers-reduced-motion: reduce) {
  .fade-up {
    transition: none;
    transform: none;
    opacity: 1;
  }
}

@media (min-width: 1200px) {
  .package-preview {
    padding-left: 10%;
    padding-right: 10%;
  }
}

*{
  backface-visibility: hidden;
  transform: translateZ(0);
}

</style>
</head>
<div id="navbar-placeholder"></div>

<script>
fetch("navbar.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar-placeholder").innerHTML = data;

    const navbar = document.querySelector(".main-navbar");
    const toggle = document.getElementById("navToggle");
    const dropdown = document.getElementById("navDropdown");

    // TOGGLE
    toggle.addEventListener("click", function (e) {
  e.stopPropagation();
  dropdown.classList.toggle("open");
  toggle.classList.toggle("active"); // ← TAMBAHAN INI
});

    document.addEventListener("click", function (e) {
  if (!dropdown.contains(e.target) && !toggle.contains(e.target)) {
    dropdown.classList.remove("open");
    toggle.classList.remove("active"); // ← TAMBAHAN INI
  }
});

   // ===== ACTIVE LINK AUTO DETECT =====
const currentPage = window.location.pathname.split("/").pop() || "index.html";

document.querySelectorAll(".nav-dropdown a").forEach(link => {
  const linkPage = link.getAttribute("href");

  if (linkPage === currentPage) {
    link.classList.add("active");
  }
});

    // SCROLL EFFECT
    window.addEventListener("scroll", function () {
      navbar.classList.toggle("scrolled", window.scrollY > 30);
    });
  });
</script>


<body>

<!-- HERO -->
<div class="package-hero">
  <h1>Status Pesanan</h1>
  <p>Status paket dan detail pesanan</p>
</div>

<section class="status-wrapper">
  <!-- Nanti di sini kita bikin card warranty_data -->
</section>

<script>
// =============================
// AMBIL PARAMETER INVOICE
// =============================
const params = new URLSearchParams(window.location.search);
const invoice = params.get("inv");

if (!invoice) {
  window.location.href = "invoice.html";
}

// =============================
// TAMPILKAN LOADING CARD
// =============================
const wrapper = document.querySelector(".status-wrapper");

wrapper.innerHTML = `
  <div style="
    width: 100%;
    padding: 120px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius: 24px;
    background: rgba(18,18,28,0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    text-align:center;
    color:white;
    font-family: 'Plus Jakarta Sans', sans-serif;
  ">
    <h2 id="loadingText" style="margin-bottom:10px;">
  Memuat Data...
</h2>

<div id="loadingTimer" style="
  font-size:22px;
  font-weight:700;
  margin-bottom:10px;
  color:#9f7aea;
">
  10:00
</div>

<p style="opacity:0.8; margin-bottom:6px;">
  Invoice sedang dibuat, mohon tunggu
</p>

<p style="opacity:0.6;">Invoice:</p>
<h3 style="margin-top:5px; color:#9f7aea;">${invoice}</h3>
  </div>
`;

// =============================
// SERVER TIME API
// =============================
const timeAPI = "https://script.google.com/macros/s/AKfycbx7vo05kZaGjn1VuI9J7XZjwenytoySEF4AjbhtRvEXrFYzkE9AkFQpuISMco3pAyo2/exec";

async function getServerTime() {
  const res = await fetch(timeAPI);
  const data = await res.json();
  return new Date(data.serverTime);
}
  
// =============================
// KONFIGURASI SHEET WARRANTY_DATA
// =============================
const sheetID = "1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08";
const sheetName = "WARRANTY_DATA";
const sheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

// =============================
// FETCH WARRANTY_DATA
// =============================
async function fetchWarrantyData() {
  try {
    const res = await fetch(sheetURL);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows;

    let matchedData = null;

    rows.forEach(row => {
      if (!row.c) return;

      const invoiceCell = row.c[0]?.v;
      if (String(invoiceCell) === String(invoice)) {
        matchedData = row;
      }
    });

    // =============================
    // KALAU DATA DITEMUKAN
    // =============================
    if (matchedData) {

      wrapper.style.display = "block";

    const headers = json.table.cols.map(col => col.label.trim());

const rowData = {};
headers.forEach((header, index) => {
  rowData[header.trim()] = matchedData.c[index]?.v ?? "";
});

const product_id  = rowData.product_id || "-";
const title       = rowData.title || "-";
const packageName = rowData.package || "-";
const notesRaw = rowData.notes || "";

let informasiList = [];

if (notesRaw && notesRaw.includes("|")) {
  informasiList = notesRaw
    .split("|")
    .map(item => item.trim())
    .filter(item => item.length > 0);
} else if (notesRaw) {
  informasiList = [notesRaw.trim()];
} else {
  informasiList = [
    "Garansi berlaku sesuai durasi dan tanggal aktivasi yang tercatat di sistem.",
    "Timer merupakan indikator masa layanan dari penjual.",
    "Garansi tidak dapat diperpanjang sebelum masa aktif sebelumnya berakhir."
  ];
}

// =============================
// FORMAT HARGA (SAMA SEPERTI PACKAGE)
// =============================

function parseDiscount(val) {
  if (!val) return 0;

  // kalau sudah angka kecil (misal 0.2223)
  if (typeof val === "number") {
    return val < 1 ? val * 100 : val;
  }

  const clean = String(val)
    .replace('%', '')
    .replace(',', '.')
    .trim();

  const num = Number(clean) || 0;

  return num < 1 ? num * 100 : num;
}

const price = Number(rowData.price) || 0;
const discount = parseDiscount(rowData.discount);

const finalPrice = discount > 0
  ? Math.round(price - (price * discount / 100))
  : price;

let hargaHTML;

if (discount > 0) {
  hargaHTML = `
    <div style="display:flex; align-items:center; justify-content:center; gap:8px;">

      <span style="
        font-size:14px;
        text-decoration:line-through;
        color:#ffffff;
        opacity:0.6;
      ">
        Rp${price.toLocaleString("id-ID")}
      </span>

      <span style="
        font-weight:900;
        font-size:22px;
        color:#ffffff;
      ">
        Rp${finalPrice.toLocaleString("id-ID")}
      </span>

      <span style="
        padding:4px 10px;
        font-size:12px;
        font-weight:700;
        border-radius:999px;
        background:#22c55e;
        color:#ffffff;
        white-space:nowrap;
      ">
        -${discount.toFixed(2).replace('.', ',')}%
      </span>

    </div>
  `;
} else {
  hargaHTML = `
    <span style="
      font-weight:900;
      font-size:22px;
      color:#ffffff;
    ">
      Rp${price.toLocaleString("id-ID")}
    </span>
  `;
}


      
const durationDays = parseInt(rowData.duration_days) || 0;

// =============================
// GENERATE INFORMASI HTML
// =============================

const informasiHTML = informasiList
  .map(item => `<li>${item}</li>`)
  .join("");

// =============================
// VALID UNTIL SYSTEM (PREMIUM VERSION)
// =============================

let berlakuSampai = "-";

const validUntilRaw = rowData.valid_until;

if (validUntilRaw) {

  const serverNow = await getServerTime();

  // Jika isinya angka (misal 30)
  if (!isNaN(parseInt(validUntilRaw))) {

    const daysToAdd = parseInt(validUntilRaw);
    const expDate = new Date(serverNow);
    expDate.setDate(expDate.getDate() + daysToAdd);

    berlakuSampai = expDate.toLocaleDateString("id-ID", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  }

  // Jika isinya tanggal langsung
  else {

    const parsedDate = new Date(validUntilRaw);

    if (!isNaN(parsedDate.getTime())) {
      berlakuSampai = parsedDate.toLocaleDateString("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

  }
}
      
const status = rowData.status || "-";
const image_url = rowData.image_url || "";

const activated_at = rowData[headers.find(h =>
  h.toLowerCase().includes("activated")
)] || "";

const metodePembayaran = `
  Lynk ID Verified
  <div style="opacity:.6; font-size:12px; margin-top:4px;">
    Checkout diproses oleh Lynk ID
  </div>
`;


if (durationDays >= 30) {

  const months = Math.floor(durationDays / 30);
  const remainingDays = durationDays % 30;

  if (remainingDays === 0) {
    durationDisplay = `${months} Bulan`;
  } else {
    durationDisplay = `${months} Bulan (${remainingDays} Hari)`;
  }

} else if (durationDays > 0) {

  durationDisplay = `${durationDays} Hari`;

}
      

console.log("activated_at:", activated_at);
console.log("durationDays:", durationDays);

      wrapper.innerHTML = `
  <!-- CARD 1 -->
  <div class="package-preview fade-up">

    <img 
      src="${image_url || 'https://dummyimage.com/800x400/111827/ffffff&text=Package'}" 
      alt="${title}"
      onerror="this.src='https://dummyimage.com/800x400/111827/ffffff&text=Package';">

    <h2 style="
      font-family:'Cormorant Garamond', serif;
      font-size:30px;
      margin:20px 0 10px;
      text-align:center;
    ">
      Detail Pesanan
    </h2>

    <h3>${title}</h3>
    <p style="margin-bottom:20px;">${packageName}</p>

  </div>

  <!-- CARD 2 (GLASS META) -->
<div class="status-meta-card fade-up">
  <div class="status-meta-grid">

    <div>
      <span>Invoice</span>
      <b>${invoice}</b>
    </div>

    <div>
      <span>Durasi</span>
      <b>${durationDisplay}</b>
    </div>

    <div>
      <span>Status</span>
      <b id="statusText">
        ${status}
      </b>
      <div id="countdownBox" style="margin-top:6px; font-size:13px; opacity:.8;">
  Garansi Tersisa
  <div id="countdownTimer" style="font-weight:600; margin-top:3px;"></div>
  
</div>
</div>

  </div>
</div>

<!-- CARD 3 (GLASS DETAIL TAMBAHAN) -->
<div class="status-meta-card fade-up">
  <div class="status-meta-grid">

    <div>
      <span>Berlaku Sampai</span>
      <b>${berlakuSampai}</b>
    </div>

    <div>
      <span>Harga</span>
<b>${hargaHTML}</b>
    </div>

    <div>
      <span>Pembayaran</span>
      <b style="font-size:16px; line-height:1.4;">
        ${metodePembayaran}
      </b>
    </div>

  </div>
</div>

<!-- CARD 4 (INFORMASI PENTING) -->
<div class="status-meta-card fade-up">

  <div class="info-header" style="margin-bottom:6px;">
    <span id="infoIcon" class="info-icon">ⓘ</span>
    <span>Informasi Penting</span>
  </div>

  <div id="infoMore" class="info-more">
    Selengkapnya...
  </div>

  <div id="infoContent" class="info-content">
    <ul>
      ${informasiHTML}
    </ul>

    <div id="infoClose" class="info-close" style="display:none;">
      Tutup
    </div>
  </div>

</div>
`;


      
// =============================
// CLEAN COLLAPSIBLE SYSTEM
// =============================

const infoIcon = document.getElementById("infoIcon");
const infoContent = document.getElementById("infoContent");
const infoMore = document.getElementById("infoMore");
const infoClose = document.getElementById("infoClose");

if (infoMore) {
  infoMore.addEventListener("click", () => {

    infoContent.classList.add("open");
    infoIcon.classList.add("active");

    infoMore.style.display = "none";
    infoClose.style.display = "block";

    // =============================
    // STAGGER NOTE ANIMATION
    // =============================
    const notes = infoContent.querySelectorAll("li");

    notes.forEach((note, index) => {
      note.classList.remove("show");
      setTimeout(() => {
        note.classList.add("show");
      }, index * 120); // delay ringan per item
    });

  });
}

if (infoClose) {
  infoClose.addEventListener("click", () => {

    infoContent.classList.remove("open");
    infoIcon.classList.remove("active");

    infoClose.style.display = "none";
    infoMore.style.display = "block";

  });
}

      
initFadeUp();
      
console.log("activated_at raw:", activated_at);
console.log("durationDays raw:", durationDays);
 
if (durationDays > 0) {

  const countdownTimer = document.getElementById("countdownTimer");
  const statusText = document.getElementById("statusText");

  // ==========================
  // JIKA BELUM ACTIVE
  // ==========================
if (status.toLowerCase() !== "active") {
  statusText.style.color = "#9ca3af";
    countdownTimer.innerHTML =
      `${durationDays} Hari 00:00:00`;
    return;
}

  // ==========================
  // JIKA SUDAH ACTIVE
  // ==========================

  let activatedDate;

  // HANDLE FORMAT Date(2026,1,26,21,0,0)
  if (typeof activated_at === "string" && activated_at.startsWith("Date(")) {
    const parts = activated_at
      .replace("Date(", "")
      .replace(")", "")
      .split(",")
      .map(Number);

    activatedDate = new Date(
      parts[0],
      parts[1],
      parts[2],
      parts[3] || 0,
      parts[4] || 0,
      parts[5] || 0
    );
  }

  // HANDLE OBJECT DATE (gviz)
  else if (typeof activated_at === "object") {
    activatedDate = new Date(activated_at);
  }

  // HANDLE STRING BIASA
  else {
    activatedDate = new Date(activated_at);

    if (isNaN(activatedDate.getTime())) {
      const [datePart, timePart] = activated_at.split(" ");
      const [day, month, year] = datePart.split("/");

      activatedDate = new Date(
        Number(year),
        Number(month) - 1,
        Number(day),
        ...timePart.split(":").map(Number)
      );
    }
  }

  if (!activatedDate || isNaN(activatedDate.getTime())) {
    console.log("Gagal parse tanggal:", activated_at);
    return;
  }

// Total detik = durationDays * 24 jam
const expiryDate = new Date(activatedDate);
expiryDate.setDate(expiryDate.getDate() + durationDays);

  

async function startCountdown() {

  const serverNow = await getServerTime();
  const clientStartTime = Date.now();

  function updateCountdown() {

    const now = new Date(
      serverNow.getTime() + (Date.now() - clientStartTime)
    );

const fullDurationMs = durationDays * 24 * 60 * 60 * 1000;
const elapsed = now - activatedDate;
const diff = fullDurationMs - elapsed;

    if (diff <= 0) {

  countdownTimer.innerHTML = "";
  statusText.innerHTML = "Expired";
  statusText.style.color = "#ef4444";

  if (!document.querySelector(".status-badge-expired")) {
    const badge = document.createElement("div");
    badge.className = "status-badge-expired";
    badge.innerText = "EXPIRED";
    statusText.parentNode.appendChild(badge);
  }

  return;
}

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    
    countdownTimer.innerHTML =
      `${days} Hari ${hours.toString().padStart(2,"0")}:${minutes.toString().padStart(2,"0")}:${seconds.toString().padStart(2,"0")}`;

    // PREMIUM BEHAVIOUR COLOR SYSTEM
if (days > 7) {
  statusText.style.color = "#22c55e"; // Hijau
} 
else if (days >= 3) {
  statusText.style.color = "#f97316"; // Orange
} 
else {
  statusText.style.color = "#ef4444"; // Merah (0–2 hari)
}

// ==========================
// MICRO PULSE
// ==========================

countdownTimer.classList.remove("pulse-soft", "pulse-strong");

if (seconds !== 0) {
  countdownTimer.classList.add("pulse-soft");
}

if (seconds === 0) {
  countdownTimer.classList.add("pulse-strong");
}

if (minutes === 0 && seconds === 0) {
  countdownTimer.classList.add("pulse-strong");
}
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
}

startCountdown();

}
      
    } else {

  wrapper.innerHTML = `
    <div style="
      width: 85%;
      max-width: 750px;
      padding: 60px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(18,18,28,0.9), rgba(10,10,18,0.85));
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 120px rgba(0,0,0,0.7);
      text-align:center;
      color:white;
      font-family: 'Plus Jakarta Sans', sans-serif;
    ">

      <h2 style="
        font-family:'Playfair Display', serif;
        font-size:30px;
        margin-bottom:20px;
      ">
        Data Tidak Ditemukan
      </h2>

      <p style="opacity:0.75; margin-bottom:30px;">
        Invoice <strong>${invoice}</strong> tidak ditemukan di sistem kami.
      </p>

      <button onclick="window.location.href='invoice.html'" style="
        padding:12px 26px;
        border-radius:20px;
        border:none;
        cursor:pointer;
        font-weight:600;
        background:linear-gradient(135deg,#9f7aea,#6d28d9);
        box-shadow:0 12px 30px rgba(139,92,246,.5);
        color:white;
      ">
        Kembali ke Cek Invoice
      </button>

    </div>
  `;
}

  } catch (err) {
    console.error("Error ambil warranty_data:", err);
  }
}

// =============================
// 10 MENIT WAIT SYSTEM (FINAL FIX)
// =============================

const WAIT_DURATION = 1 * 60 * 1000;
const storageKey = "invoice_wait_" + invoice;

const storedValue = localStorage.getItem(storageKey);

if (storedValue === "DONE") {

  // Sembunyikan timer & teks loading
  const timerEl = document.getElementById("loadingTimer");
  const waitText = timerEl?.nextElementSibling;

  if (timerEl) timerEl.style.display = "none";
  if (waitText) waitText.style.display = "none";

  // Langsung ambil status
  fetchWarrantyData();

} else {

  let startTime;

  if (!storedValue) {
    startTime = Date.now();
    localStorage.setItem(storageKey, startTime);
  } else {
    startTime = parseInt(storedValue);
  }

  startWaitingTimer(startTime);
}

function startWaitingTimer(startTime) {

  const timerEl = document.getElementById("loadingTimer");
  const waitText = timerEl?.nextElementSibling;

  function update() {

    const elapsed = Date.now() - startTime;
    const remaining = WAIT_DURATION - elapsed;

    if (remaining <= 0) {

      // Tandai selesai permanen
      localStorage.setItem(storageKey, "DONE");

      // Sembunyikan timer & teks
      if (timerEl) timerEl.style.display = "none";
      if (waitText) waitText.style.display = "none";

      // Ambil status pesanan
      fetchWarrantyData();
      return;
    }

    const minutes = Math.floor(remaining / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);

    if (timerEl) {
      timerEl.innerHTML =
        `${minutes.toString().padStart(2,"0")}:${seconds.toString().padStart(2,"0")}`;
    }
  }

  update();
  setInterval(update, 1000);
}

// =============================
// LOADING DOT ANIMATION
// =============================

const loadingText = document.getElementById("loadingText");

if (loadingText) {

  let dotCount = 0;

  setInterval(() => {
    dotCount = (dotCount + 1) % 4; // 0–3

    let dots = ".".repeat(dotCount);

    loadingText.innerHTML = "Memuat Data" + dots;

  }, 500);

}

// =============================
// GLOBAL FADE-UP OBSERVER
// =============================

const fadeObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
      fadeObserver.unobserve(entry.target);
    }
  });
}, {
  threshold: 0.15
});

function initFadeUp() {
  const elements = document.querySelectorAll(".fade-up");

  elements.forEach((el, index) => {
    el.style.transitionDelay = `${index * 100}ms`; // stagger ringan
    fadeObserver.observe(el);
  });
}
</script>
