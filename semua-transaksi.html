<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semua transaksaksi</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<link
rel="stylesheet"
href="components/semua-transaksi/semua-transaksi.css">
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>


<section class="package-hero">
  <div class="package-hero-content">
    <h1>Semua Transaksi</h1>
    <p>Semua riwayat pembelian Anda</p>
  </div>
</section>

<template id="emptyTemplate">

<p class="transaksi-message">
Belum ada transaksi.
</p>

</template>

<template id="notFoundTemplate">

<p class="transaksi-message">
Nomor tidak ditemukan.
</p>

</template>
  
<template id="statusTemplate">
<div class="status-row">

<span class="status-item-1">
<i class="status-icon-1"></i>
<span class="status-text-1"></span>
</span>

<span class="status-item-2">
<i class="status-icon-2"></i>
<span class="status-text-2"></span>
</span>

</div>
</template>

<template id="metaTemplate">

<div class="meta">

<div class="meta-item">

<div class="meta-icon">
<i class="fa-solid fa-cube"></i>
</div>

<div>

<span class="meta-label">
Produk
</span>

<span class="meta-title"></span>

</div>

</div>

<div class="meta-item">

<div class="meta-icon">
<i class="fa-solid fa-box-open"></i>
</div>

<div>
<span class="meta-label">
Paket
</span>

<span class="meta-package"></span>
  
</div>

</div>

<div class="meta-item">

<div class="meta-icon">
<i class="fa-solid fa-calendar-days"></i>
</div>

<div>

<span class="meta-label">
Aktivasi Paket
</span>

<span class="meta-activated"></span>

</div>

</div>

<div class="meta-item">

<div class="meta-icon">
<i class="fa-solid fa-calendar-check"></i>
</div>

<div>

<span class="meta-label">
Paket Berakhir
</span>

<span class="meta-package-expired"></span>

</div>

</div>

<div class="meta-item">

<div class="meta-icon">
<i class="fa-solid fa-hourglass-end"></i>
</div>

<div>

<span class="meta-label">
Garansi Berakhir
</span>

<span class="meta-expired"></span>

</div>

</div>

</div>

</template>

<template id="noteTemplate">
<div class="note">
<div class="note-content"></div>

</div>
</template>

<template id="noteActiveTemplate">

<span class="note-icon">
<i class="fa-solid fa-circle-check"></i>
</span>

Paket dan Garansi telah aktif.<br>
Layanan dalam cakupan garansi.

</template>

<template id="noteWarrantyExpiredTemplate">

<span class="note-icon">
<i class="fa-solid fa-circle-info"></i>
</span>

<span class="note-green">
Paket Aktif
</span>

<span class="note-purple">
namun
</span>

<span class="note-red">
Garansi telah berakhir.
</span>

<br>

<span class="note-purple">
Layanan tidak lagi termasuk dalam cakupan garansi.
</span>

<br>

<span class="note-purple">
Jika ingin melanjutkan layanan hubungi admin untuk pembelian ulang.
</span>

</template>

<template id="noteExpiredTemplate">

<span class="note-icon">
<i class="fa-solid fa-circle-exclamation"></i>
</span>

Paket dan Garansi telah berakhir.<br>
Layanan tidak lagi termasuk dalam cakupan garansi.<br>
Jika ingin melanjutkan layanan hubungi admin untuk pembelian ulang.

</template>

<template id="buttonTemplate">

<div class="button-group">

<a class="btn btn-detail">
Detail Paket
</a>

<a
class="btn btn-wa"
href="https://wa.me/6281234567890">

Hubungi Admin

</a>

</div>

</template>

<template id="cardTemplate">

<div class="transaksi-card">

<img
class="card-image"
src=""
alt="">

<div class="card-invoice"></div>
  
<h3 class="card-title"></h3>

<div class="card-status"></div>
<div class="card-meta"></div>
<div class="card-note"></div>
<div class="card-button"></div>

</div>

</template>

<div class="transaksi-wrapper" id="wrapper">
    <p class="transaksi-message">
        Memuat data...
    </p>
</div>

<script>


</script>
  
<script src="components/semua-transaksi/semua-transaksi.js?v=5"></script>
  
<div id="footer-container"></div>

<link rel="stylesheet" href="components/footer.css">
<script src="components/footer.js"></script>
</body>
</html>
