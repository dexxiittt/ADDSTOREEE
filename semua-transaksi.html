<!DOCTYPE html>
<html>
<head>
<title>Semua Transaksi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0b0b0f;
  font-family:'Plus Jakarta Sans',sans-serif;
  color:white;
}

/* HERO */
.package-hero{
  width:100%;
  min-height:260px;
  background:linear-gradient(135deg,#493d84,#6d28d9);
  padding:72px 20px 60px;
  text-align:center;
}

.package-hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(42px,6vw,80px);
  margin:0 0 14px;
}

.package-hero p{
  opacity:.85;
}

/* WRAPPER */
.transaksi-wrapper{
  max-width:880px;
  margin:-60px auto 80px;
  padding:0 20px;
}

/* CLEAN GLASS CARD */
.transaksi-card{
  background:linear-gradient(
    180deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.04)
  );
  backdrop-filter:blur(18px);
  border-radius:24px;
  padding:26px;
  margin-bottom:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}

/* IMAGE */
.transaksi-card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:18px;
}

/* TITLE */
.transaksi-card h3{
  font-family:'Playfair Display',serif;
  font-size:26px;
  margin:0 0 18px;
}

/* STATUS */
.status-row{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:16px;
  font-weight:600;
}

.status-active{ color:#22c55e; }
.status-expired{ color:#ef4444; }

/* DETAIL TEXT */
.meta{
  font-size:14px;
  line-height:1.6;
  opacity:.85;
  margin-bottom:16px;
}

.note{
  font-size:14px;
  margin:14px 0 18px;
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  opacity:.85;
}

/* BUTTONS */
.button-group{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  min-width:160px;
  text-align:center;
  padding:12px 18px;
  border-radius:14px;
  font-weight:600;
  text-decoration:none;
  transition:.25s;
}

.btn-detail{
  background:#6d28d9;
  color:white;
}

.btn-detail:hover{
  background:#7c3aed;
}

.btn-wa{
  background:#16a34a;
  color:white;
}

.btn-wa:hover{
  background:#15803d;
}
</style>
</head>

<body>

<div id="navbar-placeholder"></div>

<script>
fetch("navbar.html")
.then(res=>res.text())
.then(data=>{
document.getElementById("navbar-placeholder").innerHTML=data;
});
</script>

<div class="package-hero">
  <h1>Semua Transaksi</h1>
  <p>Semua riwayat pembelian Anda</p>
</div>

<div class="transaksi-wrapper" id="wrapper">
  <p style="text-align:center;opacity:.6;">Memuat data...</p>
</div>

<script>

/* ============================= */
/* CONFIG SHEET */
/* ============================= */

const sheetID="1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08";
const sheetName="WARRANTY_DATA";
const sheetURL=`https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

const params=new URLSearchParams(window.location.search);
const buyer=params.get("buyer");

if(!buyer){
  document.getElementById("wrapper").innerHTML=
  `<p style="text-align:center;opacity:.6;">Nomor tidak ditemukan.</p>`;
}

/* ============================= */
/* FETCH DATA */
/* ============================= */

fetch(sheetURL)
.then(res=>res.text())
.then(text=>{
const json=JSON.parse(text.substr(47).slice(0,-2));
const rows=json.table.rows;
const headers=json.table.cols.map(c=>c.label);

let result=[];

rows.forEach(row=>{
if(!row.c)return;

let rowData={};
headers.forEach((h,i)=>{
rowData[h]=row.c[i]?.v ?? "";
});

function normalizeNumber(num) {
  num = String(num).replace(/\D/g, "");
  if (num.startsWith("62")) num = num.substring(2);
  if (num.startsWith("0")) num = num.substring(1);
  return num;
}

if(normalizeNumber(rowData.buyer_contact) === normalizeNumber(buyer)){
result.push(rowData);
}
});

render(result);
});

function render(data){

const wrapper=document.getElementById("wrapper");

if(data.length===0){
wrapper.innerHTML=
`<p style="text-align:center;opacity:.6;">Belum ada transaksi.</p>`;
return;
}

wrapper.innerHTML="";

data.forEach(item=>{

const now=new Date();
  
const activatedDate = new Date(item.activated_at);
const endDate = new Date(activatedDate);
endDate.setDate(activatedDate.getDate() + Number(item.valid_until));
  
const isActive=endDate>now;

const statusPaket=isActive?
`<span class="status-active">🟢 Paket Aktif</span>`:
`<span class="status-expired">🔴 Paket Berakhir</span>`;

const statusGaransi=isActive?
`<span class="status-active">🟢 Garansi Aktif</span>`:
`<span class="status-expired">🔴 Garansi Berakhir</span>`;

const activated=new Date(item.activated_at).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
const expired=endDate.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});

wrapper.innerHTML+=`

<div class="transaksi-card">

<img src="${item.image_url}" alt="">

<h3>${item.title}</h3>

<div class="status-row">
${statusPaket}
${statusGaransi}
</div>

<div class="meta">
Produk: ${item.title}<br>
Paket: ${item.package}<br>
Aktivasi: ${activated}<br>
Berakhir: ${expired}
</div>

<div class="note">
${item.notes || "Masa garansi telah berakhir. Jika ingin melanjutkan layanan hubungi admin untuk pembelian ulang."}
</div>

<div class="button-group">
<a href="status-pesanan.html?inv=${item.invoice}" class="btn btn-detail">Detail Paket</a>
<a href="https://wa.me/6281234567890" class="btn btn-wa">Hubungi Admin</a>
</div>

</div>
`;
});
}

</script>

</body>
</html>
