<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status Pembayaran</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
<link rel="stylesheet"
href="components/status-pembayaran/status-pembayaran.css">

</head>

<body>

<div class="package-hero">

<div class="package-hero-content">

<h1>Status Pembayaran</h1>

<p>
Pembayaran pesanan kamu
</p>

</div>

</div>

<!-- RESULT LANGSUNG TAMPIL -->
<div class="container" id="resultBox">

<!-- IMAGE PRODUK -->
<div id="productImageBox" class="product-image-box">
  <img id="productImage" src="" alt="Produk">
</div>

<!-- INVOICE -->
<div class="invoice-box" id="invoiceBox">
<div class="invoice-id" id="invoice"></div>
<div class="invoice-status" id="statusText">
Pembayaran Berhasil
</div>
<div class="invoice-price" id="total"></div>
<div class="invoice-time" id="time"></div>
</div>

<!-- DETAIL -->
<h3 class="section-title">

<span class="section-icon icon-purple">
<i class="fa-solid fa-box-open"></i>
</span>

<span>Detail Pesanan</span>

</h3>
    
<div class="summary-box">

<!-- PRODUK -->
<div class="summary-item">
  <div>
    <div class="paket-title" id="paket"></div>
    <div class="paket-sub" id="paketDetail"></div>
  </div>
</div>

<!-- SUBTOTAL -->
<div class="summary-row">
  <span>Subtotal</span>
<div id="harga" class="price-box"></div>
</div>

<!-- DISKON -->
<div class="summary-row">
  <span>Diskon</span>
  <span id="diskon"></span>
</div>

<!-- HEMAT -->
<div class="summary-row">
  <span>Hemat</span>
  <span id="hemat"></span>
</div>

<!-- TOTAL -->
<div class="summary-total">
  <span>Total Bayar</span>
  <span id="total2"></span>
</div>

</div>

<!-- CUSTOMER -->
<h3 class="section-title">

<span class="section-icon icon-blue">
<i class="fa-solid fa-user"></i>
</span>

<span>Informasi Customer</span>

</h3>
    
<div class="detail-box">
<div class="customer-item">

<div class="customer-icon icon-blue">
<i class="fa-solid fa-user"></i>
</div>

<div class="customer-content">

<div class="customer-label">
Nama Customer
</div>

<div class="customer-value" id="nama"></div>

</div>

</div>
    
<div class="customer-item">

<div class="customer-icon icon-green">
<i class="fa-solid fa-mobile-screen-button"></i>
</div>

<div class="customer-content">

<div class="customer-label">
Nomor WhatsApp
</div>

<div class="customer-value" id="wa"></div>

</div>

</div>
    
<div class="customer-item">

<div class="customer-icon icon-gold">
<i class="fa-solid fa-envelope"></i>
</div>

<div class="customer-content">

<div class="customer-label">
Email
</div>

<div class="customer-value" id="email"></div>

</div>

</div>

<!-- STATUS -->
<div class="status-box">
<div class="status-title">✅ Sudah Dibayarkan</div>
<div>Pembayaran telah diterima sebesar <b id="total3"></b></div>
</div>

<!-- KONTAK ADMIN -->
<div class="wa-box">
<div><b>Sudah melakukan pembayaran?</b></div>
<div style="font-size:14px; color:#4b5563; margin-top:6px;">
Segera hubungi admin jika status masih pending
</div>

<button onclick="chatAdmin()" class="wa-btn">
Chat Admin
</button>
</div>

</div>

<!-- JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="components/status-pembayaran/status-pembayaran.js"></script>
</body>
</html>
