<!DOCTYPE html>
<html>
<head>
<title>Status Pembayaran</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="components/status-pembayaran/status-pembayaran.css"> <!-- CSS DI SINI -->
</head>

<body>

<div class="package-hero">
<h1>Status Pembayaran</h1>
<p>Pembayaran pesanan kamu</p>
</div>

<!-- RESULT LANGSUNG TAMPIL -->
<div class="container" id="resultBox">

<!-- IMAGE PRODUK -->
<div id="productImageBox" class="product-image-box">
  <img id="productImage" src="" alt="Produk">
</div>

<!-- INVOICE -->
<div class="invoice-box" id="invoiceBox">
<div class="invoice-id" id="invoice"></div>
<div class="invoice-status" id="statusText">
Pembayaran Berhasil
</div>
<div class="invoice-price" id="total"></div>
<div class="invoice-time" id="time"></div>
</div>

<!-- DETAIL -->
<h3 class="section-title">Detail Pesanan</h3>
<div class="summary-box">

<!-- PRODUK -->
<div class="summary-item">
  <div>
    <div class="paket-title" id="paket"></div>
    <div class="paket-sub" id="paketDetail"></div>
  </div>
</div>

<!-- SUBTOTAL -->
<div class="summary-row">
  <span>Subtotal</span>
<div id="harga" class="price-box"></div>
</div>

<!-- DISKON -->
<div class="summary-row">
  <span>Diskon</span>
  <span id="diskon"></span>
</div>

<!-- HEMAT -->
<div class="summary-row">
  <span>Hemat</span>
  <span id="hemat"></span>
</div>

<!-- TOTAL -->
<div class="summary-total">
  <span>Total Bayar</span>
  <span id="total2"></span>
</div>

</div>

<!-- CUSTOMER -->
<h3 class="section-title">Informasi Customer</h3>
<div class="detail-box">
<div class="detail-row"><span>Nama</span><span id="nama"></span></div>
<div class="detail-row"><span>WhatsApp</span><span id="wa"></span></div>
<div class="detail-row"><span>Email</span><span id="email"></span></div>
</div>

<!-- STATUS -->
<div class="status-box">
<div class="status-title">✅ Sudah Dibayarkan</div>
<div>Pembayaran telah diterima sebesar <b id="total3"></b></div>
</div>

<!-- KONTAK ADMIN -->
<div class="wa-box">
<div><b>Sudah melakukan pembayaran?</b></div>
<div style="font-size:14px; color:#4b5563; margin-top:6px;">
Segera hubungi admin jika status masih pending
</div>

<button onclick="chatAdmin()" class="wa-btn">
Chat Admin
</button>
</div>

</div>

<!-- library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- JS disini -->
<script src="components/status-pembayaran/status-pembayaran.js"></script>
</body>
</html>
