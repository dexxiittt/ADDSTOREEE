  scroll-behavior: smooth;
}

  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

:root {
  --hero-offset: 22vh;

  
  /* MODE TERANG (default) */
  --glow-soft: rgba(255,255,255,0.45);
  --glow-strong: rgba(255,255,255,0.35);
  --shadow-base: rgba(0,0,0,0.25);
  --shadow-contact: rgba(0,0,0,0.18);
  
    /* PREMIUM STATS GLOW */
  --stat-glow-soft: rgba(255,255,255,0.20);
  --stat-glow-strong: rgba(255,255,255,0.38);

  --card-min-width: 360px;
  --grid-max-width: 840px;
  --grid-offset-x: -17px;
}
  
    @media (max-width: 640px) {
  :root {
    --grid-offset-x: 8px;
  }
}

/* MODE GELAP */
@media (prefers-color-scheme: dark) {
  :root {
    --glow-soft: rgba(255,255,255,0.25);
    --glow-strong: rgba(255,255,255,0.18);
    --shadow-base: rgba(0,0,0,0.6);
    --shadow-contact: rgba(0,0,0,0.4);
  }
}

.hero-bg {
  position: relative;
  min-height: 780px; /* kontrol tinggi hero */
}
    .hero-end {
  height: 34vh;
}
    
/* STARFIELD LAYER */
#starfield {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* BACKGROUND UNGU */
.hero-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    #493d84 0%,
    #8662b2 90%
  );
  z-index: 0;
}


    /* FLOATING ICONS CONTAINER */
.floating-icons {
  position: absolute;
  left: 50%;
  top: calc(var(--hero-offset) + 120px);
  transform: translateX(-50%) scale(1);
  width: 480px;
  height: 380px;

  opacity: 1;
  pointer-events: none;
  z-index: 2;

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;

  will-change: transform;
}

.floating-icon i {
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.35));
}

.floating-icon:hover {
  background: rgba(255,255,255,0.25);
    }

.hero-premium-phone.is-idle ~ .floating-icons .floating-icon.left {
  animation-delay: 1.1s;
}

.hero-premium-phone.is-idle ~ .floating-icons .floating-icon.right {
  animation-delay: 0.9s;
}
    
    /* FLOATING ICON BASE */
.floating-icon {
  position: absolute;
  width: 46px;
  height: 46px;
  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  color: white;

  /* GLASS BACKGROUND */
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  /* BORDER HALUS */
  border: 1px solid rgba(255,255,255,0.35);

  /* SHADOW ELEGAN */
  box-shadow:
    0 10px 26px rgba(0,0,0,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.15);

  animation: none;

  will-change: transform;
}

    /* POSISI */
.floating-icon.left {
  left: -30px;
  bottom: 80px;

  animation:
    float-bounce 4.8s ease-in-out infinite,
    float-jiggle 6.5s ease-in-out infinite;
}

.floating-icon.right {
  right: -48px;
  top: 160px;

  animation:
    float-bounce 5.4s ease-in-out infinite,
    float-jiggle 7.2s ease-in-out infinite;
}

.floating-icon.center {
  left: 480px;
  top: 560px;

  animation:
    float-bounce 6s ease-in-out infinite,
    float-jiggle 8s ease-in-out infinite;
}

    @keyframes float-bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-14px);
  }
}

    @keyframes float-jiggle {
  0% {
    rotate: 0deg;
  }
  25% {
    rotate: 1.5deg;
  }
  50% {
    rotate: 0deg;
  }
  75% {
    rotate: -1.5deg;
  }
  100% {
    rotate: 0deg;
  }
    }

}

/*PREMIUM DESCRIPTION */

 /* SUBTITLE */

/* ICON CHECK */

  text-shadow:

}

/* PREMIUM STATS BAR (ABOVE IPHONE) */
.premium-stats {
  position: relative;
  justify-content: center;
  margin-top: 10px;

  transition:
    opacity 1s ease,
    transform 1.1s cubic-bezier(.22,1,.36,1),
    filter 1s ease;

  display: flex;
  gap: 48px;

  z-index: 3;
  pointer-events: none;

/* Base floating */
.premium-stats .stat-item {

  will-change: transform;
}

/* Delay beda tiap item */

}

  animation-delay: 1.6s;
}

@keyframes statFloat {

  50% {

<script>
let latestScrollY = 0;
let ticking = false;
let scrollTimeout;

window.addEventListener('scroll', () => {
  document.body.classList.add('is-scrolling');
  clearTimeout(scrollTimeout);

  scrollTimeout = setTimeout(() => {
    document.body.classList.remove('is-scrolling');
  }, 120);

  latestScrollY = window.scrollY;

  if (!ticking) {
    requestAnimationFrame(() => {
      const parallaxValue = Math.min(latestScrollY * 0.015, 12);

      const stats = document.querySelector('.premium-stats');
      if (stats) {
        stats.style.setProperty('--parallax-y', `${parallaxValue}px`);
      }

      ticking = false;
    });
    ticking = true;
  }
});
</script>

<script>
const canvas = document.getElementById("starfield");
const ctx = canvas.getContext("2d");

const STAR_CONFIG = {
    // Kurangi jumlah sedikit untuk HP low-end agar CPU tidak kerja keras
    amount: window.innerWidth < 768 ? 40 : 28,
    minSize: 0.6,
    maxSize: 2.1,
    glow: 1.1,
    twinkleSpeed: 0.018,
    minSpeed: 0.05,
    maxSpeed: 0.35
};

let stars = [];
let w, h;
let starRunning = true;

// --- OPTIMASI 1: Pre-render Bintang ke Canvas Terpisah (Buffer) ---
const starCache = document.createElement('canvas');
const cacheCtx = starCache.getContext('2d');
starCache.width = 40; 
starCache.height = 40;

// Gambar satu bintang bercahaya di cache (dilakukan cuma sekali saat load)
cacheCtx.fillStyle = "white";
cacheCtx.shadowBlur = 12;
cacheCtx.shadowColor = "rgba(255,255,255,0.8)";
cacheCtx.beginPath();
cacheCtx.arc(20, 20, 5, 0, Math.PI * 2);
cacheCtx.fill();

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    createStars();
}

function createStars() {
    stars = [];
    for (let i = 0; i < STAR_CONFIG.amount; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * (STAR_CONFIG.maxSize - STAR_CONFIG.minSize) + STAR_CONFIG.minSize,
            alpha: Math.random(),
            dir: Math.random() > 0.5 ? 1 : -1,
            speed: Math.random() * (STAR_CONFIG.maxSpeed - STAR_CONFIG.minSpeed) + STAR_CONFIG.minSpeed
        });
    }
}

function draw() {
    if (!starRunning) return;

    // Pakai clearRect agar background CSS kamu tetap terlihat (tidak jadi hitam)
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < stars.length; i++) {
        const s = stars[i];

        // Update posisi & alpha
        s.alpha += STAR_CONFIG.twinkleSpeed * s.dir;
        if (s.alpha <= 0.1 || s.alpha >= 1) s.dir *= -1;
        s.y += s.speed;

        if (s.y > h + 10) {
            s.y = -10;
            s.x = Math.random() * w;
        }

        // --- OPTIMASI 2: Gambar menggunakan drawImage (Jauh lebih ringan dari arc + shadow) ---
        ctx.globalAlpha = s.alpha * STAR_CONFIG.glow;
        // Kita gambar dari starCache, bukan kalkulasi matematis ulang
        ctx.drawImage(starCache, s.x, s.y, s.size * 4, s.size * 4);
    }
    
    // Reset alpha agar tidak mengganggu elemen lain jika ada
    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
}

// --- OPTIMASI 3: Smart Pause (Hanya jalan jika tab aktif) ---
document.addEventListener("visibilitychange", () => {
    starRunning = !document.hidden;
    if (starRunning) requestAnimationFrame(draw);
});

// Tetap gunakan resize listener
window.addEventListener("resize", resize);

resize();
window.scrollTo(0,0);
draw();

// Optimasi Scroll: Cukup pause saat scroll berat untuk menjaga FPS
window.addEventListener("scroll", () => {
    starRunning = false;
    clearTimeout(window.__starResume);
    window.__starResume = setTimeout(() => {
        starRunning = true;
        requestAnimationFrame(draw);
    }, 100);
}, { passive: true }); // Tambahkan passive: true untuk scroll lebih smooth
</script>




<script>
const fadeObserver = new IntersectionObserver(
  entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("is-visible");
        fadeObserver.unobserve(entry.target);
      }
    });
  },
  { threshold: 0.15 }
);

document.querySelectorAll(".fade-on-scroll")
  .forEach(el => fadeObserver.observe(el));
</script>

<script>
const fadeSyncObserver = new IntersectionObserver(
  entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("is-visible");
        fadeSyncObserver.unobserve(entry.target);
      }
    });
  },
  { threshold: 0.12 }
);

document.querySelectorAll(".fade-sync")
  .forEach(el => fadeSyncObserver.observe(el));
</script>
