<!DOCTYPE html>
<html>
<head>
<title>Pilihan Paket</title>

<style>

html{
scroll-behavior:smooth;
}

body.package-page{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
background:#0b0f19;
color:#f9fafb;
min-height:100vh;
}

/* HERO */

.package-hero{
background:linear-gradient(135deg,#493d84,#6d28d9);
padding:72px 20px 56px;
text-align:center;
}

.package-hero h1{
font-family:'Poppins',sans-serif;
font-size:clamp(36px,6vw,100px);
font-weight:800;
margin-bottom:12px;
}

.package-hero p{
font-size:clamp(13px,2.6vw,16px);
line-height:1.6;
opacity:.85;
max-width:520px;
margin:0 auto;
}

/* GLASS CARD (LIGHT VERSION) */

.glass{
background:#161a26;
border-radius:18px;
padding:20px;
margin:18px auto;
max-width:720px;
border:1px solid rgba(255,255,255,.06);
box-shadow:0 6px 16px rgba(0,0,0,.35);
}

/* IMAGE */

.package-info img{
width:100%;
height:clamp(160px,38vw,240px);
object-fit:cover;
border-radius:14px;
}

/* TITLE */

#pkg-title{
font-family:'Poppins',sans-serif;
font-size:26px;
font-weight:700;
margin:10px 0 6px;
}

/* SUBTITLE */

#pkg-subtitle{
font-size:15px;
opacity:.85;
line-height:1.6;
}

/* META */

.package-meta{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
text-align:center;
}

.package-meta span{
display:block;
font-size:12px;
opacity:.65;
margin-bottom:4px;
}

.package-meta b{
font-size:16px;
font-weight:700;
}

/* PRICE */

#pkg-price{
font-family:'DM Sans',sans-serif;
font-size:20px;
font-weight:800;
}

.price-main{
font-size:28px;
font-weight:900;
color:#ffffff;
}

/* GUARANTEE BADGE */

.guarantee-badge{
display:inline-flex;
align-items:center;
justify-content:center;

padding:6px 14px;

border-radius:999px;

font-size:12px;
font-weight:700;

background:#ef4444;
color:#fff;
}

/* PRODUCT NOTE */

.package-product-note{
font-size:14px;
line-height:1.6;
background:#151826;
border:1px solid rgba(255,255,255,.05);
border-radius:16px;
padding:16px;
}

/* NOTE */

.package-note{
font-size:14px;
line-height:1.6;
background:#151826;
border:1px solid rgba(255,255,255,.05);
border-radius:16px;
padding:16px;
}

/* NOTE TITLE */

.note-title{
font-size:12px;
font-weight:600;
margin-bottom:6px;
opacity:.6;
}

/* TRUST */

#pkg-trust{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:8px;
}

#pkg-trust span{
padding:8px 14px;
border-radius:999px;
background:#1c2030;
font-size:13px;
font-weight:600;
}

/* PAY BUTTON */

.pay-button{
display:block;
margin:40px auto 24px;
padding:18px 30px;
border-radius:16px;
text-align:center;
font-size:17px;
font-weight:700;
color:#fff;
text-decoration:none;
background:linear-gradient(135deg,#6d5dfc,#8b5cf6);
box-shadow:0 10px 26px rgba(109,93,252,.35);
}

/* STICKY CTA */

.sticky-cta{
position:fixed;
left:0;
right:0;
bottom:0;
padding:12px 16px;
background:#0f1220;
box-shadow:0 -4px 18px rgba(0,0,0,.45);
display:none;
z-index:999;
}

/* DISCOUNT BADGE */

.discount-badge{
padding:4px 8px;
font-size:11px;
font-weight:700;
background:#ef4444;
border-radius:999px;
color:#fff;
}

/* MOBILE */

@media(max-width:768px){

.glass{
max-width:100%;
}

.package-meta{
gap:10px;
}
}

@media(max-width:480px){

.package-meta{
grid-template-columns:repeat(3,1fr);
}

#pkg-trust span{
font-size:12px;
}
}

/* MOBILE STICKY */

@media(max-width:768px){

.sticky-cta{
display:block;
}
}

*{
box-sizing:border-box;
backface-visibility:hidden;
}
 
</style>
 
</head>
<body class="package-page">
<div id="navbar-placeholder"></div>
<script src="components/navbar.js"></script>

<!-- HEADER GRADIENT -->
<section class="package-hero fade-flow fade-delay-1">
  <h1>Pilihan Paket</h1>
  <p> Informasi Sebelum Melanjutkan</p>
</section>

<section class="package-stage">
  <div class="package-shell">
  
<!-- CARD INFO -->
<section class="package-info glass fade-flow fade-delay-2">
  <img id="pkg-image" alt="Paket" loading="lazy">
  <h2 id="pkg-title"></h2>
  <p id="pkg-subtitle"></p>
</section>

<!-- STATS -->
<section class="package-meta glass fade-flow fade-delay-3">
  <div><span>Durasi</span><b id="pkg-duration"></b></div>
  <div class="meta-price"><span>Harga</span><b id="pkg-price"></b></div>
  <div><span>Garansi</span><b id="pkg-guarantee"></b></div>
</section>
  
<!-- SKELETON LOADING -->
<section id="skeleton-wrap" class="glass">
  <div class="skeleton sk-image"></div>
  <div class="skeleton sk-title"></div>
  <div class="skeleton sk-text"></div>
  <div class="skeleton sk-meta"></div>
  <div class="skeleton sk-button"></div>
</section>

<section class="package-product-note glass fade-flow fade-delay-4" id="pkg-product-note"></section>
<!-- INFO PENTING -->
<section class="package-note glass fade-flow fade-delay-4" id="pkg-note"></section>
  <div id="pkg-trust" class="trust-row fade-flow fade-delay-4"></div>
<a id="pay-btn" class="pay-button fade-flow fade-delay-4">
  Lanjut ke Pembayaran
</a>
    
<!-- CTA -->
<div id="sticky-cta" class="sticky-cta">
  <a id="sticky-pay" class="pay-button">Lanjut ke Pembayaran</a>
</div>
</div>
</section>


<script>
const sk = document.getElementById("skeleton-wrap");
const q = new URLSearchParams(location.search);
const packageId = q.get("package_id");

function parseDiscount(val) {
  if (!val) return 0;

  return Number(
    String(val)
      .replace('%', '')
      .replace(',', '.')
      .trim()
  ) || 0;
}

function hexToRgba(hex, alpha = 1) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

document.getElementById("pay-btn")?.classList.add("is-loading");
fetch("https://opensheet.elk.sh/1JtmaN7ASwvnQzoOKPqVA3Uy85fcNfcLTArYOyQZRV08/PACKAGE_DETAIL")
.then(r=>r.json())
.then(rows=>{
  const data = rows.find(
  i => i.package_id === packageId
);
  if(!data) return;
  sk?.remove();

  // ===== APPLY PRICE & DISCOUNT COLOR FROM SHEET =====
const root = document.documentElement;

// warna harga
if (data.price_color) {
  root.style.setProperty('--price-color', data.price_color);
}

// warna / background + shadow badge diskon
if (data.discount_color) {
  const style = document.createElement("style");

  // ambil warna utama (fallback kalau gradient)
  let shadowColor = data.discount_color;

  if (shadowColor.includes("gradient")) {
    const match = shadowColor.match(/#([0-9a-fA-F]{6})/);
    if (match) shadowColor = match[0];
  }

  style.innerHTML = `
    :root {
      --discount-shadow: ${hexToRgba(shadowColor, 0.65)};
    }
    .discount-badge {
      background: ${data.discount_color} !important;
    }
  `;

  document.head.appendChild(style);
}

 // ===== APPLY TITLE & SUBTITLE GLOW FROM SHEET =====
if (data.color_title_subtitle) {

  const [titleColor, subtitleColor] = 
    data.color_title_subtitle.split("|").map(c => c.trim());

  const colorMap = {
    white: "#ffffff",
    blue: "#60a5fa",
    orange: "#fb923c",
    purple: "#a78bfa"
  };

  const root = document.documentElement;

  if (colorMap[titleColor.toLowerCase()]) {
    root.style.setProperty(
      "--title-glow",
      hexToRgba(colorMap[titleColor.toLowerCase()], 0.75)
    );
  }

  if (colorMap[subtitleColor.toLowerCase()]) {
    root.style.setProperty(
      "--subtitle-glow",
      hexToRgba(colorMap[subtitleColor.toLowerCase()], 0.45)
    );
  }
}

  const stickyPay = document.getElementById("sticky-pay");
  if (stickyPay) {
  stickyPay.href = data.lynk_id;
}
  
  document.getElementById("pay-btn")?.classList.remove("is-loading");
  document.getElementById("pkg-image").src = data.image_url;
 
  const titleEl = document.getElementById("pkg-title");

if (data.badge_icon) {

  const parts = data.badge_icon.split("|").map(s => s.trim());

  const icon = parts[0];
  const iconColor = parts[1];
  const iconIntensity = parseFloat(parts[2]);

  const colorMap = {
    white: "#ffffff",
    blue: "#60a5fa",
    orange: "#fb923c",
    purple: "#a78bfa",
    green: "#22c55e",
    red: "#ef4444",
    gold: "#fbbf24"
  };

  // default intensitas elegan (lebih soft dari title)
  let intensity = 0.6;

  if (!isNaN(iconIntensity)) {
    intensity = Math.min(Math.max(iconIntensity, 0.1), 1);
  }

  if (iconColor && colorMap[iconColor.toLowerCase()]) {
    document.documentElement.style.setProperty(
      "--badge-glow",
      hexToRgba(colorMap[iconColor.toLowerCase()], intensity)
    );
  }

  titleEl.innerHTML = `
    ${data.title}
    <span class="badge-icon">${icon}</span>
  `;

} else {
  titleEl.textContent = data.title;
}
 
  document.getElementById("pkg-subtitle").textContent = data.subtitle;
  document.getElementById("pkg-duration").textContent = data.duration;
 
  const guaranteeEl = document.getElementById("pkg-guarantee");

if (data.guarantee && data.guarantee.toLowerCase() === "nogar") {
  guaranteeEl.innerHTML = `
    <span class="guarantee-badge">NoGar</span>
  `;
} else {
  guaranteeEl.textContent = data.guarantee;
}

  const trustWrap = document.getElementById("pkg-trust");

if (trustWrap && data.trust_points) {
  const points = data.trust_points.split("|").map(t => t.trim());
  const icons  = (data.trust_icons || "").split("|").map(i => i.trim());

  trustWrap.innerHTML = points.map((text, i) => {
    const icon = icons[i] || "✔";
    return `<span>${icon} ${text}</span>`;
  }).join("");

  trustWrap.querySelectorAll('span').forEach((el, i) => {
  el.style.setProperty('--i', i);
});
}
  
  // harga setelah diskon
const priceEl = document.getElementById("pkg-price");

const price = Number(data.price) || 0;
const discount = parseDiscount(data.discount);

const final = discount > 0
  ? Math.round(price - (price * discount / 100))
  : price;

if (discount > 0) {
  priceEl.innerHTML = `
    <span style="
  font-size:12px;
  opacity:.6;
  text-decoration:line-through;
  margin-right:6px
">
      Rp${price.toLocaleString("id-ID")}
    </span>

    <span class="price-animate price-main">
      Rp${final.toLocaleString("id-ID")}
    </span>

    <span class="discount-badge">
  -${discount.toFixed(2).replace('.', ',')}%
    </span>
  `;
} else {
  priceEl.innerHTML = `
    <span class="price-animate" style="
      font-size:17px;
      font-weight:800;
    ">
      Rp${price.toLocaleString("id-ID")}
    </span>
  `;
}

// ===== PRODUCT NOTE =====
const productNoteEl = document.getElementById("pkg-product-note");

if (data.not_product && productNoteEl) {

  const lines = data.not_product
    .split("|")
    .map(t => t.trim())
    .filter(t => t.length > 0);

  const feature = (data.is_featured || "").toLowerCase();

if (feature.includes("soft")) {
  productNoteEl.classList.add("soft-highlight");
}

if (feature.includes("glow")) {
  productNoteEl.classList.add("glow-highlight");
}

if (feature.includes("strong")) {
  productNoteEl.classList.add("premium-highlight");
}

  productNoteEl.innerHTML = `
    <div class="product-note-title">Informasi Paket</div>
    ${lines.map(line => `
      <div class="product-note-line">${line}</div>
    `).join("")}
  `;

} else {
  productNoteEl?.remove();
}
 
const noteEl = document.getElementById("pkg-note");

if (data.not_legal) {
  const lines = data.not_legal
  .split("|")
  .map(t => t.trim())
  .filter(t => t.length > 0); // ⬅️ ini penting

// render judul + baris
const firstLine = lines[0];
const restLines = lines.slice(1);

noteEl.innerHTML = `
  <div class="note-title">
  <span class="note-icon">ⓘ</span>Catatan Penting </div>
  <div class="note-line">${firstLine}</div>

  <div class="note-extra">
    ${restLines.map(line => `<div class="note-line">${line}</div>`).join("")}
  </div>
`;

  // kalau lebih dari 1 baris → collapse
  if (lines.length > 1) {
    noteEl.classList.add("collapsed");

    const toggle = document.createElement("button");
    toggle.className = "note-toggle";
    toggle.textContent = "Selengkapnya…";

    toggle.onclick = () => {
  const expanded = noteEl.classList.toggle("expanded");

  // reset animasi
  toggle.style.animation = "none";
  toggle.offsetHeight; // force reflow

  if (expanded) {
    noteEl.classList.remove("collapsed");
    toggle.textContent = "Tutup";
  } else {
    noteEl.classList.add("collapsed");
    toggle.textContent = "Selengkapnya…";
  }

  // trigger ulang animasi yg sama
  toggle.style.animation = "toggle-fade-in .35s ease forwards";
};

    noteEl.appendChild(toggle);
  }

} else {
  noteEl.remove();
}
  document.getElementById("pay-btn").href = data.lynk_id;
});

const mainCTA = document.getElementById("pay-btn");
const stickyCTA = document.getElementById("sticky-cta");

if (mainCTA && stickyCTA) {
  const obs = new IntersectionObserver(
    ([e]) => stickyCTA.style.opacity = e.isIntersecting ? "0" : "1",
    { threshold: 0.6 }
  );
  obs.observe(mainCTA);
}

const payBtn = document.getElementById("pay-btn");
const noteEl = document.getElementById("pkg-note");
const trustEl = document.getElementById("pkg-trust");

if (payBtn && noteEl) {
  payBtn.addEventListener("click", () => {
    // auto collapse not_legal
    noteEl.classList.remove("expanded");
    noteEl.classList.add("collapsed");

    // optional: collapse / hide trust
    if (trustEl) {
      trustEl.style.opacity = "0";
      trustEl.style.transform = "translateY(-6px)";
    }
  });
}

</script>

<div id="footer-container"></div>

<link rel="stylesheet" href="components/footer.css">
<script src="components/footer.js"></script>
</body>
</html>
